<title>Del Barrio a las Estrellas</title>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Año 2187: estadio bajo cúpula, cal de neón y luz de focos. Menús sobre un partido de exhibición en otro planeta. */
:root{
  --bg:#060b14;            /* espacio */
  --panel:#0b1524;
  --panel2:#12223a;
  --edge:#23405f;
  --line:#e6f0f7;
  --muted:#8ea6bd;
  --flood:#ffd03d;         /* foco */
  --flood-ink:#1a1405;
  --neon:#5ef2d6;          /* líneas de neón */
  --good:#5fe08c;
  --bad:#ff6a58;
  --display:'Teko','Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow','Segoe UI',system-ui,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--line);overflow:hidden;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--flood);outline-offset:2px}

/* ---------- menús ---------- */
#ui{position:fixed;inset:0;overflow-y:auto;background:linear-gradient(180deg,rgba(6,11,20,.78),rgba(6,11,20,.92) 55%,rgba(6,11,20,.97));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(18px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--display);font-weight:600;line-height:.82;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.brand.big{font-size:clamp(54px,12vw,120px)}
.brand.big em{font-style:normal;color:var(--neon);display:block}
.brand.mid{font-size:clamp(34px,7vw,52px)}
.lede{font-size:17px;line-height:1.5;color:var(--muted);max-width:60ch;margin:0}
.eyebrow{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.btn{border:1px solid var(--edge);background:var(--panel2);border-radius:6px;padding:12px 18px;font-family:var(--cond);font-weight:700;font-size:18px;letter-spacing:.04em;text-transform:uppercase;transition:transform .08s,background .15s}
.btn:hover{background:#1a3150}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--flood);color:var(--flood-ink);border-color:var(--flood)}
.btn.go:hover{background:#ffdc66}
.btn.small{padding:7px 12px;font-size:15px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.danger{border-color:#6d2a22;background:#2a1411}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:14px 16px}
.tile:hover{background:var(--panel2)}
.tile.on{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon) inset}
.tile b{font-family:var(--display);font-weight:500;font-size:28px;line-height:.9;text-transform:uppercase}
.tile span{color:var(--muted);font-size:14px}
.topbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.topbar .who{flex:1;min-width:0}
.topbar h2{font-family:var(--display);font-weight:500;font-size:34px;line-height:.9;margin:0;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coins{font-family:var(--display);font-size:28px;color:var(--flood);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.coins i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,var(--flood) 50%,#b08300);display:inline-block}
.crest{--c1:#d7263d;--c2:#f5f5f0;width:46px;height:54px;flex:none;display:grid;place-items:center;clip-path:polygon(50% 0,100% 12%,100% 58%,50% 100%,0 58%,0 12%);background:linear-gradient(135deg,var(--c1) 0 50%,var(--c2) 50% 100%);font-family:var(--display);font-weight:700;font-size:18px;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000}
.crest.lg{width:84px;height:98px;font-size:30px}
.next{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.next .side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.next .side b{font-family:var(--display);font-weight:500;font-size:24px;line-height:.95;text-transform:uppercase;overflow-wrap:anywhere}
.vs{font-family:var(--display);font-size:42px;color:var(--flood)}
.ovr{font-family:var(--display);font-size:22px;line-height:1;padding:2px 8px;border-radius:4px;background:#08111d;border:1px solid var(--edge);font-variant-numeric:tabular-nums}
.planet{width:22px;height:22px;border-radius:50%;flex:none;display:inline-block;box-shadow:inset -4px -3px 6px #0008}
.planet.lg{width:46px;height:46px}
.where{display:flex;gap:12px;align-items:center;background:#08111d;border:1px solid var(--edge);border-radius:6px;padding:10px 12px}
.where p{margin:2px 0 0;color:var(--muted);font-size:14px;line-height:1.4}
.spc{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;vertical-align:2px}
.spc.H{background:#3a2f1a;color:#ffd99a}.spc.A{background:#1f3a1c;color:#a6f08f}.spc.R{background:#25303c;color:#bcd2e6}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid #1a2f48}
th{font-family:var(--cond);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.me td{color:var(--flood);font-weight:700}
tr.up td:first-child{box-shadow:inset 3px 0 var(--good)}
tr.down td:first-child{box-shadow:inset 3px 0 var(--bad)}
.tbl{overflow-x:auto}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:8px 10px;text-align:left;width:100%}
.pl.sel{border-color:var(--flood);box-shadow:0 0 0 1px var(--flood) inset}
.pl .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pl .sub{font-size:13px;color:var(--muted);font-weight:400}
.pos{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.06em;padding:3px 0;border-radius:4px;text-align:center}
.pos.POR{background:#4a3c0e;color:#ffd96a}.pos.DEF{background:#123a5c;color:#9fd1ff}.pos.MED{background:#16482c;color:#8ff0b2}.pos.DEL{background:#5a1c1c;color:#ffaaa0}
.slot{font-family:var(--cond);font-size:12px;color:var(--muted);letter-spacing:.08em}
.attr{display:grid;grid-template-columns:110px 1fr 44px auto;gap:10px;align-items:center}
.bar{height:8px;border-radius:4px;background:#08111d;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #0006;outline:2px solid transparent;outline-offset:2px}
.sw.on{outline-color:var(--flood)}
input[type=text]{background:#08111d;border:1px solid var(--edge);border-radius:6px;color:var(--line);font:600 20px var(--body);padding:10px 12px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--edge);background:var(--panel);border-radius:5px;padding:8px 14px;font-family:var(--cond);font-weight:600;font-size:16px;display:inline-flex;gap:8px;align-items:center}
.seg button.on{background:var(--flood);color:var(--flood-ink);border-color:var(--flood)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center}
kbd{font-family:var(--cond);font-weight:700;background:#08111d;border:1px solid var(--edge);border-bottom-width:3px;border-radius:5px;padding:2px 8px;font-size:15px;white-space:nowrap}
.result{font-family:var(--display);font-size:clamp(64px,16vw,120px);line-height:.85;text-align:center;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:14px;line-height:1.45}
.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--flood)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:0}
.facts dt{font-family:var(--cond);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:13px}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;gap:10px}
.pcard h3{font-family:var(--display);font-weight:500;font-size:30px;line-height:.9;margin:0;text-transform:uppercase}
.pcard p{margin:0;line-height:1.45;font-size:15px}

/* ---------- marcador y controles ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#board{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;align-items:stretch;font-family:var(--display);font-size:26px;line-height:1;background:#060b14e6;border:1px solid #2a4a6a;border-radius:5px;overflow:hidden}
#board>span{padding:6px 10px 2px;display:flex;align-items:center;gap:8px}
#board .tm{text-transform:uppercase}
#board .tm i{width:6px;height:20px;border-radius:2px;display:inline-block}
#board .sc{background:var(--line);color:#060b14;font-weight:600;font-variant-numeric:tabular-nums;padding-inline:12px}
#board .clk{background:var(--flood);color:var(--flood-ink);font-variant-numeric:tabular-nums;min-width:44px;justify-content:center}
#pchip{position:absolute;top:calc(52px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:center;font-family:var(--cond);font-weight:600;font-size:15px;background:#060b14cc;border-radius:4px;padding:3px 10px 3px 6px}
#pchip .wind{display:inline-flex;gap:4px;align-items:center;color:#ffcf9a}
#pchip .wind b{display:inline-block;font-size:17px;line-height:1}
#pauseBtn{position:absolute;pointer-events:auto;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:6px;border:1px solid #2a4a6a;background:#060b14e6;display:grid;place-items:center}
#pauseBtn::before{content:"";width:14px;height:16px;border-left:5px solid var(--line);border-right:5px solid var(--line);box-sizing:border-box}
#msg{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(60px,14vw,150px);line-height:.8;text-transform:uppercase;color:var(--flood);text-shadow:0 4px 0 #000a,0 0 40px #000;opacity:0;transition:opacity .25s;padding-inline:16px}
#msg small{display:block;font-size:.3em;color:var(--line);font-weight:500;margin-top:10px}
#msg.on{opacity:1}
#tick{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(84px + env(safe-area-inset-top,0px));font-family:var(--cond);font-weight:600;font-size:17px;background:#060b14c8;padding:4px 10px;border-radius:4px;opacity:0;transition:opacity .3s}
#tick.on{opacity:1}
#pname{position:absolute;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));font-family:var(--cond);font-weight:700;font-size:17px;background:#060b14c8;border-radius:4px;padding:4px 12px;display:flex;gap:10px;align-items:center;white-space:nowrap}
#pname .st{width:60px;height:6px;border-radius:3px;background:#0008;overflow:hidden}
#pname .st i{display:block;height:100%;background:var(--good)}
#rot{display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:#060b14e6;border:1px solid #2a4a6a;border-radius:6px;padding:8px 14px;font-family:var(--cond);font-weight:600;font-size:16px;white-space:nowrap}
@media (orientation:portrait) and (pointer:coarse){#rot{display:block}}
#touch{position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:0;bottom:0;width:50%;height:65%;pointer-events:auto;touch-action:none}
#joyBase{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:2px solid #ffffff40;background:#ffffff10;display:none}
#joyKnob{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#ffffff55;border:2px solid #fff8;display:none}
#pads{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:230px;height:200px;pointer-events:none}
.pad{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.04em;border:2px solid #fff6;color:#fff;background:#0009}
.pad.on{background:#ffd03dcc;color:#1a1405}
#pShoot{width:86px;height:86px;right:0;bottom:22px;background:#b3261ecc}
#pPass{width:74px;height:74px;right:96px;bottom:0;background:#1d6fd1cc}
#pLob{width:64px;height:64px;right:62px;bottom:116px;background:#2b8a4fcc}
#pSprint{width:60px;height:60px;right:160px;bottom:96px}
@media (prefers-reduced-motion:reduce){#msg,#tick{transition:none}}
</style>

<canvas id="cv"></canvas>
<div id="hud" hidden>
  <div id="board"><span class="tm" id="hA"></span><span class="sc" id="hS">0 - 0</span><span class="tm" id="hB"></span><span class="clk" id="hT">0'</span></div>

</div>

<script>
(function(){
'use strict';
/* ================================================================
   Constantes del campo (metros). El equipo 0 ataca hacia x=105.
   ================================================================ */
const FW=105, FH=68, CY=34, GW=3.66, GH=2.44, K=0.6, PS=1.35;
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hyp=Math.hypot;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function seeded(seed){let s=(seed>>>0)||1;return ()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function hashStr(t){let h=2166136261;for(const c of t){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtG=g=>(g/9.81).toFixed(2).replace('.',',')+' g';

/* ================================================================
   Planetas: cada estadio cambia la física del partido
   g: gravedad (m/s²) · drag: frenado del aire (1/s) · mu: rozamiento del suelo
   bounce: rebote · trac: agarre de las botas · spd: velocidad punta · stam: gasto de energía
   wind: fuerza máxima del viento (m/s²)
   ================================================================ */
const PLANETS={
 tierra:{n:'Tierra',sub:'Estadio Neo-Madrid',g:9.81,drag:.02,mu:.46,bounce:.45,trac:1,spd:1,stam:1,wind:0,
  air:'Normal',ground:'Césped',
  desc:'El campo de referencia: gravedad, aire y césped de siempre.',tip:'Lo que funciona aquí funciona en casi todas partes.',
  grass:['#2c7a44','#337f4a'],out:'#1f5a35',line:'#d9fff4',neon:'#5ef2d6',sky:['#050b1c','#0f2546'],body:'moon',
  css:'radial-gradient(circle at 35% 35%,#8fe0ff,#1b6fd1 50%,#0a2a5a)'},
 luna:{n:'Luna',sub:'Cúpula del Mar de la Tranquilidad',g:1.62,drag:0,mu:.5,bounce:.62,trac:.5,spd:.92,stam:.8,wind:0,
  air:'Sin aire',ground:'Regolito compactado',
  desc:'Los balones altos flotan durante segundos y rebotan mucho. Los jugadores saltan tanto que cabecean a 4 metros de altura.',tip:'Juega por el suelo: un pase alto tarda tanto en caer que da tiempo a cortarlo.',
  grass:['#6b6e74','#74777d'],out:'#4b4e54',line:'#f3f6ff',neon:'#9ec5ff',sky:['#000000','#04060c'],stars:1,body:'earth',craters:1,
  css:'radial-gradient(circle at 35% 35%,#eeeeee,#9a9a9a 55%,#4a4a4a)'},
 marte:{n:'Marte',sub:'Arena de Valles Marineris',g:3.71,drag:.012,mu:.5,bounce:.5,trac:.75,spd:1,stam:.9,wind:2.4,
  air:'Muy fino, con tormentas de polvo',ground:'Arena roja',
  desc:'Gravedad baja y viento: el balón en el aire se desvía hacia donde sopla la tormenta (mira la flecha junto al marcador).',tip:'Chuta raso o a favor del viento.',
  grass:['#a4492b','#ad5231'],out:'#7d3520',line:'#ffe6d6',neon:'#ff9b5e',sky:['#2a120b','#7a4126'],body:'sun',dust:1,
  css:'radial-gradient(circle at 35% 35%,#ffb08a,#c1440e 55%,#5a1e08)'},
 europa:{n:'Europa',sub:'Pista helada de Conamara',g:1.31,drag:0,mu:.08,bounce:.5,trac:.28,spd:1.05,stam:.85,wind:0,
  air:'Sin aire',ground:'Hielo',
  desc:'El balón casi no frena y los jugadores patinan: cuesta arrancar, frenar y girar.',tip:'Pases cortos y anticipa las frenadas. Un balón suelto acaba fuera.',
  grass:['#b9dff0','#c6e7f5'],out:'#8fbcd4',line:'#1d4f8f',neon:'#2a7bd6',sky:['#01030a','#0a1430'],stars:1,body:'jupiter',cracks:1,
  css:'radial-gradient(circle at 35% 35%,#ffffff,#b8d4e0 50%,#7a6a58)'},
 titan:{n:'Titán',sub:'Estadio del Lago Kraken',g:1.35,drag:.25,mu:.5,bounce:.4,trac:.7,spd:.88,stam:1.2,wind:0,
  air:'Muy densa (1,5 veces la de la Tierra)',ground:'Dunas compactadas',
  desc:'El aire denso frena el balón: los tiros lejanos pierden fuerza y los pases largos se quedan cortos. Correr cuesta más.',tip:'Acércate al área antes de chutar.',
  grass:['#8a6a2a','#937232'],out:'#6a4f1c',line:'#fff0cc',neon:'#ffc35e',sky:['#3a2810','#a06e2a'],body:'saturn',haze:'rgba(214,150,60,.16)',
  css:'radial-gradient(circle at 35% 35%,#ffd38a,#c08a2e 55%,#5a3a0e)'},
 kepler:{n:'Kepler-442b',sub:'Coliseo de la Supertierra',g:17.5,drag:.04,mu:.42,bounce:.35,trac:1.1,spd:.82,stam:1.7,wind:0,
  air:'Densa',ground:'Musgo azul',
  desc:'Casi el doble de gravedad: el balón pesa, los pases altos caen enseguida, se corre más despacio y el cansancio llega antes.',tip:'No abuses del sprint y deja descansar a los cansados.',
  grass:['#2a6b6b','#2f7575'],out:'#1e5050',line:'#e7d6ff',neon:'#c38bff',sky:['#120822','#3b1d5a'],body:'redsun',
  css:'radial-gradient(circle at 35% 35%,#9ff0e0,#2a8a8a 55%,#103a3a)'}
};
const PKEYS=Object.keys(PLANETS);
function planetPhys(key){
  const P={...PLANETS[key],key};
  P.dec=Math.max(.12,P.mu*P.g);
  P.bth=Math.max(.6,2.2*Math.sqrt(P.g/9.81));
  P.jump=clamp(.45*(9.81/P.g-1),-.3,2.2);
  P.hop=clamp(.35*(1-P.g/9.81),0,.3);
  P.ve=clamp(Math.sqrt(P.dec)*5,8,10);
  return P;
}

/* ================================================================
   Especies
   ================================================================ */

function genPlayer(pos,lvl,rng,sp){
  rng=rng||Math.random;sp=sp||'H';
  const r=()=>(rng()*2-1);
  const p={id:UID++,pos,sp,name:playerName(sp,rng),age:sp==='R'?1+Math.floor(rng()*12):18+Math.floor(rng()*16),skin:Math.floor(rng()*6),hair:Math.floor(rng()*HAIR.length)};
  const key={DEF:{def:13,fis:8,pac:4},MED:{pas:13,pac:5,sho:4,def:4},DEL:{sho:13,pac:9,fis:4}}[pos];
  for(const [a] of ATTR){
    let v;
    if(pos==='POR') v={por:lvl+6,fis:lvl-5,pac:lvl-12,pas:lvl-12,sho:lvl-25,def:lvl-20}[a]+r()*5;
    else if(a==='por') v=15+rng()*15;
    else v=lvl-9+(key[a]||0)+r()*6;
    if(a!=='por'||pos==='POR')v+=SPMOD[sp][a]||0;
    p[a]=clamp(Math.round(v),20,99);
  }

}
function genSquad(lvl,rng,sp){
  rng=rng||Math.random;
  const sq=[];const plan=[['POR',2],['DEF',6],['MED',6],['DEL',4]];
  for(const [pos,n] of plan)for(let i=0;i<n;i++)sq.push(genPlayer(pos,lvl+(i<3?2:-3)+Math.round(rng()*4-2),rng,sp));
  return sq;
}
function autoLineup(squad,form){
  const used=new Set(),out=[];
  for(const s of FORM[form]){
    const want=ROLE2POS[s[0]];
    let best=null;
    for(const p of squad)if(!used.has(p.id)&&p.pos===want&&(!best||ovr(p)>ovr(best)))best=p;
    if(!best)for(const p of squad)if(!used.has(p.id)&&(!best||ovr(p)>ovr(best)))best=p;
    used.add(best.id);out.push(best.id);
  }
  return out;
}
function teamName(used,sp){
  const [pre,place]=TEAMN[sp||'H'];
  for(let i=0;i<60;i++){const n=pick(pre)+' '+pick(place);if(!used.has(n)){used.add(n);return n;}}
  return 'Club '+Math.floor(rnd(100,999));
}
const ALLPRE=[...TEAMN.H[0],...TEAMN.A[0],...TEAMN.R[0],'Club'];
function shortOf(name){
  let w=name.trim();
  for(const p of ALLPRE)if(w.startsWith(p+' ')){w=w.slice(p.length+1);break;}
  w=w.replace(/^(del|de|la|las|los|el|san|santa)\s+/i,'').replace(/^(la|las|los|el)\s+/i,'');
  return (w.replace(/[^A-Za-z0-9ÁÉÍÓÚÑáéíóúñ]/g,'').slice(0,3)||'FC').toUpperCase();
}

function roundRobin(n){
  let arr=[...Array(n).keys()];const rounds=[];
  for(let r=0;r<n-1;r++){
    const pr=[];
    for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];pr.push(r%2?[a,b]:[b,a]);}
    rounds.push(pr);
    arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
  return rounds.concat(rounds.map(r=>r.map(([a,b])=>[b,a])));
}
function newLeague(){
  const d=DIVS[SV.div];const used=new Set([SV.club.name]);
  const teams=[{name:SV.club.name,short:SV.club.short,c1:SV.club.c1,c2:SV.club.c2,user:true,sp:'H',planet:SV.planet}];
  const sps=['H','H','A','A','R','R',pick(['H','A','R'])].sort(()=>Math.random()-.5);
  for(let i=0;i<7;i++){
    const sp=sps[i],name=teamName(used,sp);
    const c1=pick(KIT);let c2=pick(KIT);while(c2===c1)c2=pick(KIT);
    teams.push({name,short:shortOf(name),c1,c2,sp,planet:pick(SP_HOME[sp]),rating:Math.round(d.lvl+rnd(-5,5)),form:pick(Object.keys(FORM))});
  }
  teams.forEach(t=>Object.assign(t,{pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}));
  SV.league={teams,fix:roundRobin(8),round:0,scorers:{}};
}

function userRating(){

  return Math.round(L.reduce((s,p)=>s+ovr(p),0)/L.length);
}
function teamRating(t){return t.user?userRating():t.rating;}
function poisson(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function simScore(ra,rb){
  const la=1.35*Math.exp((ra-rb)/16)+0.15, lb=1.15*Math.exp((rb-ra)/16);
  return [Math.min(9,poisson(la)),Math.min(9,poisson(lb))];
}
function record(lg,h,a,gh,ga){
  const A=lg.teams[h],B=lg.teams[a];
  A.pj++;B.pj++;A.gf+=gh;A.gc+=ga;B.gf+=ga;B.gc+=gh;
  if(gh>ga){A.g++;B.p++;A.pts+=3;}else if(gh<ga){B.g++;A.p++;B.pts+=3;}else{A.e++;B.e++;A.pts++;B.pts++;}
}
function standings(){
  return SV.league.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);
}
function userFixture(){
  const lg=SV.league;if(lg.round>=lg.fix.length)return null;
  const pr=lg.fix[lg.round].find(([a,b])=>a===0||b===0);
  return {home:pr[0]===0,opp:pr[0]===0?pr[1]:pr[0],pair:pr};
}

const SND={ac:null,crowd:null,noise:null};
function audioInit(){
  if(SND.ac||!SV||!SV.sound)return;
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();SND.ac=ac;
    const len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    let b0=0,b1=0,b2=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=.99765*b0+w*.0990460;b1=.96300*b1+w*.2965164;b2=.57000*b2+w*1.0526913;d[i]=(b0+b1+b2+w*.1848)*.18;}
    SND.noise=buf;
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=.6;
    const g=ac.createGain();g.gain.value=0;
    src.connect(f);f.connect(g);g.connect(ac.destination);src.start();
    SND.crowd=g;SND.crowdF=f;
  }catch(e){SND.ac=null;}
}
function crowdLevel(v,t){if(!SND.crowd)return;const ac=SND.ac;SND.crowd.gain.cancelScheduledValues(ac.currentTime);SND.crowd.gain.setTargetAtTime(v,ac.currentTime,t||.5);}
function roar(){if(!SND.crowd)return;const ac=SND.ac,g=SND.crowd.gain,t=ac.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(.55,t+.4);g.setTargetAtTime(.12,t+2.2,1.2);}
function sKick(p){
  const ac=SND.ac;if(!ac||!SV||!SV.sound)return;const t=ac.currentTime;
  const heavy=M&&M.P?clamp(M.P.g/9.81,.5,1.6):1;
  const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150/Math.sqrt(heavy),t);o.frequency.exponentialRampToValueAtTime(55,t+.12);
  g.gain.setValueAtTime(.25+p*.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.16);
  const n=ac.createBufferSource();n.buffer=SND.noise;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1600;const g2=ac.createGain();
  g2.gain.setValueAtTime(.25*p+.08,t);g2.gain.exponentialRampToValueAtTime(.001,t+.06);n.connect(f);f.connect(g2);g2.connect(ac.destination);n.start(t,Math.random());n.stop(t+.07);
}
function sWhistle(n){
  const ac=SND.ac;if(!ac||!SV||!SV.sound)return;let t=ac.currentTime;
  for(let i=0;i<(n||1);i++){
    const L=i===(n||1)-1?.7:.25;
    const o=ac.createOscillator(),l=ac.createOscillator(),lg=ac.createGain(),g=ac.createGain();
    o.type='triangle';o.frequency.value=2850;l.frequency.value=28;lg.gain.value=140;l.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.setValueAtTime(.12,t+L-.05);g.gain.linearRampToValueAtTime(0,t+L);
    o.connect(g);g.connect(ac.destination);o.start(t);l.start(t);o.stop(t+L);l.stop(t+L);t+=L+.12;
  }
}

function maxSpd(p,sprint){

function kickoff(team){
  const b=M.ball;
  M.kickTeam=team;
  for(const T of M.teams)for(const p of T.pl){
    p.x=lx(T.idx,p.bx);p.y=p.by;p.vx=p.vy=p.wx=p.wy=0;p.face=T.dir>0?0:Math.PI;p.cool=p.stun=p.slide=p.dive=0;p.setPiece=null;p.hold=0;
    if(T.idx!==team){const d=hyp(p.x-52.5,p.y-CY);if(d<9.6){p.x=52.5-T.dir*9.6*Math.abs(p.x-52.5)/Math.max(d,.1)-T.dir*.5;}}
  }

  const fw=T.pl.filter(p=>p.role==='FW').sort((a,c)=>Math.abs(a.y-CY)-Math.abs(c.y-CY))[0]||T.pl[10];
  fw.x=52.5-T.dir*.7;fw.y=CY;fw.setPiece='kick';

}

function minute(){return Math.min(90,Math.floor(M.t/M.total*90));}

/* ---------- física del balón simulada (para calcular pases y tiros en cada planeta) ---------- */
function sim(vh,vz,d,mode){
  const P=M.P,dt=1/60;let x=0,z=vz>0?.05:0,v=vh,w=vz,t=0;
  for(let i=0;i<1500;i++){
    x+=v*dt;
    if(z>0||w>0){
      w-=P.g*dt;z+=w*dt;
      if(z<=0){z=0;if(mode==='land')return {x,t:t+dt,v};if(w<-P.bth){w=-w*P.bounce;v*=.82;}else w=0;}
      if(P.drag){const f=Math.exp(-P.drag*dt);v*=f;w*=f;}
    }else{v=Math.max(0,v-P.dec*dt);if(P.drag)v*=Math.exp(-P.drag*dt);}
    t+=dt;
    if(mode==='reach'&&x>=d)return {x,t,v,z};
    if(v<=.01&&z<=0&&w<=0)return null;
  }
  return null;
}
function groundShot(d){ // velocidad para que un pase raso llegue a d con velocidad ve
  let lo=2,hi=34,r=null;
  for(let i=0;i<16;i++){const m=(lo+hi)/2,q=sim(m,0,d,'reach');if(!q||q.v<M.P.ve)lo=m;else{hi=m;r=q;}}
  return {v:hi,t:r?r.t:d/hi};
}
function lobShot(d){ // vuelo con altura según el planeta
  const h=clamp(2.5+d*.09,3,8),vz=Math.sqrt(2*M.P.g*h);
  let lo=1,hi=42,r=null;
  for(let i=0;i<16;i++){const m=(lo+hi)/2,q=sim(m,vz,0,'land');if(!q||q.x<d)lo=m;else{hi=m;r=q;}}
  return {v:hi,vz,t:r?r.t:2*vz/M.P.g};
}
function shotVz(v,d,zt){
  let lo=-3,hi=34;
  for(let i=0;i<18;i++){const m=(lo+hi)/2,q=sim(v,m,d,'reach');const z=q?q.z:-1;if(z<zt)lo=m;else hi=m;}
  return (lo+hi)/2;
}

/* ---------- pases, tiros, entradas ---------- */
function kick(p,vx,vy,vz,power){
  const b=M.ball;b.owner=null;b.vx=vx;b.vy=vy;b.vz=vz||0;if(b.vz>0)b.z=Math.max(b.z,.05);
  b.last=p.team;b.lastP=p;b.target=null;b.lob=false;p.cool=.32;p.setPiece=null;p.hold=0;
  sKick(power??.4);
}
function laneMin(a,t,opp){
  let m=99;const dx=t.x-a.x,dy=t.y-a.y,L2=dx*dx+dy*dy||1;
  for(const o of opp){const u=((o.x-a.x)*dx+(o.y-a.y)*dy)/L2;if(u<.05||u>1.05)continue;const px=a.x+dx*u,py=a.y+dy*u;m=Math.min(m,hyp(o.x-px,o.y-py));}
  return m;
}
function nearOpp(p,opp){let m=99;for(const o of opp)m=Math.min(m,hyp(o.x-p.x,o.y-p.y));return m;}
function bestPass(p,o){
  o=o||{};
  const team=M.teams[p.team],opp=M.teams[1-p.team].pl;let best=null;
  // en planetas de poca gravedad los balones altos flotan demasiado; en Titán el aire los frena
  const lobPen=M.P.g<3?.6:M.P.drag>.2?.4:0;
  for(const t of team.pl){
    if(t===p)continue;
    const dx=t.x-p.x,dy=t.y-p.y,d=hyp(dx,dy);
    if(d<4||d>(o.dir?62:48))continue;
    if(o.box&&(lx(p.team,t.x)<84||Math.abs(t.y-CY)>18))continue;
    const lane=laneMin(p,t,opp),open=nearOpp(t,opp);
    let sc,type='ground';
    if(o.dir){
      const c=(dx*o.dir[0]+dy*o.dir[1])/d;if(c<.5)continue;
      sc=c*2.2-d/45+Math.min(open,6)/14-(lane<1.4?.4:0);
      if(o.lob)type='lob';
    }else{
      const prog=(lx(p.team,t.x)-lx(p.team,p.x))/30;
      sc=prog*1.3+Math.min(open,8)/8*.8-(lane<2?1.3:0)-(open<2.5?.5:0)-d/70+(t.role==='GK'?-1:0);
      if(d>30||(lane<2&&d>12)){type='lob';if(lane<2)sc+=1;sc-=.35+lobPen;}
      if(o.box){type='lob';sc=open/5-Math.abs(t.y-CY)/20;}
    }
    if(!best||sc>best.sc)best={t,sc,type,d};
  }
  return best;
}
function doPass(p,t,type,through){
  const b=M.ball;
  const fwd=M.teams[t.team].dir;
  let tx=t.x,ty=t.y,time=.5,sol=null;
  for(let k=0;k<3;k++){
    tx=clamp(t.x+t.vx*time*.85+(through?fwd*6:0),1,FW-1);ty=clamp(t.y+t.vy*time*.85,1,FH-1);
    const d=hyp(tx-p.x,ty-p.y);
    sol=type==='lob'?lobShot(d):groundShot(d);time=sol.t;
  }
  const noise=(1-p.s.pas/100)*(p.sp==='R'?.5:1);
  const ang=Math.atan2(ty-p.y,tx-p.x)+(Math.random()*2-1)*noise*.16;
  let v=sol.v,vz=0;
  if(type==='lob'){v*=1+(Math.random()*2-1)*noise*.15;vz=sol.vz;}
  p.face=ang;
  kick(p,Math.cos(ang)*v,Math.sin(ang)*v,vz,type==='lob'?.5:.3);
  b.target=t;b.lob=type==='lob';
  if(M.human===p.team&&p.team===t.team){M.ctrl=t;M.switchT=.5;}
}
function passInSpace(p,dir){const v=groundShot(14).v;kick(p,dir[0]*v,dir[1]*v,0,.3);}
function shoot(p,power,aim){
  const gx=attX(p.team),sk=p.s.sho/100;
  let ty=CY+aim*(GW-.55);
  const spN=p.sp==='R'?.7:p.sp==='H'?.9:1;
  ty+=(Math.random()*2-1)*(1.15-sk)*2.4*(.55+power)*spN;
  const v=15+power*15+sk*5;
  const d=hyp(gx-p.x,ty-p.y);
  let zt=.25+power*1.5+(power>.86?(power-.86)*14:0)+Math.random()*(1.1-sk)*1.2*spN;
  if(M.human>=0&&p.team!==M.human)zt=Math.max(.2,zt*(M.diff.sh>1?.92:1.05));
  const vz=shotVz(v,d,zt);
  const ang=Math.atan2(ty-p.y,gx-p.x);p.face=ang;
  kick(p,Math.cos(ang)*v,Math.sin(ang)*v,vz,.8+power*.2);
  M.ball.shot=true;
}
function tackleTry(tk,own,bonus){
  const drib=own.s.pas*.4+own.s.pac*.3+own.s.fis*.3+(own.sp==='R'?8:0);
  let pr=.42+(tk.s.def-drib)/100+(bonus||0)+(tk.sp==='A'?.05:0);
  if(M.human>=0&&tk.team!==M.human)pr*=M.diff.tk;
  if(M.human>=0&&tk.team===M.human&&tk!==M.ctrl)pr*=.5;
  pr=clamp(pr,.08,.9);
  if(Math.random()<pr){
    const b=M.ball;b.owner=null;const a=Math.atan2(own.y-tk.y,own.x-tk.x)+rnd(-.9,.9);
    b.vx=Math.cos(a)*rnd(2,5);b.vy=Math.sin(a)*rnd(2,5);b.last=tk.team;b.lastP=tk;b.target=null;
    own.cool=.7;own.stun=.35;tk.cool=0;sKick(.2);return true;
  }
  tk.stun=.55;tk.cool=.4;return false;
}

/* ---------- inteligencia ---------- */
function moveTo(p,x,y,spd){
  const dx=x-p.x,dy=y-p.y,d=hyp(dx,dy);
  if(d<.25){p.wx=p.wy=0;return;}
  const s=Math.min(spd,d*2.2);p.wx=dx/d*s;p.wy=dy/d*s;
}
function interceptPoint(){
  const b=M.ball,P=M.P;
  if(b.owner)return [b.x,b.y];
  if(b.z>.3||b.vz>0){ // punto de caída, con el aire y la gravedad del planeta
    let x=b.x,y=b.y,z=b.z,vx=b.vx,vy=b.vy,vz=b.vz;const dt=1/30,f=P.drag?Math.exp(-P.drag*dt):1;
    for(let i=0;i<360;i++){x+=vx*dt;y+=vy*dt;vz-=P.g*dt;z+=vz*dt;vx*=f;vy*=f;vz*=f;if(M.wind.x||M.wind.y){vx+=M.wind.x*dt;vy+=M.wind.y*dt;}if(z<=0)break;}
    return [clamp(x,-1,FW+1),clamp(y,-1,FH+1)];
  }
  const sp=hyp(b.vx,b.vy),t=Math.min(sp/P.dec,.9);
  return [b.x+b.vx*t*.7,b.y+b.vy*t*.7];
}
function slotPos(p,team,phase){
  const b=M.ball,bl=lx(team.idx,b.x);
  let x=p.bx+(bl-45)*.6;
  if(phase==='att')x+=8;else if(phase==='def')x-=4;
  if(p.role==='DF')x=clamp(x,10,62);else if(p.role==='MF')x=clamp(x,18,80);else x=clamp(x,30,92);
  if(phase==='def'&&p.role!=='FW')x=Math.min(x,bl-2+(p.role==='MF'?7:0));
  if(phase==='att'&&p.role==='FW'){x=Math.min(Math.max(x,bl+5+Math.sin(M.t*.4+p.by)*3),93);}
  x=Math.max(x,6);
  let y=CY+(p.by-CY)*(phase==='att'?1.08:.78)+(b.y-CY)*.3;
  return [lx(team.idx,x),clamp(y,2.5,FH-2.5)];
}
function teamAI(team,dt){
  const b=M.ball,own=b.owner;
  let phase=own?(own.team===team.idx?'att':'def'):'loose';
  if(!own&&b.target&&b.target.team===team.idx)phase='att';
  if(!own&&!b.target&&M.lastPoss===team.idx&&b.shot!==true&&hyp(b.vx,b.vy)>3)phase='att';
  const ctrl=M.human===team.idx?M.ctrl:null;
  const ip=interceptPoint();
  const out=team.pl.filter(p=>p.role!=='GK'&&p!==ctrl);
  out.sort((a,c)=>hyp(a.x-ip[0],a.y-ip[1])-hyp(c.x-ip[0],c.y-ip[1]));
  let ch1=out[0],ch2=out[1];
  if(ctrl){
    const dc=hyp(ctrl.x-ip[0],ctrl.y-ip[1]),d1=ch1?hyp(ch1.x-ip[0],ch1.y-ip[1]):99;
    if(phase==='loose'&&dc<d1+2)ch1=null;
    if(phase==='def'&&dc<d1){ch2=ch1;ch1=null;}
  }
  for(const p of team.pl){
    if(p===ctrl)continue;
    p.sprint=false;
    if(p.stun>0||p.slide>0)continue;
    if(p.role==='GK'){gkAI(p,dt);continue;}
    if(own===p){ownerAI(p,dt);continue;}
    if(phase==='att'&&b.target===p){const q=interceptPoint();p.sprint=true;moveTo(p,q[0],q[1],maxSpd(p,true));continue;}
    if(phase!=='att'&&p===ch1){
      p.sprint=true;
      if(own){
        const gx=ownX(team.idx),dx=gx-b.x,dy=CY-b.y,d=hyp(dx,dy)||1;
        const dOwn=hyp(p.x-own.x,p.y-own.y),close=dOwn<3.5;
        p.sprint=!close;
        moveTo(p,b.x+dx/d*1.1,b.y+dy/d*1.1,maxSpd(p,!close));
        if((dOwn<1.5||hyp(p.x-b.x,p.y-b.y)<1.3)&&own.role!=='GK'){p.tk=(p.tk||0)+dt;if(p.tk>.7){p.tk=0;if(Math.random()<.5)tackleTry(p,own);}}
      }else moveTo(p,ip[0],ip[1],maxSpd(p,true));
      continue;
    }
    if(phase==='def'&&p===ch2){
      const gx=ownX(team.idx),dx=gx-b.x,dy=CY-b.y,d=hyp(dx,dy)||1;
      moveTo(p,b.x+dx/d*5,b.y+dy/d*5,maxSpd(p,false));continue;
    }
    const [tx,ty]=slotPos(p,team,phase);
    const d=hyp(tx-p.x,ty-p.y);p.sprint=d>9&&(M.P.stam<1.5||d>18);
    moveTo(p,tx,ty,maxSpd(p,p.sprint)*(d>3?1:.6));
  }
}
function ownerAI(p,dt){
  const team=M.teams[p.team],opp=M.teams[1-p.team].pl;
  if(M.state!=='play')return;
  p.dec-=dt;p.hold+=dt;
  if(p.setPiece){
    p.wx=p.wy=0;
    if(p.hold<.5)return;
    const bp=bestPass(p,{box:p.setPiece==='corner'&&M.P.g>=3})||bestPass(p);
    if(bp)doPass(p,bp.t,p.setPiece==='throw'?'ground':bp.type);
    else passInSpace(p,[team.dir,0]);
    return;
  }
  const gx=attX(p.team),dG=hyp(gx-p.x,CY-p.y),press=nearOpp(p,opp);
  // con aire denso los tiros lejanos no compensan
  const range=M.P.drag>.2?25:30;
  if(p.dec<=0){
    p.dec=.22+Math.random()*.25;
    const loc=lx(p.team,p.x);
    if(dG<range&&loc>70){
      const angOk=Math.abs(p.y-CY)<dG*.8;
      let pr=(range-dG)/range*.7+(press<2.5?.2:0)+(dG<16?.25:0);
      if(M.human>=0&&p.team!==M.human)pr*=M.diff.sh;
      if(angOk&&Math.random()<pr){
        const gk=M.teams[1-p.team].pl[0];
        const aim=(gk.y>CY?-1:1)*rnd(.35,.95);
        shoot(p,clamp(.4+dG/45+rnd(-.1,.12),.4,.84),aim);return;
      }
    }
    const bp=bestPass(p);
    if(bp){
      const need=press<2.3?-.4:(press<4?.25:.75);
      if(bp.sc>need&&Math.random()<(press<2.3?.7:.3)){doPass(p,bp.t,bp.type);return;}
    }
  }
  let tx=gx-team.dir*6,ty=CY+(p.y-CY)*.5;
  let dx=tx-p.x,dy=ty-p.y,d=hyp(dx,dy)||1;dx/=d;dy/=d;
  let ax=0,ay=0;
  for(const o of opp){const ox=p.x-o.x,oy=p.y-o.y,od=hyp(ox,oy);if(od<6&&od>.01){const ahead=-(ox*dx+oy*dy)/od;if(ahead>-.2){const w=(6-od)/6;ax+=ox/od*w*1.4;ay+=oy/od*w*1.4;}}}
  if(p.y<5)ay+=.8;if(p.y>FH-5)ay-=.8;
  dx+=ax;dy+=ay;d=hyp(dx,dy)||1;
  p.sprint=press>1.6;
  const s=maxSpd(p,p.sprint);p.wx=dx/d*s;p.wy=dy/d*s;
}
function gkAI(p,dt){
  const b=M.ball,T=M.teams[p.team],gx=ownX(p.team),din=T.dir;
  if(b.owner===p){
    p.hold+=dt;moveTo(p,gx+din*(p.setPiece?5.5:7),CY,2);
    if(p.hold>1.2&&M.state==='play'){const bp=bestPass(p);if(bp)doPass(p,bp.t,bp.d>26&&M.P.g>=3?'lob':'ground');else{const a=din>0?0:Math.PI;const L=lobShot(40);kick(p,Math.cos(a)*L.v,rnd(-4,4),L.vz,.6);}}
    return;
  }
  let tx,ty,spd=maxSpd(p,false);
  if(!b.owner&&b.vx*-din>3){
    const tt=(gx-b.x)/b.vx;
    if(tt>0&&tt<2){const yAt=b.y+b.vy*tt;if(Math.abs(yAt-CY)<GW+1.3){tx=gx+din*.6;ty=clamp(yAt,CY-GW+.3,CY+GW-.3);spd=6.5+p.s.por*.045;if(Math.abs(ty-p.y)>1&&tt<.55&&p.dive<=0)p.dive=.7;}}
  }
  if(tx===undefined){
    const bl=lx(p.team,b.x),inBox=bl<16.5&&Math.abs(b.y-CY)<20.2,db=hyp(b.x-p.x,b.y-p.y);
    const rival=b.owner&&b.owner.team!==p.team;
    if((!b.owner&&inBox&&b.z<1.8&&(db<9||nearestOf(M.all,b.x,b.y)===p))||(rival&&inBox&&db<5.5)){tx=b.x;ty=b.y;spd=maxSpd(p,true);}
    else{const dx=b.x-gx,dy=b.y-CY,d=hyp(dx,dy)||1,r=clamp(d*.1,.8,4);tx=gx+dx/d*r;ty=clamp(CY+dy/d*r,CY-GW+.4,CY+GW-.4);spd*=.85;}
  }
  moveTo(p,tx,ty,spd);
}

/* ---------- jugador humano ---------- */
const IN={mx:0,my:0,sprint:false,pass:false,lob:false,shootDown:false,shootUp:false,shootP:false,swap:false,keys:{}};
function inputDir(){const m=hyp(IN.mx,IN.my);return m>.2?[IN.mx/m,IN.my/m]:null;}
function clearEdges(){IN.pass=IN.lob=IN.shootUp=IN.shootP=IN.swap=false;}
function humanUpdate(dt){
  const c=M.ctrl,b=M.ball;if(!c)return;
  const dir=inputDir();
  if(c.stun<=0&&c.slide<=0){
    if(dir){const m=Math.min(1,hyp(IN.mx,IN.my));const s=maxSpd(c,IN.sprint)*m;c.wx=dir[0]*s;c.wy=dir[1]*s;c.sprint=IN.sprint;}
    else if(!b.owner&&b.target===c){const q=interceptPoint();moveTo(c,q[0],q[1],maxSpd(c,false));c.sprint=false;}
    else{c.wx=c.wy=0;c.sprint=false;}
  }
  const canAct=M.state==='play'&&c.stun<=0&&c.slide<=0;
  const fdir=dir||[Math.cos(c.face),Math.sin(c.face)];
  if(b.owner===c){
    if(canAct&&IN.pass){
      const bp=bestPass(c,{dir:fdir});
      if(bp)doPass(c,bp.t,'ground',IN.sprint);else passInSpace(c,fdir);
    }else if(canAct&&IN.lob){
      const bp=bestPass(c,{dir:fdir,lob:true});
      if(bp)doPass(c,bp.t,'lob');else{const L=lobShot(22);kick(c,fdir[0]*L.v,fdir[1]*L.v,L.vz,.5);}
    }
    if(IN.shootDown){M.charging=true;M.shotCharge=Math.min(1,M.shotCharge+dt*1.15);}
    if(IN.shootUp&&M.charging&&canAct){
      const gk=M.teams[1-c.team].pl[0];
      const aim=Math.abs(IN.my)>.3?clamp(IN.my*1.2,-1,1):(gk.y>CY?-.7:.7);
      shoot(c,M.shotCharge,aim);M.charging=false;M.shotCharge=0;
    }
  }else{
    if(M.charging&&IN.shootUp){
      const d=hyp(b.x-c.x,b.y-c.y);
      if(!b.owner&&d<1.8&&b.z<2.2+Math.max(0,M.P.jump)&&canAct){shoot(c,Math.max(.5,M.shotCharge),(Math.random()<.5?-.6:.6));}
      M.charging=false;M.shotCharge=0;
    }
    if(IN.shootP&&!M.charging&&canAct){
      const own=b.owner;
      if(own&&own.team!==c.team&&hyp(own.x-c.x,own.y-c.y)<1.7&&own.role!=='GK')tackleTry(c,own,.05);
      else if(own&&own.team!==c.team){c.slide=.42;const a=c.face,v=10*Math.sqrt(M.P.trac);c.vx=Math.cos(a)*v;c.vy=Math.sin(a)*v;}
      else M.charging=true;
    }
    if(IN.shootDown&&M.charging)M.shotCharge=Math.min(1,M.shotCharge+dt*1.15);
    if(canAct&&(IN.pass||IN.swap))switchPlayer();
  }
  clearEdges();
}
function switchPlayer(){
  const b=M.ball,T=M.teams[M.human];
  M.ctrl=nearestOf(T.pl.filter(p=>p.role!=='GK'&&p!==M.ctrl),b.x,b.y);M.switchT=.6;
}
function autoSwitch(dt){
  const b=M.ball,T=M.teams[M.human];M.switchT-=dt;
  if(b.owner){
    if(b.owner.team===M.human&&b.owner!==M.ctrl&&b.owner.role!=='GK')M.ctrl=b.owner;
  }else if(!b.target&&M.switchT<=0){
    const ip=interceptPoint();const best=nearestOf(T.pl.filter(p=>p.role!=='GK'),ip[0],ip[1]);
    if(best!==M.ctrl&&hyp(best.x-ip[0],best.y-ip[1])+3.5<hyp(M.ctrl.x-ip[0],M.ctrl.y-ip[1])){M.ctrl=best;M.switchT=.6;}
  }
}
function onPossession(team){
  if(team===M.lastPoss)return;M.lastPoss=team;
  if(M.human>=0&&team!==M.human){
    const b=M.ball,T=M.teams[M.human];
    M.ctrl=nearestOf(T.pl.filter(p=>p.role!=='GK'),b.x,b.y);M.switchT=.6;M.charging=false;M.shotCharge=0;
  }
}

/* ---------- reanudaciones ---------- */
function restart(type,team,x,y){
  const b=M.ball,T=M.teams[team];
  const tk=type==='goalkick'?T.pl[0]:nearestOf(T.pl.filter(p=>p.role!=='GK'),x,y);
  let face;
  if(type==='throw'){face=y<CY?Math.PI/2:-Math.PI/2;tk.x=x;tk.y=y<CY?-.4:FH+.4;}
  else if(type==='corner'){face=Math.atan2(CY-y,lx(team,88)-x);tk.x=x-Math.cos(face)*.6;tk.y=y-Math.sin(face)*.6;}
  else{face=T.dir>0?0:Math.PI;tk.x=x;tk.y=y;}
  tk.face=face;tk.vx=tk.vy=0;tk.setPiece=type==='goalkick'?'gk':type;tk.hold=0;tk.cool=0;tk.stun=0;
  Object.assign(b,{vx:0,vy:0,vz:0,z:0,owner:tk,target:null,lob:false,shot:false,last:team,lastP:tk});
  b.x=tk.x+Math.cos(face)*.6;b.y=tk.y+Math.sin(face)*.6;

  M.lastPoss=team;
  if(M.human===team){if(tk.role!=='GK')M.ctrl=tk;}
  else if(M.human>=0)M.ctrl=nearestOf(M.teams[M.human].pl.filter(p=>p.role!=='GK'),b.x,b.y);

function lineCross(side,y,z){

function goal(team){
  const b=M.ball;M.score[team]++;

/* ---------- paso de simulación ---------- */
function step(dt){
  const b=M.ball;
  if(M.msgT>0){M.msgT-=dt;if(M.msgT<=0)$('#msg').classList.remove('on');}
  if(M.tickT>0){M.tickT-=dt;if(M.tickT<=0)$('#tick').classList.remove('on');}
  if(M.P.wind){ // la tormenta cambia de dirección poco a poco
    M.wind.a+=(Math.sin(M.t*.13)*.6+Math.sin(M.t*.031)*.4)*dt*.35;
    const s=M.P.wind*(.55+.45*Math.sin(M.t*.21+1));
    M.wind.x=Math.cos(M.wind.a)*s;M.wind.y=Math.sin(M.wind.a)*s;
  }
  if(M.state==='kickoff'){
    M.stateT-=dt;
    if(M.stateT<=0){M.state='play';if(!M.demo)sWhistle(1);}
    clearEdges();animIdle(dt);return;
  }
  if(M.state==='half'||M.state==='end'){
    M.stateT-=dt;animIdle(dt);moveBall(dt,true);
    if(M.stateT<=0){
      if(M.state==='half'){M.half=2;kickoff(1);}
      else{M.state='over';if(M.onEnd)M.onEnd();}
    }
    return;
  }
  if(M.state==='over')return;
  if(M.state==='goal'){
    M.stateT-=dt;
    for(const p of M.all){p.wx*=.9;p.wy*=.9;}
    movePlayers(dt);moveBall(dt,true);
    if(M.stateT<=0)kickoff(M.kickTeam);
    return;
  }
  if(M.state==='restart'){
    M.stateT-=dt;
    for(const T of M.teams)teamAI(T,dt);
    const tk=b.owner;if(tk){tk.wx=tk.wy=0;tk.vx=tk.vy=0;}
    if(M.human>=0&&M.ctrl&&M.ctrl!==tk)humanUpdate(dt);else clearEdges();
    movePlayers(dt);
    if(tk){b.x=tk.x+Math.cos(tk.face)*.6;b.y=tk.y+Math.sin(tk.face)*.6;}
    if(M.stateT<=0){M.state='play';if(tk)tk.hold=0;}
    return;
  }
  M.t+=dt;
  if(M.half===1&&M.t>=M.total/2){M.t=M.total/2;M.state='half';M.stateT=2.6;if(!M.demo){say('Descanso',M.score.join(' - '),2.4);sWhistle(2);}return;}
  if(M.t>=M.total){M.t=M.total;M.state='end';M.stateT=2.6;if(!M.demo){say('Final',M.score.join(' - '),2.6);sWhistle(3);roar();}return;}
  for(const T of M.teams)teamAI(T,dt);
  if(M.human>=0){autoSwitch(dt);humanUpdate(dt);}
  movePlayers(dt);
  moveBall(dt,false);
}
function animIdle(dt){for(const p of M.all){p.wx=p.wy=0;}movePlayers(dt);const b=M.ball;if(b.owner){b.x=b.owner.x+Math.cos(b.owner.face)*.6;b.y=b.owner.y+Math.sin(b.owner.face)*.6;}}
function movePlayers(dt){
  const all=M.all,P=M.P;
  for(const p of all){
    p.cool=Math.max(0,p.cool-dt);p.stun=Math.max(0,p.stun-dt);p.dive=Math.max(0,p.dive-dt);
    if(p.slide>0){p.slide-=dt;const f=1-.04*Math.max(.3,P.trac);p.vx*=f;p.vy*=f;}
    else if(p.stun>0){const f=1-.15*P.trac;p.vx*=f;p.vy*=f;}
    else{
      const acc=(p.role==='GK'&&p.dive>0?30:17)*P.trac*(p.sp==='A'?1.25:p.sp==='R'?.8:1)*dt;
      let dx=p.wx-p.vx,dy=p.wy-p.vy,d=hyp(dx,dy);
      if(d>acc){dx=dx/d*acc;dy=dy/d*acc;}
      p.vx+=dx;p.vy+=dy;
    }
    const sp=hyp(p.vx,p.vy);
    if(p.sp==='R')p.stam=1;
    else if(p.sprint&&sp>4)p.stam=Math.max(0,p.stam-dt*.11*(1.35-p.s.fis/100)*P.stam);
    else p.stam=Math.min(1,p.stam+dt*.045*(p.sp==='H'?1.6:1)/Math.max(.8,P.stam*.8));
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(sp>.6&&p.slide<=0){let a=Math.atan2(p.vy,p.vx)-p.face;a=Math.atan2(Math.sin(a),Math.cos(a));p.face+=a*Math.min(1,dt*(M.ball.owner===p?9:12)*(p.sp==='R'?.7:1));}
    p.anim+=sp*dt*1.9*(P.hop>.1?.6:1);
  }
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    const a=all[i],c=all[j],dx=c.x-a.x,dy=c.y-a.y,d=hyp(dx,dy);
    if(d<.9&&d>.001){const push=(.9-d)/2,ux=dx/d,uy=dy/d;a.x-=ux*push;a.y-=uy*push;c.x+=ux*push;c.y+=uy*push;}
  }
  for(const p of all){p.x=clamp(p.x,-3,FW+3);p.y=clamp(p.y,-2,FH+2);}
}
function moveBall(dt,dead){
  const b=M.ball,P=M.P;
  if(b.owner){
    const o=b.owner;b.x=o.x+Math.cos(o.face)*.6;b.y=o.y+Math.sin(o.face)*.6;b.z=0;b.vx=o.vx;b.vy=o.vy;b.vz=0;b.rot+=hyp(o.vx,o.vy)*dt*3;
    if(!dead){
      if(b.y<-.15||b.y>FH+.15){b.owner=null;restart('throw',1-o.team,clamp(b.x,1,FW-1),b.y<0?.2:FH-.2);if(!M.demo)tick('Saque de banda');return;}
      if(b.x<-.05){b.owner=null;lineCross(0,b.y,0);return;}
      if(b.x>FW+.05){b.owner=null;lineCross(1,b.y,0);return;}
      ballContacts(dt);
    }
    return;
  }
  const px=b.x;
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.z>0||b.vz>0){
    b.vz-=P.g*dt;b.z+=b.vz*dt;
    if(b.z<=0){b.z=0;if(b.vz<-P.bth){b.vz=-b.vz*P.bounce;b.vx*=.82;b.vy*=.82;}else{b.vz=0;b.lob=false;}}
    if(P.drag){const f=Math.exp(-P.drag*dt);b.vx*=f;b.vy*=f;b.vz*=f;}
    if(M.wind.x||M.wind.y){b.vx+=M.wind.x*dt;b.vy+=M.wind.y*dt;}
  }else{
    const sp=hyp(b.vx,b.vy);
    if(sp>0){let ns=Math.max(0,sp-P.dec*dt);if(P.drag)ns*=Math.exp(-P.drag*dt);b.vx*=ns/sp;b.vy*=ns/sp;}
    if(sp<4)b.shot=false;
  }
  b.rot+=hyp(b.vx,b.vy)*dt*3;
  if(dead){
    if(b.x<0||b.x>FW){const gx=b.x<0?-1.8:FW+1.8;if((b.x<0&&b.x<gx)||(b.x>FW&&b.x>gx)){b.x=gx;b.vx*=-.15;}
      if(Math.abs(b.y-CY)<GW+.5){b.y=clamp(b.y,CY-GW+.1,CY+GW-.1);if(b.z>GH-.1){b.z=GH-.1;b.vz=-Math.abs(b.vz)*.3;}}}
    else if(b.y<-3||b.y>FH+3){b.vx*=.8;b.vy*=.8;}
    return;
  }
  if(px>=0&&b.x<0){lineCross(0,b.y,b.z);return;}
  if(px<=FW&&b.x>FW){lineCross(1,b.y,b.z);return;}
  if(b.y<-.15||b.y>FH+.15){restart('throw',1-b.last,clamp(b.x,1,FW-1),b.y<0?.2:FH-.2);if(!M.demo)tick('Saque de banda');b.shot=false;return;}
  ballContacts(dt);
}
function ballContacts(dt){
  const b=M.ball,P=M.P;
  for(const p of M.all){
    if(p.slide>0&&p.stun<=0){
      const d=hyp(b.x-p.x,b.y-p.y);
      if(d<1.4&&b.z<.8){
        if(b.owner&&b.owner.team!==p.team){if(b.owner.role!=='GK')tackleTry(p,b.owner,.25);p.slide=0;}
        else if(!b.owner){b.owner=p;b.target=null;b.last=p.team;b.lastP=p;p.slide=0;onPossession(p.team);}
      }
    }
  }
  if(b.owner)return;
  const sp=hyp(b.vx,b.vy);
  let best=null,bd=99;
  for(const p of M.all){
    if(p.cool>0||p.stun>0)continue;
    const d=hyp(b.x-p.x,b.y-p.y);
    if(p.role==='GK'){
      const inArea=lx(p.team,b.x)<18&&Math.abs(b.y-CY)<21;
      const reach=1+p.s.por/100*.9+(p.dive>0?.9:0)+(p.sp==='A'?.35:0);
      if(inArea&&d<reach&&b.z<2.55+Math.max(0,P.jump)*.5){
        if(sp<12&&b.z<2.3&&(!b.shot||sp<9)){if(d<bd){bd=d;best=p;}continue;}
        let pr=.3+p.s.por/125-(sp-16)/38+(M.human>=0&&p.team!==M.human?M.diff.gk:0);
        if(M.human>=0&&p.team===M.human)pr+=.02;
        if(Math.random()<clamp(pr,.12,.93)){
          if(sp<21&&Math.random()<.5){b.owner=p;b.target=null;b.shot=false;b.last=p.team;b.lastP=p;p.hold=0;onPossession(p.team);if(!M.demo)tick('Atrapa '+p.name);return;}
          const din=M.teams[p.team].dir;b.vx=din*Math.abs(b.vx)*rnd(.25,.45);b.vy=rnd(-9,9);b.vz=rnd(1.5,4)*Math.sqrt(P.g/9.81);b.last=p.team;b.lastP=p;b.shot=false;p.cool=.5;
          if(!M.demo)tick('¡Paradón de '+p.name+'!');sKick(.6);return;
        }
        p.cool=.9;continue;
      }
      continue;
    }
    const zr=1.9+P.jump*(p.sp==='A'?1.3:1);
    if(d<.9&&b.z<zr&&d<bd){
      if(p.team!==b.last&&sp>8&&b.target&&Math.random()>.35+p.s.def/200){p.cool=.25;continue;}
      bd=d;best=p;}
  }
  if(!best)return;
  const p=best;
  if(p.role==='GK'){b.owner=p;b.target=null;b.last=p.team;b.lastP=p;p.hold=0;b.shot=false;onPossession(p.team);return;}
  // cabezazo en el área
  if(b.z>1.05&&b.lob&&lx(p.team,p.x)>85&&Math.abs(p.y-CY)<14){
    const gx=attX(p.team),ty=CY+rnd(-GW+.6,GW-.6)+(Math.random()*2-1)*(1-p.s.sho/100)*3;
    const a=Math.atan2(ty-p.y,gx-p.x),v=13+p.s.sho*.07,d=hyp(gx-p.x,ty-p.y);
    kick(p,Math.cos(a)*v,Math.sin(a)*v,shotVz(v,d,rnd(.3,1.8))-b.z*.5,.7);b.shot=true;
    if(!M.demo&&p.team===M.human)tick('¡Cabezazo!');return;
  }
  if(sp>17&&b.target!==p&&Math.random()>.3+p.s.def/250){b.vx*=-.25;b.vy=b.vy*.3+rnd(-4,4);b.vz=Math.max(b.vz,rnd(0,2));b.last=p.team;b.lastP=p;p.cool=.4;b.shot=false;return;}
  b.owner=p;b.target=null;b.lob=false;b.shot=false;b.last=p.team;b.lastP=p;p.hold=0;p.dec=.15+Math.random()*.2;b.z=0;b.vz=0;
  if(p.setPiece)p.setPiece=null;
  onPossession(p.team);
}

addEventListener('keydown',e=>{
  if(!inMatch())return;

  if(paused)return;
  audioInit();
  if(KEYMAP[e.code]){IN.keys[KEYMAP[e.code]]=true;keyAxis();e.preventDefault();}
  if(e.repeat)return;
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')IN.sprint=true;
  if(e.code==='KeyJ'||e.code==='Space'){IN.pass=true;e.preventDefault();}
  if(e.code==='KeyL')IN.lob=true;
  if(e.code==='KeyK'){IN.shootDown=true;IN.shootP=true;}
  if(e.code==='KeyQ')IN.swap=true;
});
addEventListener('keyup',e=>{
  if(KEYMAP[e.code]){IN.keys[KEYMAP[e.code]]=false;keyAxis();}
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')IN.sprint=false;
  if(e.code==='KeyK'&&IN.shootDown){IN.shootDown=false;IN.shootUp=true;}

  const mk=(lvl,seed,sp)=>{const rng=seeded(seed),sq=genSquad(lvl,rng,sp),form=pick(Object.keys(FORM)),lu=autoLineup(sq,form);sq.forEach((p,i)=>p.num=i+1);return {name:'Demo',short:'DEM',c1:'#d7263d',c2:'#f3f3ee',form,players:lu.map(id=>sq.find(p=>p.id===id))};};
  const sa=SV?'H':pick(sps);let sb=pick(sps);if(sb===sa)sb=sa==='H'?'A':'R';
  const a=mk(70,Math.random()*1e9,sa),b=mk(70,Math.random()*1e9,sb);
  a.c1=SV?SV.club.c1:'#d7263d';a.c2=SV?SV.club.c2:'#f3f3ee';b.c1=pick(['#1b4fd1','#7b2cbf','#1f9d55','#ff7a1a']);b.c2='#f3f3ee';
  demoPlanet=planet||pick(PKEYS);
  makeMatch({teams:[a,b],human:-1,dur:30,diff:1,demo:true,planet:demoPlanet,onEnd:()=>demoMatch()});
  M.state='play';
}

/* ---------- arrancar un partido jugable ---------- */
function oppSide(t){
  const rng=seeded(hashStr(t.name+(SV?SV.season:0)));
  const sq=genSquad(t.rating,rng,t.sp||'H');sq.forEach((p,i)=>p.num=i+1);
  const form=t.form||'4-4-2';const lu=autoLineup(sq,form);
  return {name:t.name,short:t.short,c1:t.c1,c2:t.c2,form,players:lu.map(id=>sq.find(p=>p.id===id))};
}
function userSide(){
  return {name:SV.club.name,short:SV.club.short,c1:SV.club.c1,c2:SV.club.c2,form:SV.form,players:SV.lineup.map(id=>SV.squad.find(p=>p.id===id))};
}
let CUR=null;
function startMatch(c){
  CUR=c;
  makeMatch({teams:[userSide(),oppSide(c.opp)],human:0,dur:SV.dur,diff:SV.diff,planet:c.planet,onEnd:()=>setTimeout(endMatch,50)});
  mode='match';paused=false;
  $('#ui').hidden=true;$('#hud').hidden=false;$('#touch').hidden=!touchMode;
  hudCache='';updHud(true);
  audioInit();crowdLevel(.12,.8);
  IN.keys={};keyAxis();IN.sprint=false;IN.shootDown=false;
  const P=M.P;say(P.n,fmtG(P.g)+' · '+P.ground,1.4);
}
function togglePause(){
  if(!inMatch())return;
  paused=!paused;
  if(paused){crowdLevel(.03,.2);showPause();}
  else{$('#ui').hidden=true;crowdLevel(.12,.5);}
}
function showPause(){
  $('#ui').hidden=false;const P=M.P;
  W$(`<div class="card" style="text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:10vh">
    <div class="eyebrow">Pausa · ${minute()}' · ${esc(P.n)}</div>
    <div class="result">${M.score[0]} - ${M.score[1]}</div>
    <p class="note" style="max-width:52ch;margin:0">${esc(P.desc)} <b>Consejo:</b> ${esc(P.tip)}</p>
    <div class="row" style="justify-content:center">
      <button class="btn go" data-act="resume">Seguir jugando</button>
      <button class="btn danger" data-act="quit">Abandonar</button>
    </div>
    <p class="note">Si abandonas un partido de liga, pierdes 0-3.</p>
  </div>`);
}
function endMatch(){
  const sc=M.score.slice(),goals=M.goals.slice();
  mode='menu';paused=false;$('#hud').hidden=true;$('#touch').hidden=true;$('#ui').hidden=false;
  crowdLevel(0,.8);
  finishMatch(sc[0],sc[1],goals,false);
  demoMatch(CUR.planet);
}
function finishMatch(gu,go,goals,simulated){
  const c=CUR;const m=c.league?DIVS[SV.div].m:.5;
  let coins=gu>go?300:gu===go?120:50;coins=Math.round((coins+gu*25)*m);
  SV.coins+=coins;
  const res={gu,go,goals,coins,opp:c.opp,home:c.home,league:c.league,simulated,planet:c.planet};
  if(c.league){
    const lg=SV.league,fx=userFixture();
    const [h,a]=fx.pair;record(lg,h,a,fx.home?gu:go,fx.home?go:gu);
    for(const g of goals)if(g.team===0&&!/p\.p\./.test(g.name))lg.scorers[g.name]=(lg.scorers[g.name]||0)+1;
    for(const [x,y] of lg.fix[lg.round]){if(x===0||y===0)continue;const [g1,g2]=simScore(teamRating(lg.teams[x])+2,teamRating(lg.teams[y]));record(lg,x,y,g1,g2);}
    lg.round++;
    res.season=lg.round>=lg.fix.length;
  }
  save();
  showResult(res);
}

  W$(`${topbar(true)}
    <h2 class="brand mid">Ajustes</h2>
    <div class="card" style="display:flex;flex-direction:column;gap:16px">
      <div><div class="eyebrow" style="margin-bottom:8px">Dificultad</div><div class="seg">${DIFF.map((d,i)=>`<button class="${SV.diff===i?'on':''}" data-act="diff" data-v="${i}">${d.n}</button>`).join('')}</div></div>
      <div><div class="eyebrow" style="margin-bottom:8px">Duración del partido</div><div class="seg">${[2,4,6,8].map(v=>`<button class="${SV.dur===v?'on':''}" data-act="dur" data-v="${v}">${v} min</button>`).join('')}</div></div>
      <div><div class="eyebrow" style="margin-bottom:8px">Estadio de tu club</div><div class="seg">${PKEYS.map(k=>`<button class="${SV.planet===k?'on':''}" data-act="spl" data-k="${k}">${planetDot(k)}${esc(PLANETS[k].n)}</button>`).join('')}</div></div>
      <div><div class="eyebrow" style="margin-bottom:8px">Sonido</div><div class="seg"><button class="${SV.sound?'on':''}" data-act="snd" data-v="1">Activado</button><button class="${!SV.sound?'on':''}" data-act="snd" data-v="0">Desactivado</button></div></div>
    </div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px">
      <div class="eyebrow">Empezar de cero</div>
      ${confirmReset?'<p style="margin:0">Se borrarán el club, la plantilla y la temporada. No se puede deshacer.</p><div class="row"><button class="btn danger" data-act="reset2">Sí, borrar el club</button><button class="btn" data-act="reset0">Cancelar</button></div>':'<div><button class="btn danger" data-act="reset1">Borrar el club</button></div>'}
    </div>`);
}
function showResult(r){
  const o=r.opp;const me=SV.club;
  const win=r.gu>r.go,draw=r.gu===r.go;
  const L=r.home!==false?me:o,R=r.home!==false?o:me;
  const gl=r.home!==false?r.gu:r.go,gr=r.home!==false?r.go:r.gu;
  const goals=r.goals.map(g=>`<div class="row spread"><span>${g.team===0?'<b>'+esc(me.short)+'</b>':esc(o.short)} · ${esc(g.name)}</span><span class="note">${g.min}'</span></div>`).join('');
  W$(`<div class="card" style="display:flex;flex-direction:column;gap:16px;margin-top:4vh">
      <div class="eyebrow" style="text-align:center">${r.league?'Jornada '+SV.league.round+' · '+DIVS[SV.div].n:'Amistoso'} · ${esc(PLANETS[r.planet].n)}${r.simulated?' · simulado':''}</div>
      <div class="next"><div class="side">${crest(L,'lg')}<b>${esc(L.name)}</b></div><div class="result">${gl}-${gr}</div><div class="side">${crest(R,'lg')}<b>${esc(R.name)}</b></div></div>
      <h2 class="brand mid ${win?'good':draw?'gold':'bad'}" style="text-align:center">${win?'Victoria':draw?'Empate':'Derrota'}</h2>
      ${goals?'<div style="display:flex;flex-direction:column;gap:6px">'+goals+'</div>':''}
      <div class="row" style="justify-content:center"><span class="coins"><i></i>+${r.coins}</span></div>
      <div class="row" style="justify-content:center"><button class="btn go" data-act="${r.season?'season':'home'}">${r.season?'Ver el final de temporada':'Continuar'}</button></div>
    </div>`);
  if(r.league&&!r.season){refreshMarket();save();}
}
function showSeason(){
  const st=standings();const pos=st.findIndex(t=>t.user)+1;const m=DIVS[SV.div].m;
  let msg,prize=Math.round((9-pos)*150*m),cls='gold';
  const old=SV.div;
  if(pos===1)prize+=Math.round(1500*m);
  if(pos<=2&&SV.div>0){SV.div--;msg='¡Ascenso a la '+DIVS[SV.div].n+'!';cls='good';}
  else if(pos===1&&SV.div===0){msg='¡Campeones de la Copa Galáctica!';cls='good';}
  else if(pos>=7&&SV.div<4){SV.div++;msg='Descenso a la '+DIVS[SV.div].n;cls='bad';}
  else msg='Seguís en la '+DIVS[SV.div].n;
  SV.coins+=prize;SV.history.push({season:SV.season,div:DIVS[old].n,pos});
  SV.season++;
  SV.squad.forEach(p=>p.age++);
  newLeague();refreshMarket();save();
  W$(`<div class="card" style="display:flex;flex-direction:column;gap:16px;margin-top:4vh;text-align:center;align-items:center">
    <div class="eyebrow">Fin de la temporada ${SV.season-1} · ${DIVS[old].n}</div>
    <div class="result">${pos}º</div>
    <h2 class="brand mid ${cls}">${esc(msg)}</h2>
    <span class="coins"><i></i>+${prize.toLocaleString('es-ES')}</span>
    <p class="note">${SV.div<old?'Los rivales de la nueva división son mejores. Usa las monedas para fichar.':'Mejora la plantilla y vuelve a intentarlo.'}</p>
    <button class="btn go" data-act="home">Empezar la temporada ${SV.season}</button>
  </div>`);
}

/* ---------- acciones de los menús ---------- */
$('#ui').addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  audioInit();
  const a=el.dataset.act;
  if(a==='sw'){createSel[el.dataset.k]=el.dataset.c;showCreate();if(M&&M.demo){M.teams[0].c1=createSel.c1;M.teams[0].c2=createSel.c2;}return;}
  if(a==='cplanet'){createSel.planet=el.dataset.k;showCreate();demoMatch(createSel.planet);M.teams[0].c1=createSel.c1;M.teams[0].c2=createSel.c2;return;}
  if(a==='found'){
    const n=($('#clubName').value||'').trim();
    if(n.length<3){$('#cErr').textContent='Escribe un nombre de al menos 3 letras.';return;}
    if(createSel.c1===createSel.c2){$('#cErr').textContent='Elige dos colores distintos.';return;}
    newGame(n,createSel.c1,createSel.c2,createSel.planet);demoMatch(createSel.planet);showHome();return;
  }
  if(a==='home'){confirmReset=false;squadSel=null;showHome();return;}
  if(a==='squad'){squadSel=null;showSquad();return;}
  if(a==='market'){showMarket();return;}
  if(a==='table'){showTable();return;}
  if(a==='guide'){showGuide();return;}
  if(a==='friendly'){showFriendly();return;}
  if(a==='help'){showHelp();return;}
  if(a==='settings'){showSettings();return;}
  if(a==='season'){showSeason();return;}
  if(a==='play'){const fx=userFixture();if(!fx)return;const o=SV.league.teams[fx.opp];startMatch({league:true,opp:o,home:fx.home,planet:fx.home?SV.planet:o.planet});return;}
  if(a==='sim'){const fx=userFixture();if(!fx)return;const o=SV.league.teams[fx.opp];CUR={league:true,opp:o,home:fx.home,planet:fx.home?SV.planet:o.planet};const [g1,g2]=simScore(userRating()+(fx.home?2:-2),o.rating);
    const goals=[];const xi=SV.lineup.map(id=>SV.squad.find(p=>p.id===id)).filter(p=>p.pos!=='POR');
    for(let i=0;i<g1;i++){const w=xi.map(p=>p.pos==='DEL'?4:p.pos==='MED'?2:.6);let r=Math.random()*w.reduce((s,v)=>s+v,0),k=0;while(r>w[k]){r-=w[k];k++;}goals.push({team:0,name:xi[k].name,min:Math.floor(rnd(1,90))});}
    for(let i=0;i<g2;i++)goals.push({team:1,name:o.short,min:Math.floor(rnd(1,90))});
    goals.sort((x,y)=>x.min-y.min);finishMatch(g1,g2,goals,true);return;}
  if(a==='fpl'){fSel.planet=el.dataset.k;showFriendly();demoMatch(fSel.planet);return;}
  if(a==='fsp'){fSel.sp=el.dataset.k;showFriendly();return;}
  if(a==='fplay'){const d=DIVS[+el.dataset.d];const used=new Set([SV.club.name]);const name=teamName(used,fSel.sp);const c1=pick(KIT.filter(c=>c!==SV.club.c1));let c2=pick(KIT);if(c2===c1)c2='#f3f3ee';
    startMatch({league:false,opp:{name,short:shortOf(name),c1,c2,sp:fSel.sp,rating:d.lvl,form:pick(Object.keys(FORM))},home:true,planet:fSel.planet});return;}
  if(a==='resume'){togglePause();return;}
  if(a==='quit'){paused=false;const lg=CUR.league;mode='menu';$('#hud').hidden=true;$('#touch').hidden=true;crowdLevel(0,.3);
    if(lg)finishMatch(0,3,[],false);else showHome();demoMatch(CUR.planet);return;}
  if(a==='form'){SV.form=el.dataset.f;save();showSquad();return;}
  if(a==='auto'){SV.lineup=autoLineup(SV.squad,SV.form);save();showSquad();return;}
  if(a==='info'){e.stopPropagation();showPlayer(+el.dataset.id,'squad');return;}
  if(a==='pick'){
    const id=+el.dataset.id;
    if(squadSel===null){squadSel=id;showSquad();return;}
    if(squadSel===id){squadSel=null;showSquad();return;}
    const L=SV.lineup,ia=L.indexOf(squadSel),ib=L.indexOf(id);
    if(ia>=0&&ib>=0){L[ia]=id;L[ib]=squadSel;}
    else if(ia>=0)L[ia]=id;else if(ib>=0)L[ib]=squadSel;
    squadSel=null;save();showSquad();return;
  }
  if(a==='train'){const p=SV.squad.find(x=>x.id===+el.dataset.id),k=el.dataset.k,c=trainCost(p[k]);if(SV.coins>=c&&p[k]<99){SV.coins-=c;p[k]++;save();}showPlayer(p.id,'squad');return;}
  if(a==='sell'){const p=SV.squad.find(x=>x.id===+el.dataset.id);if(!p||SV.lineup.includes(p.id)||SV.squad.length<=14)return;SV.coins+=Math.round(value(p)*.5);SV.squad=SV.squad.filter(x=>x!==p);save();showSquad();return;}
  if(a==='buy'){const p=SV.market.find(x=>x.id===+el.dataset.id);if(!p||SV.coins<value(p)||SV.squad.length>=22)return;SV.coins-=value(p);const used=new Set(SV.squad.map(x=>x.num));let n=1;while(used.has(n))n++;p.num=n;SV.squad.push(p);SV.market=SV.market.filter(x=>x!==p);save();showMarket();return;}
  if(a==='refresh'){if(SV.coins<100)return;SV.coins-=100;refreshMarket();save();showMarket();return;}
  if(a==='diff'){SV.diff=+el.dataset.v;save();showSettings();return;}
  if(a==='dur'){SV.dur=+el.dataset.v;save();showSettings();return;}
  if(a==='spl'){SV.planet=el.dataset.k;SV.league.teams[0].planet=SV.planet;save();showSettings();demoMatch(SV.planet);return;}
  if(a==='snd'){SV.sound=el.dataset.v==='1';if(!SV.sound&&SND.crowd)crowdLevel(0,.1);save();showSettings();return;}
  if(a==='reset1'){confirmReset=true;showSettings();return;}
  if(a==='reset0'){confirmReset=false;showSettings();return;}
  if(a==='reset2'){try{localStorage.removeItem(SAVE_KEY);}catch(err){}SV=null;confirmReset=false;showCreate();return;}
});

/* ---------- inicio ---------- */
load();migrate();
if(SV&&!SV.league)newLeague();
demoMatch(SV?SV.planet:null);
if(SV)showHome();else showCreate();
requestAnimationFrame(frame);
window.__juego={IN,step,get M(){return M;},get SV(){return SV;},startMatch,demoMatch,PLANETS};
})();
</script>
