  "Ameba superribosómica":["Ameba superribosòmica","Super-ribosome amoeba"], "Amoeba proteus, clon 4":["Amoeba proteus, clon 4","Amoeba proteus, clone 4"], "Fábrica de proteínas":["Fàbrica de proteïnes","Protein factory"],
  "Millones de ribosomas":["Milions de ribosomes","Millions of ribosomes"], "Se repara cada turno":["Es repara cada torn","Repairs every turn"],
  "Su flagelo gira como una hélice y lo aparta del golpe.":["El seu flagel gira com una hèlix i l'aparta del cop.","Its flagellum spins like a propeller and pulls it out of the way."],
  "Se escurre con sus pseudópodos.":["S'escapoleix amb els pseudòpodes.","It slips away on its pseudopods."],
  // variantes: qué cambia
  "Ha perdido la pared de peptidoglucano. Es más blanda, pero ya no aguanta la presión del agua.":["Ha perdut la paret de peptidoglicà. És més tova, però ja no aguanta la pressió de l'aigua.","It has lost its peptidoglycan wall. It's softer, but it can no longer withstand water pressure."],
  "No tiene la membrana externa de LPS que cubre a las Gram−. Su fina pared de peptidoglucano queda al aire.":["No té la membrana externa de LPS que cobreix les Gram−. La seva paret prima de peptidoglicà queda a l'aire.","It lacks the LPS outer membrane that covers Gram− bacteria. Its thin peptidoglycan wall is exposed."],
  "Es un Gram+ que ha «tomado prestada» la membrana externa de las Gram−. Su pared gruesa queda tapada.":["És un Gram+ que ha «manllevat» la membrana externa de les Gram−. La seva paret gruixuda queda tapada.","It's a Gram+ that has “borrowed” the outer membrane of Gram− bacteria. Its thick wall is covered up."],
  "Los estafilococos no se mueven, pero este ha ganado un flagelo: esquiva muchos golpes. Los anticuerpos se pegan al flagelo y lo frenan.":["Els estafilococs no es mouen, però aquest ha guanyat un flagel: esquiva molts cops. Els anticossos s'enganxen al flagel i el frenen.","Staphylococci don't move, but this one has gained a flagellum: it dodges many attacks. Antibodies stick to the flagellum and slow it down."],
  "Hace la fotosíntesis como una planta, pero no tiene pared de celulosa: se mueve con pseudópodos como una ameba.":["Fa la fotosíntesi com una planta, però no té paret de cel·lulosa: es mou amb pseudòpodes com una ameba.","It photosynthesises like a plant but has no cellulose wall: it moves on pseudopods like an amoeba."],
  "Su membrana usa colesterol, como tus células, en lugar de ergosterol. La anfotericina B ya no tiene a qué agarrarse.":["La seva membrana fa servir colesterol, com les teves cèl·lules, en lloc d'ergosterol. L'amfotericina B ja no té on agafar-se.","Its membrane uses cholesterol, like your cells, instead of ergosterol. Amphotericin B has nothing to grab on to."],
  "Es una ameba dentro de un caparazón de sílice, el mismo material que el vidrio. Hace de pared: aguanta la presión del agua.":["És una ameba dins d'una closca de sílice, el mateix material que el vidre. Fa de paret: aguanta la pressió de l'aigua.","It's an amoeba inside a silica shell, the same material as glass. It acts as a wall: it withstands water pressure."],
  "Está hecha de las mismas moléculas que tú, pero en su imagen en el espejo. Las enzimas, los anticuerpos y los fármacos reconocen formas, y ninguna encaja.":["Està feta de les mateixes molècules que tu, però en la seva imatge al mirall. Els enzims, els anticossos i els fàrmacs reconeixen formes, i cap no hi encaixa.","It's made of the same molecules as you, but as their mirror image. Enzymes, antibodies and drugs recognise shapes, and none of them fit."],
  "Sin mitocondrias solo obtiene ATP de la glucólisis: 2 moléculas por glucosa en lugar de unas 30. Le falta energía y ataca muy débil.":["Sense mitocondris només obté ATP de la glucòlisi: 2 molècules per glucosa en lloc d'unes 30. Li falta energia i ataca molt feble.","Without mitochondria it only gets ATP from glycolysis: 2 molecules per glucose instead of about 30. It lacks energy and attacks very weakly."],
  "Sin actina ni microtúbulos no puede formar pseudópodos ni mantener su forma: ni esquiva ni aguanta los golpes (+40 % de daño recibido).":["Sense actina ni microtúbuls no pot formar pseudòpodes ni mantenir la forma: ni esquiva ni aguanta els cops (+40 % de dany rebut).","Without actin or microtubules it can't form pseudopods or keep its shape: it neither dodges nor withstands blows (+40 % damage taken)."],
  "No tiene vacuolas contráctiles: no puede bombear fuera el agua que le entra por ósmosis.":["No té vacúols contràctils: no pot bombar fora l'aigua que li entra per osmosi.","It has no contractile vacuoles: it can't pump out the water that enters by osmosis."],
  "Tiene muchísimos ribosomas: fabrica proteínas sin parar y se repara un 9 % cada turno. Pero los ribosomas necesitan las instrucciones del ADN.":["Té moltíssims ribosomes: fabrica proteïnes sense parar i es repara un 9 % cada torn. Però els ribosomes necessiten les instruccions de l'ADN.","It has a huge number of ribosomes: it makes proteins non-stop and repairs 9 % every turn. But ribosomes need the DNA's instructions."],
  // variantes: curiosidades
  "Existen de verdad: se llaman formas L. Algunas bacterias pierden la pared cuando las tratan con penicilina y sobreviven así, sin pared, en medios con mucha sal.":["Existeixen de veritat: es diuen formes L. Alguns bacteris perden la paret quan els tracten amb penicil·lina i sobreviuen així, sense paret, en medis amb molta sal.","They really exist: they're called L-forms. Some bacteria lose their wall when treated with penicillin and survive without it in very salty media."],
  "En el laboratorio se fabrican «esferoplastos» quitando la membrana externa con EDTA: así la lisozima llega a la pared.":["Al laboratori es fabriquen «esferoplasts» traient la membrana externa amb EDTA: així el lisozim arriba a la paret.","Labs make “spheroplasts” by stripping the outer membrane with EDTA: that way lysozyme can reach the wall."],
  "Ninguna bacteria real tiene a la vez una pared tan gruesa y una membrana externa, pero las micobacterias se acercan: su pared lleva encima una capa de ceras.":["Cap bacteri real no té alhora una paret tan gruixuda i una membrana externa, però els micobacteris s'hi acosten: la seva paret porta a sobre una capa de ceres.","No real bacterium has both such a thick wall and an outer membrane, but mycobacteria come close: their wall is topped with a layer of waxes."],
  "Los anticuerpos contra la flagelina inmovilizan de verdad a las bacterias: es una de las formas en que te protegen.":["Els anticossos contra la flagel·lina immobilitzen de veritat els bacteris: és una de les maneres com et protegeixen.","Antibodies against flagellin really do immobilise bacteria: it's one of the ways they protect you."],
  "En la Tierra existe algo parecido: la babosa marina Elysia chlorotica roba los cloroplastos de las algas que come y hace la fotosíntesis durante meses.":["A la Terra hi ha una cosa semblant: el llimac marí Elysia chlorotica roba els cloroplasts de les algues que menja i fa la fotosíntesi durant mesos.","There's something similar on Earth: the sea slug Elysia chlorotica steals chloroplasts from the algae it eats and photosynthesises for months."],
  "Por eso la anfotericina B tiene efectos secundarios: el colesterol de tus células se parece al ergosterol y también se une a él.":["Per això l'amfotericina B té efectes secundaris: el colesterol de les teves cèl·lules s'assembla a l'ergosterol i també s'hi uneix.","That's why amphotericin B has side effects: the cholesterol in your cells resembles ergosterol and it binds to it too."],
  "Existen amebas con caparazón, como Arcella, y algas con caparazón de vidrio, las diatomeas.":["Hi ha amebes amb closca, com Arcella, i algues amb closca de vidre, les diatomees.","There are shelled amoebas, such as Arcella, and algae with glass shells, the diatoms."],
  "La «vida espejo» no existe, pero en 2024 un grupo de científicos pidió no fabricarla: ni tu sistema inmune ni los antibióticos la reconocerían.":["La «vida mirall» no existeix, però el 2024 un grup de científics va demanar que no es fabriqui: ni el teu sistema immunitari ni els antibiòtics la reconeixerien.","“Mirror life” doesn't exist, but in 2024 a group of scientists called for it never to be made: neither your immune system nor antibiotics would recognise it."],
  "Monocercomonoides es el único eucariota conocido sin mitocondrias. Vive en el intestino de las chinchillas, donde casi no hay oxígeno.":["Monocercomonoides és l'únic eucariota conegut sense mitocondris. Viu a l'intestí de les xinxilles, on gairebé no hi ha oxigen.","Monocercomonoides is the only known eukaryote without mitochondria. It lives in chinchilla guts, where there's almost no oxygen."],
  "La citocalasina, una toxina de hongos, desmonta la actina: las células tratadas con ella se quedan redondas y quietas.":["La citocalasina, una toxina de fongs, desmunta l'actina: les cèl·lules tractades amb ella es queden rodones i quietes.","Cytochalasin, a fungal toxin, takes actin apart: cells treated with it go round and still."],
  "Un paramecio normal vacía su vacuola contráctil cada pocos segundos. Si se la bloquean, revienta en agua dulce en unos minutos.":["Un parameci normal buida el vacúol contràctil cada pocs segons. Si l'hi bloquegen, rebenta en aigua dolça en pocs minuts.","A normal paramecium empties its contractile vacuole every few seconds. If it's blocked, it bursts in fresh water within minutes."],
  "Tus ribosomas son como los de esta ameba: leen el ARNm que se copia del ADN. Si el ADN está dañado, no llegan instrucciones.":["Els teus ribosomes són com els d'aquesta ameba: llegeixen l'ARNm que es copia de l'ADN. Si l'ADN està danyat, no arriben instruccions.","Your ribosomes are like this amoeba's: they read the mRNA copied from DNA. If the DNA is damaged, no instructions arrive."],
  // variantes: eficacias
  "Ha perdido la pared: la lisozima no tiene peptidoglucano que cortar.":["Ha perdut la paret: el lisozim no té peptidoglicà per tallar.","It has lost its wall: lysozyme has no peptidoglycan to cut."],
  "La penicilina impide fabricar la pared… pero esta bacteria ya vive sin ella.":["La penicil·lina impedeix fabricar la paret… però aquest bacteri ja viu sense.","Penicillin stops the wall being made… but this bacterium already lives without one."],
  "Sin pared que la sujete, el agua entra por ósmosis y revienta. Para eso sirve la pared: aguanta la presión.":["Sense paret que la subjecti, l'aigua entra per osmosi i rebenta. Per a això serveix la paret: aguanta la pressió.","With no wall to hold it, water rushes in by osmosis and it bursts. That's what the wall is for: it withstands the pressure."],
  "Sin pared rígida es blanda y fácil de digerir.":["Sense paret rígida és tova i fàcil de digerir.","Without a rigid wall it's soft and easy to digest."],
  "Sin membrana externa, su peptidoglucano queda expuesto y la lisozima lo corta. La membrana externa era su escudo.":["Sense membrana externa, el seu peptidoglicà queda exposat i el lisozim el talla. La membrana externa era el seu escut.","Without an outer membrane its peptidoglycan is exposed and lysozyme cuts it. The outer membrane was its shield."],
  "La penicilina llega sin obstáculos hasta su pared.":["La penicil·lina arriba sense obstacles fins a la paret.","Penicillin reaches its wall unhindered."],
  "La membrana externa tapa la pared: la lisozima casi no llega al peptidoglucano.":["La membrana externa tapa la paret: el lisozim gairebé no arriba al peptidoglicà.","The outer membrane covers the wall: lysozyme barely reaches the peptidoglycan."],
  "La membrana externa frena la entrada de la penicilina, igual que en las Gram−.":["La membrana externa frena l'entrada de la penicil·lina, igual que a les Gram−.","The outer membrane slows penicillin's entry, just as in Gram− bacteria."],
  "Los anticuerpos activan el complemento, que perfora las membranas externas.":["Els anticossos activen el complement, que perfora les membranes externes.","Antibodies activate complement, which punches holes in outer membranes."],
  "La membrana no protege su ADN de la radiación.":["La membrana no protegeix el seu ADN de la radiació.","The membrane doesn't shield its DNA from radiation."],
  "Los anticuerpos se pegan al flagelo y lo inmovilizan: mientras esté opsonizado no podrá esquivar.":["Els anticossos s'enganxen al flagel i l'immobilitzen: mentre estigui opsonitzat no podrà esquivar.","Antibodies stick to the flagellum and immobilise it: while it's opsonised it can't dodge."],
  "No tiene pared de celulosa: la celulasa no tiene nada que digerir.":["No té paret de cel·lulosa: la cel·lulasa no té res per digerir.","It has no cellulose wall: cellulase has nothing to digest."],
  "Tiene cloroplastos, pero no pared: el agua la hincha hasta reventar. Pared y cloroplastos son cosas distintas.":["Té cloroplasts, però no paret: l'aigua la infla fins que rebenta. Paret i cloroplasts són coses diferents.","It has chloroplasts but no wall: water swells it until it bursts. Walls and chloroplasts are different things."],
  "Sin pared rígida, se deja engullir.":["Sense paret rígida, es deixa engolir.","Without a rigid wall, it can be engulfed."],
  "La anfotericina B busca el ergosterol; esta levadura usa colesterol, como tú. Le afecta tan poco como a tus células.":["L'amfotericina B busca l'ergosterol; aquest llevat fa servir colesterol, com tu. L'afecta tan poc com a les teves cèl·lules.","Amphotericin B looks for ergosterol; this yeast uses cholesterol, like you. It affects it as little as your cells."],
  "Sigue dividiéndose por gemación con microtúbulos: el taxol la frena.":["Continua dividint-se per gemmació amb microtúbuls: el taxol el frena.","It still divides by budding using microtubules: taxol slows it down."],
  "El caparazón de sílice aguanta la presión del agua, igual que la pared de una planta.":["La closca de sílice aguanta la pressió de l'aigua, igual que la paret d'una planta.","The silica shell withstands water pressure, just like a plant's wall."],
  "Un caparazón de vidrio no se puede digerir.":["Una closca de vidre no es pot digerir.","A glass shell can't be digested."],
  "La sílice no es celulosa: la celulasa no la reconoce.":["La sílice no és cel·lulosa: la cel·lulasa no la reconeix.","Silica isn't cellulose: cellulase doesn't recognise it."],
  "El vidrio deja pasar la luz, también la ultravioleta.":["El vidre deixa passar la llum, també l'ultraviolada.","Glass lets light through, ultraviolet included."],
  "El vapor a presión entra por la abertura del caparazón.":["El vapor a pressió entra per l'obertura de la closca.","Pressurised steam gets in through the shell's opening."],
  "Puedes engullirla, pero tus enzimas no encajan en sus moléculas especulares: no la digieres.":["La pots engolir, però els teus enzims no encaixen en les seves molècules especulars: no la digereixes.","You can engulf it, but your enzymes don't fit its mirror-image molecules: you can't digest it."],
  "Un anticuerpo encaja en una forma concreta, como una llave. En el espejo, la forma está al revés y ninguno encaja.":["Un anticòs encaixa en una forma concreta, com una clau. Al mirall, la forma està al revés i cap no hi encaixa.","An antibody fits one particular shape, like a key. In the mirror the shape is reversed and none fit."],
  "Sus péptidos especulares no caben en tu MHC: los linfocitos T no ven nada extraño.":["Els seus pèptids especulars no caben al teu MHC: els limfòcits T no hi veuen res d'estrany.","Its mirror-image peptides don't fit your MHC: T cells see nothing foreign."],
  "El taxol también es una molécula con forma: no encaja en sus microtúbulos especulares.":["El taxol també és una molècula amb forma: no encaixa en els seus microtúbuls especulars.","Taxol is a shaped molecule too: it doesn't fit its mirror-image microtubules."],
  "La anfotericina B no encaja en sus esteroles especulares.":["L'amfotericina B no encaixa en els seus esterols especulars.","Amphotericin B doesn't fit its mirror-image sterols."],
  "La luz no distingue derecha de izquierda: la UV daña su ADN igual que el tuyo.":["La llum no distingeix la dreta de l'esquerra: la UV danya el seu ADN igual que el teu.","Light can't tell left from right: UV damages its DNA just like yours."],
  "La ósmosis es física: no depende de la forma de las moléculas. Sin pared, revienta.":["L'osmosi és física: no depèn de la forma de les molècules. Sense paret, rebenta.","Osmosis is physics: it doesn't depend on the shape of molecules. With no wall, it bursts."],
  "El calor desnaturaliza cualquier proteína, sea cual sea su forma.":["La calor desnaturalitza qualsevol proteïna, sigui quina sigui la seva forma.","Heat denatures any protein, whatever its shape."],
  "Sin pseudópodos no puede escapar: la engulles sin esfuerzo.":["Sense pseudòpodes no pot escapar: l'engoleixes sense esforç.","Without pseudopods it can't escape: you engulf it effortlessly."],
  "No tiene microtúbulos: el taxol no tiene diana. (Tampoco puede dividirse.)":["No té microtúbuls: el taxol no té diana. (Tampoc no es pot dividir.)","It has no microtubules: taxol has no target. (It can't divide either.)"],
  "Sin vacuolas contráctiles no puede expulsar el agua que entra: revienta. Para eso sirven.":["Sense vacúols contràctils no pot expulsar l'aigua que entra: rebenta. Per a això serveixen.","Without contractile vacuoles it can't expel the water coming in: it bursts. That's what they're for."],
  "La UV daña su ADN: sin ARNm nuevo, sus ribosomas se quedan sin instrucciones y deja de repararse durante 2 turnos.":["La UV danya el seu ADN: sense ARNm nou, els seus ribosomes es queden sense instruccions i deixa de reparar-se durant 2 torns.","UV damages its DNA: with no new mRNA its ribosomes run out of instructions and it stops repairing for 2 turns."],
  // pistas
  "Pista":["Pista","Hint"], "Otra pista":["Una altra pista","Another hint"], "Fíjate en los rasgos resaltados.":["Fixa't en els trets ressaltats.","Look at the highlighted features."],
  "He tachado algunas opciones que no sirven.":["He ratllat algunes opcions que no serveixen.","I've crossed out some options that won't work."],
  "(Menos ATP por usar pistas.)":["(Menys ATP per fer servir pistes.)","(Less ATP for using hints.)"],
  "No tiene defensas especiales contra lo más básico: engullir y digerir.":["No té defenses especials contra el més bàsic: engolir i digerir.","It has no special defence against the most basic thing: engulfing and digesting."],
  "Busca una enzima que corte la pared de las bacterias cuando está al descubierto.":["Busca un enzim que talli la paret dels bacteris quan és al descobert.","Look for an enzyme that cuts bacterial walls when they're exposed."],
  "Piensa en un fármaco que impida a la bacteria construir su pared.":["Pensa en un fàrmac que impedeixi al bacteri construir la paret.","Think of a drug that stops the bacterium building its wall."],
  "Fíjate en su material genético: hay una radiación que lo daña.":["Fixa't en el seu material genètic: hi ha una radiació que el danya.","Think about its genetic material: there's a kind of radiation that damages it."],
  "Tu sistema inmune puede pegarse a lo que tiene en la superficie y marcarlo.":["El teu sistema immunitari es pot enganxar al que té a la superfície i marcar-lo.","Your immune system can stick to what's on its surface and tag it."],
  "Fíjate en qué esterol usa su membrana.":["Fixa't en quin esterol fa servir la seva membrana.","Look at which sterol its membrane uses."],
  "¿Qué le pasa en agua destilada a una célula que no tiene nada que la sujete?":["Què li passa en aigua destil·lada a una cèl·lula que no té res que la subjecti?","What happens in distilled water to a cell with nothing holding it together?"],
  "Se repara con algo que viene del sol.":["Es repara amb una cosa que ve del sol.","It repairs itself with something that comes from the sun."],
  "Su pared está hecha del polisacárido de las plantas.":["La seva paret està feta del polisacàrid de les plantes.","Its wall is made of the plant polysaccharide."],
  "Hay células de tu sistema inmune que destruyen células enteras infectadas o alteradas.":["Hi ha cèl·lules del teu sistema immunitari que destrueixen cèl·lules senceres infectades o alterades.","Some of your immune cells destroy whole infected or altered cells."],
  "Se divide sin parar: bloquea la maquinaria de la división.":["Es divideix sense parar: bloqueja la maquinària de la divisió.","It divides non-stop: block the machinery of division."],
  "Cuando algo lo resiste casi todo, el calor y la presión no fallan.":["Quan una cosa ho resisteix gairebé tot, la calor i la pressió no fallen.","When something resists almost everything, heat and pressure never fail."],
  "Su pared tiene una capa de ceras: ataca su fabricación.":["La seva paret té una capa de ceres: ataca'n la fabricació.","Its wall has a waxy layer: attack how it's made."],
  "Vive en los glóbulos rojos y digiere la hemoglobina, rica en hierro.":["Viu als glòbuls vermells i digereix l'hemoglobina, rica en ferro.","It lives in red blood cells and digests iron-rich haemoglobin."],
  "Copia su ARN a ADN con una enzima que tus células no usan.":["Copia el seu ARN a ADN amb un enzim que les teves cèl·lules no fan servir.","It copies its RNA into DNA with an enzyme your cells don't use."],
  "Es un gusano: busca algo que paralice su tegumento.":["És un cuc: busca alguna cosa que li paralitzi el tegument.","It's a worm: look for something that paralyses its tegument."],
};
for (const k in I18N_RAW5){ I18N.ca[k] = I18N_RAW5[k][0]; I18N.en[k] = I18N_RAW5[k][1]; }

  "+{p} % de {k}":["+{p} % de {k}","+{p} % {k}"], "Todos a ★1: +5 % de {k}":["Tots a ★1: +5 % de {k}","All at ★1: +5 % {k}"],

  "Biobanco: {n} sube a {s}. +6 % de daño y +5 % de ATP contra él.":["Biobanc: {n} puja a {s}. +6 % de dany i +5 % d'ATP contra ell.","Biobank: {n} rises to {s}. +6 % damage and +5 % ATP against it."],
  "Biobanco: +1 muestra de {n} ({k}/{t}).":["Biobanc: +1 mostra de {n} ({k}/{t}).","Biobank: +1 {n} sample ({k}/{t})."],
  "Al vencer organismos a veces consigues una muestra para tu biobanco, y al vencer jefes, hallazgos científicos. Todo se conserva al evolucionar. No cuentan en el modo clase ni en los eventos.":["En vèncer organismes de vegades aconsegueixes una mostra per al biobanc, i en vèncer caps, descobertes científiques. Tot es conserva en evolucionar. No compten en el mode classe ni als esdeveniments.","Defeating organisms sometimes gives you a sample for your biobank, and defeating bosses gives scientific discoveries. Everything is kept when you evolve. They don't apply in class mode or in events."],
  "Aparecen al vencer jefes, sobre todo los especiales, y al completar por primera vez un evento. Si encuentras uno repetido, sube de nivel (hasta el III).":["Apareixen en vèncer caps, sobretot els especials, i en completar per primera vegada un esdeveniment. Si en trobes un de repetit, puja de nivell (fins al III).","They appear when you defeat bosses, especially special ones, and when you first complete an event. A duplicate raises its level (up to III)."],
  "Cada estrella de un organismo da +6 % de daño y +5 % de ATP contra él. Si todos los organismos de un grupo llegan a ★1, ★3 o ★5, el grupo da un bonus para todo.":["Cada estrella d'un organisme dona +6 % de dany i +5 % d'ATP contra ell. Si tots els organismes d'un grup arriben a ★1, ★3 o ★5, el grup dona una bonificació per a tot.","Each star on an organism gives +6 % damage and +5 % ATP against it. If every organism in a group reaches ★1, ★3 or ★5, the group gives a bonus to everything."],
  "Los hallazgos se conservan al evolucionar. Los encontrarás todos en el Laboratorio, en «Colección».":["Les descobertes es conserven en evolucionar. Les trobaràs totes al Laboratori, a «Col·lecció».","Discoveries are kept when you evolve. You'll find them all in the Lab, under “Collection”."],
  "Llevas un rato sin avanzar. Si evolucionas ahora, tu linaje gana {g} de ADN (pestaña Evolución).":["Fa una estona que no avances. Si evolucions ara, el teu llinatge guanya {g} d'ADN (pestanya Evolució).","You haven't progressed for a while. If you evolve now, your lineage gains {g} DNA (Evolution tab)."],
  "Buen momento para evolucionar":["Bon moment per evolucionar","A good time to evolve"],
  "Llevas un rato sin batir tu récord. Si evolucionas ahora ganarás {g} de ADN y volverás a subir mucho más deprisa.":["Fa una estona que no superes el teu rècord. Si evolucions ara guanyaràs {g} d'ADN i tornaràs a pujar molt més de pressa.","You haven't beaten your record for a while. If you evolve now you'll gain {g} DNA and climb back much faster."],
  // hallazgos
  "Vacuna de Jenner":["Vacuna de Jenner","Jenner's vaccine"], "+{p} % de daño con los anticuerpos":["+{p} % de dany amb els anticossos","+{p} % damage with antibodies"],
  "Edward Jenner inoculó a un niño pus de viruela bovina y comprobó que quedaba protegido frente a la viruela. «Vacuna» viene de «vaca». La viruela se declaró erradicada en 1980.":["Edward Jenner va inocular a un nen pus de verola bovina i va comprovar que quedava protegit contra la verola. «Vacuna» ve de «vaca». La verola es va declarar eradicada el 1980.","Edward Jenner inoculated a boy with cowpox pus and showed he was then protected against smallpox. “Vaccine” comes from the Latin for cow. Smallpox was declared eradicated in 1980."],
  "Microscopio de Leeuwenhoek":["Microscopi de Leeuwenhoek","Leeuwenhoek's microscope"], "+{p} % de ATP por victoria":["+{p} % d'ATP per victòria","+{p} % ATP per victory"],
  "Antoni van Leeuwenhoek, un comerciante de telas holandés, talló lentes de hasta 270 aumentos. Fue el primero en ver bacterias y protozoos, a los que llamó «animálculos».":["Antoni van Leeuwenhoek, un comerciant de teles holandès, va tallar lents de fins a 270 augments. Va ser el primer a veure bacteris i protozous, que va anomenar «animàlculs».","Antoni van Leeuwenhoek, a Dutch cloth merchant, ground lenses of up to 270× magnification. He was the first to see bacteria and protozoa, which he called “animalcules”."],
  "Teoría celular":["Teoria cel·lular","Cell theory"], "+{p} % de vida":["+{p} % de vida","+{p} % health"],
  "Schleiden (en las plantas) y Schwann (en los animales) propusieron que todos los seres vivos están hechos de células. En 1855, Virchow añadió: toda célula procede de otra célula.":["Schleiden (en les plantes) i Schwann (en els animals) van proposar que tots els éssers vius estan fets de cèl·lules. El 1855, Virchow hi va afegir: tota cèl·lula prové d'una altra cèl·lula.","Schleiden (for plants) and Schwann (for animals) proposed that all living things are made of cells. In 1855 Virchow added: every cell comes from another cell."],
  "Fagocitos de Metchnikoff":["Fagòcits de Metxnikov","Metchnikoff's phagocytes"], "+{p} % de daño con la fagocitosis":["+{p} % de dany amb la fagocitosi","+{p} % damage with phagocytosis"],
  "Iliá Méchnikov clavó espinas de rosal en larvas transparentes de estrella de mar y vio cómo unas células se amontonaban para engullir los intrusos. Así descubrió la fagocitosis. Nobel de 1908.":["Ilià Métxnikov va clavar espines de roser en larves transparents d'estrella de mar i va veure com unes cèl·lules s'amuntegaven per engolir els intrusos. Així va descobrir la fagocitosi. Nobel del 1908.","Ilya Mechnikov stuck rose thorns into transparent starfish larvae and watched cells crowd round to engulf the intruders. That's how he discovered phagocytosis. Nobel Prize 1908."],
  "Tinción de Gram":["Tinció de Gram","Gram stain"], "+{p} % de daño con la lisozima y la penicilina":["+{p} % de dany amb el lisozim i la penicil·lina","+{p} % damage with lysozyme and penicillin"],
  "Hans Christian Gram buscaba teñir bacterias en tejido pulmonar. Su método, con cristal violeta y yodo, sigue siendo la primera prueba de cualquier laboratorio de microbiología.":["Hans Christian Gram volia tenyir bacteris en teixit pulmonar. El seu mètode, amb cristall violeta i iode, continua sent la primera prova de qualsevol laboratori de microbiologia.","Hans Christian Gram wanted to stain bacteria in lung tissue. His method, with crystal violet and iodine, is still the first test in any microbiology lab."],
  "Postulados de Koch":["Postulats de Koch","Koch's postulates"], "+{p} % de probabilidad de conseguir muestras":["+{p} % de probabilitat d'aconseguir mostres","+{p} % chance of getting samples"],
  "Robert Koch demostró que un microbio concreto causa una enfermedad concreta: el bacilo de la tuberculosis, en 1882. Sus postulados aún guían cómo se identifica un patógeno.":["Robert Koch va demostrar que un microbi concret causa una malaltia concreta: el bacil de la tuberculosi, el 1882. Els seus postulats encara guien com s'identifica un patogen.","Robert Koch proved that a specific microbe causes a specific disease: the tuberculosis bacillus, in 1882. His postulates still guide how a pathogen is identified."],
  "Placa de Fleming":["Placa de Fleming","Fleming's plate"], "+{p} % de daño con la penicilina y menos cepas resistentes":["+{p} % de dany amb la penicil·lina i menys soques resistents","+{p} % damage with penicillin and fewer resistant strains"],
  "Alexander Fleming volvió de vacaciones y vio que un moho, Penicillium, había matado a los estafilococos de una placa. En su discurso del Nobel ya avisó de que el mal uso de la penicilina crearía resistencias.":["Alexander Fleming va tornar de vacances i va veure que una floridura, Penicillium, havia matat els estafilococs d'una placa. En el discurs del Nobel ja va avisar que el mal ús de la penicil·lina crearia resistències.","Alexander Fleming came back from holiday to find that a mould, Penicillium, had killed the staphylococci on a plate. In his Nobel lecture he already warned that misusing penicillin would breed resistance."],
  "Ciclo de Krebs":["Cicle de Krebs","Krebs cycle"], "+{p} % de ATP de las mitocondrias":["+{p} % d'ATP dels mitocondris","+{p} % ATP from mitochondria"],
  "Hans Krebs describió la ruta circular con la que las mitocondrias oxidan los restos de la glucosa y obtienen la energía para fabricar ATP. Nobel de 1953.":["Hans Krebs va descriure la ruta circular amb què els mitocondris oxiden les restes de la glucosa i n'obtenen l'energia per fabricar ATP. Nobel del 1953.","Hans Krebs described the circular pathway mitochondria use to oxidise what's left of glucose and get the energy to make ATP. Nobel Prize 1953."],
  "Fotografía 51":["Fotografia 51","Photo 51"], "+{p} % de ataque":["+{p} % d'atac","+{p} % attack"],
  "Rosalind Franklin obtuvo con rayos X la imagen que reveló la forma de hélice del ADN. Watson y Crick la usaron para proponer la doble hélice en 1953.":["Rosalind Franklin va obtenir amb raigs X la imatge que va revelar la forma d'hèlix de l'ADN. Watson i Crick la van fer servir per proposar la doble hèlix el 1953.","Rosalind Franklin took the X-ray image that revealed DNA's helical shape. Watson and Crick used it to propose the double helix in 1953."],
  "Restricción por MHC":["Restricció per MHC","MHC restriction"], "+{p} % de daño con el linfocito T":["+{p} % de dany amb el limfòcit T","+{p} % damage with T cells"],
  "Peter Doherty y Rolf Zinkernagel descubrieron que un linfocito T solo reconoce un antígeno cuando se lo presenta una molécula MHC. Nobel de 1996.":["Peter Doherty i Rolf Zinkernagel van descobrir que un limfòcit T només reconeix un antigen quan l'hi presenta una molècula MHC. Nobel del 1996.","Peter Doherty and Rolf Zinkernagel discovered that a T cell only recognises an antigen when an MHC molecule presents it. Nobel Prize 1996."],
  "PCR":["PCR","PCR"], "+{p} % de ATP mientras no juegas":["+{p} % d'ATP mentre no jugues","+{p} % ATP while you're away"],
  "Kary Mullis ideó la reacción en cadena de la polimerasa: copia un trozo de ADN millones de veces en unas horas. Es la base de muchas pruebas diagnósticas, como las de la COVID-19.":["Kary Mullis va idear la reacció en cadena de la polimerasa: copia un tros d'ADN milions de vegades en unes hores. És la base de moltes proves diagnòstiques, com les de la COVID-19.","Kary Mullis devised the polymerase chain reaction: it copies a piece of DNA millions of times in a few hours. It underpins many diagnostic tests, such as those for COVID-19."],
  "CRISPR-Cas9":["CRISPR-Cas9","CRISPR-Cas9"], "+{p} % de ataque y de vida":["+{p} % d'atac i de vida","+{p} % attack and health"],
  "Emmanuelle Charpentier y Jennifer Doudna convirtieron un sistema de defensa de las bacterias contra los virus en unas «tijeras» para editar genes. Nobel de Química de 2020.":["Emmanuelle Charpentier i Jennifer Doudna van convertir un sistema de defensa dels bacteris contra els virus en unes «tisores» per editar gens. Nobel de Química del 2020.","Emmanuelle Charpentier and Jennifer Doudna turned a bacterial defence system against viruses into “scissors” for editing genes. Nobel Prize in Chemistry 2020."],
};

  "Capa de glúcidos unida a las proteínas y los lípidos de la membrana. La protege de los golpes y ayuda a distinguir lo propio de lo extraño.":["Capa de glúcids units a les proteïnes i els lípids de la membrana. La protegeix dels cops i ajuda a distingir el que és propi del que és estrany.","A layer of sugars attached to membrane proteins and lipids. It cushions the membrane and helps tell self from non-self."],

  T:{
    gp:['Estafilococ','Biofilm d\'estafilococs','Bacteri esfèric (coc) que forma raïms. En la tinció de Gram queda violeta perquè la seva gruixuda paret de peptidoglicà reté el cristall violeta. Cada pocs torns es divideix per fissió binària i recupera vida.',['Bacteri gram+','Paret de peptidoglicà gruixuda','Fissió binària']],
    gn:['Bacil gram−','Colònia d\'E. coli','Bacil (bastó) que es tenyeix de rosa en la tinció de Gram: la seva capa de peptidoglicà és fina i està amagada sota una membrana externa de lipopolisacàrid (LPS). Aquesta membrana frena el lisozim i molts antibiòtics. El flagel li permet esquivar.',['Bacteri gram−','Membrana externa amb LPS','Peptidoglicà fi','Flagel'],'El seu flagel gira com una hèlix i l\'aparta del cop.'],
    vir:['Virus de la grip','Virèmia','No és una cèl·lula: és material genètic (ARN) dins d\'una càpsida i un embolcall amb espícules d\'hemaglutinina i neuraminidasa. No té metabolisme propi, així que els antibiòtics no li fan res. Un torn sí i un altre no, s\'amaga dins d\'una cèl·lula de l\'hoste per replicar-se, i cada pocs torns les seves espícules muten (deriva antigènica).',['Acel·lular','Embolcall amb espícules','Paràsit intracel·lular obligat']],
    lev:['Llevat','Candidiasi','Fong unicel·lular eucariota. La seva paret és de quitina i glucans (no de cel·lulosa ni de peptidoglicà) i la membrana fa servir ergosterol en lloc de colesterol. Es reprodueix per gemmació: li brota una gemma que creix.',['Fong unicel·lular','Paret de quitina','Ergosterol a la membrana','Gemmació']],

    veg:['Cèl·lula vegetal','Teixit de parènquima','Cèl·lula eucariota amb paret de cel·lulosa, un gran vacúol central i cloroplasts. Mentre hi ha llum fa la fotosíntesi i es repara cada torn. Fixa\'t en la ciclosi: els cloroplasts giren arrossegats pel citoplasma.',['Paret de cel·lulosa','Cloroplasts','Vacúol central','Fotosíntesi'],null,'Elodea canadensis (parènquima)'],
    par:['Parameci','Eixam de paramecis','Protozou cobert de cilis que baten en ones: ataca dues vegades per torn. Viu en aigua dolça, un medi hipotònic, i té vacúols contràctils en forma d\'estrella que expulsen sense parar l\'aigua que li entra per osmosi.',['Protozou ciliat','Vacúol contràctil','Milers de cilis','Sense paret cel·lular']],
    myc:['Micoplasma','Pneumònia atípica','Un dels bacteris més petits que existeixen i una excepció: no té paret cel·lular. Pren colesterol de l\'hoste per reforçar la membrana. Sense paret, els antibiòtics que ataquen el peptidoglicà no li fan res.',['Bacteri sense paret','Colesterol a la membrana','Pleomòrfic','Diminut'],'És tan petit i deformable que s\'esmuny entre els teus pseudòpodes.'],
    can:['Cèl·lula tumoral','Tumor','Una cèl·lula del teu propi cos amb mutacions en gens que controlen el cicle cel·lular (com TP53). Es divideix sense fre: cada torn recupera vida per mitosi. Com que és pròpia, el sistema immunitari la reconeix malament.',['Cèl·lula pròpia mutada','Sense paret cel·lular','Mitosi descontrolada','Evita l\'apoptosi'],null,'Carcinoma (cèl·lula pròpia mutada)'],
    bac:['Bacil esporulat','Colònia esporulada','Bacil gram+. Quan les condicions empitjoren forma una endòspora: una estructura deshidratada, amb capes de proteïna i àcid dipicolínic, que resisteix la calor seca, la radiació i els desinfectants. Només el vapor a pressió de l\'autoclau la destrueix.',['Bacteri gram+','Paret de peptidoglicà','Forma endòspores']],
    pri:['Prió','Placa amiloide','Ni tan sols és un ésser viu: és una proteïna pròpia (PrP) plegada de manera anòmala, rica en làmines β. Quan toca una PrP normal, l\'obliga a plegar-se igual: el seu atac creix cada torn. No té ADN ni ARN i el sistema immunitari no la veu com a estranya.',['Proteïna mal plegada','Sense àcids nucleics','Resistent a proteases','Encomana el plegament'],null,'PrPSc (proteïna priònica mal plegada)'],

    cel:{def:'No té paret de cel·lulosa.',veg:'La cel·lulasa digereix la seva paret de cel·lulosa i la deixa indefensa.',lev:'La paret dels fongs és de quitina, no de cel·lulosa.'},
    tc:{def:'Els limfòcits T citotòxics ataquen cèl·lules pròpies infectades o alterades, no microbis lliures.',vir:'Reconeix els pèptids vírics que la cèl·lula infectada presenta a l\'MHC-I i la destrueix, amb el virus a dins.',can:'Reconeix antígens tumorals i li ordena entrar en apoptosi.',lev:'Contra els fongs són més útils els neutròfils i els limfòcits Th17 que els T citotòxics.',pri:'El prió és una proteïna pròpia: no hi ha cap antigen estrany per reconèixer.'},
    tax:{def:'Els eucariotes fan servir microtúbuls per dividir-se: el taxol els afecta.',can:'Es divideix sense control: si bloqueges el fus mitòtic, s\'atura i mor.',gp:'Els bacteris no tenen microtúbuls ni mitosi: es divideixen per fissió binària.',gn:'Els bacteris no tenen microtúbuls ni mitosi: es divideixen per fissió binària.',bac:'Els bacteris no tenen microtúbuls ni mitosi: es divideixen per fissió binària.',myc:'Els bacteris no tenen microtúbuls ni mitosi: es divideixen per fissió binària.',vir:'Un virus no es divideix: el copia la maquinària de la cèl·lula que infecta.',pri:'Un prió no es divideix: converteix proteïnes sanes.',ame:'L\'ameba es divideix per mitosi: el fus li és imprescindible.',par:'El parameci fa servir microtúbuls per dividir-se i per als cilis.'},
    aut:{def:'El vapor a pressió desnaturalitza les seves proteïnes.',bac:'L\'autoclau és l\'únic que destrueix les endòspores.',pri:'Calen 134 °C durant 18 minuts per inactivar prions: un autoclau perllongat.'},
  },
  C:{proto:['Protoplast','El lisozim ha obert la paret de peptidoglicà: sense ella, l\'aigua entra per osmosi i el bacteri rebenta. Així s\'obtenen protoplasts al laboratori.'],
    opso:['Opsonització','Els teus receptors Fc reconeixen la cua dels anticossos: fagocites molt millor el que està marcat.'],
    turg:['Paret digerida','Sense paret de cel·lulosa que aguanti la pressió de turgència, la cèl·lula vegetal esclata en aigua destil·lada.'],
    poro:['Porus a la membrana','Els porus de l\'amfotericina deixen passar ions i aigua: el llevat perd el control osmòtic.'],
    apop:['Mitosi aturada','Una cèl·lula bloquejada en mitosi activa els seus senyals d\'estrès, i el limfòcit T l\'empeny abans a l\'apoptosi.']},
  U:{fue:['Enzims lisosòmics','Més hidrolases àcides als teus lisosomes per digerir el que captures.','Atac ×1,15'],
    mem:['Membrana reforçada','Més fosfolípids i colesterol: una bicapa més estable.','Vida ×1,15'],
    cit:['Citoesquelet','Filaments d\'actina i intermedis que sostenen la cèl·lula davant dels cops.','−4 % de dany rebut'],
    rib:['Ribosomes','Més síntesi de proteïnes: aprofites millor el que digereixes.','ATP per victòria ×1,2'],
    mit:['Mitocondris','Respiració cel·lular: C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + ATP. Produeixen ATP encara que no combatis.','+ATP per segon'],
    ref:['Senyalització ràpida','Segons missatgers (AMPc, Ca²⁺) que acceleren la teva resposta.','Combat automàtic més ràpid']},
  CE:{mac:['Macròfag','Fagòcit gran i longeu que viu als teixits. Presenta antígens als limfòcits i és equilibrat en tot.'],
    neu:['Neutròfil','El leucòcit més abundant: arriba el primer a les infeccions i llança trampes d\'ADN (NET) contra bacteris i fongs. ×1,4 contra bacteris i llevats; una mica menys de vida.'],
    nk:['Limfòcit NK','Assassí natural: detecta cèl·lules que han perdut l\'MHC-I, com les infectades o les tumorals, i les destrueix amb perforina i granzims. ×1,5 contra virus i tumors, i abasta el virus amagat.'],
    eos:['Eosinòfil','Els seus grànuls de proteïna bàsica major ataquen paràsits massa grans per fagocitar-los. ×1,5 contra protozous i una mica més de vida.']},
  SK:{cfp:['CFP (cian)','Variant cian de la GFP.'],gfp:['GFP (verda)','Proteïna verda fluorescent de la medusa Aequorea victoria. Shimomura, Chalfie i Tsien van rebre el Nobel de Química del 2008 per ella.'],
    yfp:['YFP (groga)','Variant groga de la GFP, obtinguda canviant uns pocs aminoàcids.'],bfp:['BFP (blava)','Variant blava de la GFP.'],
    mch:['mCherry (vermella)','Proteïna vermella derivada de DsRed, del corall Discosoma.'],mor:['mOrange','Una altra variant de DsRed, de color taronja.']},
  Z:{san:['Sang','Tot el torrent sanguini: pot aparèixer qualsevol organisme.'],pul:['Pulmons','Alvèols pulmonars: grip, pneumònies bacterianes i atípiques.'],
    int:['Intestí','Intestí: E. coli, amebes, bacils que formen espores i tumors de còlon.'],pie:['Pell','Ferides i pell: estafilococs, Candida i bacils del sòl.'],
    cer:['Cervell','Sistema nerviós: prions, encefalitis víriques i Naegleria, l\'ameba que entra pel nas.'],
    cha:['Bassa','Una gota d\'aigua de bassa al portaobjectes: protozous i fulles d\'Elodea. (Aquí no ets dins d\'un cos: és una pràctica de laboratori.)']},
  EV:{fiebre:['Febre','La temperatura puja a 39 °C: els enzims van més de pressa i tots dos feu un 25 % més de dany.'],
    antib:['Antibiòtic a la sang','Arriba un antibiòtic d\'ampli espectre: si l\'organisme és un bacteri, perd un 8 % de la vida cada torn.'],
    vacuna:['Vacuna','El teu sistema immunitari ja coneix aquest organisme: veus l\'eficàcia de totes les teves eines contra ell i els anticossos fan el doble.'],
    inflam:['Inflamació','Els vasos es dilaten i arriben reforços: recuperes un 6 % de vida cada torn.'],
    hipoxia:['Hipòxia','Falta oxigen: els teus mitocondris rendeixen menys i fas un 20 % menys de dany, però guanyes un 50 % més d\'ATP si guanyes.']},
  SP:[['Sèpsia','Xoc endotòxic: en trencar-se, els bacteris alliberen LPS i et fan mal cada torn.'],['Grip pandèmica','Tempesta de citocines: la teva pròpia inflamació es desboca i tots dos feu un 30 % més de dany.'],
    ['Tumor maligne','Angiogènesi: nous vasos sanguinis l\'alimenten i es cura cada torn, tret que bloquegis la seva mitosi.'],['Placa amiloide','Agregació: la placa creix i el seu atac augmenta un 20 % cada torn.']],
  A:{k1:['Primera fagocitosi','Élie Metchnikoff va descobrir la fagocitosi el 1882 clavant espines de roser en larves d\'estrella de mar. Va rebre el Nobel el 1908.'],
    k100:['Cent victòries','La teva medul·la òssia fabrica cada dia uns 100.000 milions de neutròfils.'],
    gp:['Caçador d\'estafilococs','Al voltant del 30 % de les persones porta Staphylococcus aureus al nas sense emmalaltir.'],
    gn:['Domador d\'E. coli','En condicions ideals, E. coli es divideix cada 20 minuts: en 10 hores, una sola cèl·lula en donaria més de mil milions.'],
    vir:['Antiviral','Un virió de la grip fa uns 100 nm: n\'hi cabrien uns 10.000 en fila en un mil·límetre.'],
    lev:['Equilibri de la flora','Candida albicans viu a la boca i l\'intestí de la majoria de les persones; només causa candidiasi quan es trenca l\'equilibri.'],
    veg:['Botànic','Robert Hooke va anomenar «cèl·lules» les celletes que va veure al suro el 1665: eren les parets de cèl·lules vegetals mortes.'],
    par:['Gota de bassa','Un parameci neda a prop d\'1 mm per segon, unes cinc vegades la seva longitud.'],
    can:['Guardià del genoma','El gen TP53, «el guardià del genoma», està mutat en prop de la meitat dels càncers humans.'],
    pri:['Només proteïna','Stanley Prusiner va rebre el Nobel el 1997 per descobrir els prions, partícules infeccioses fetes només de proteïna.'],
    combo:['Sinergia','La sinergia entre fàrmacs és real: per exemple, un β-lactàmic danya la paret i facilita l\'entrada d\'un aminoglicòsid.'],
    quiz:['Bon ull clínic','Abans de receptar un antibiòtic, el laboratori fa un antibiograma per saber a què és sensible cada bacteri.'],
    sarm:['Pressió selectiva','El SARM es va descriure el 1961, tot just dos anys després que es comencés a fer servir la meticil·lina.'],
    evo:['Descendència','LUCA, l\'últim avantpassat comú universal de tots els éssers vius, va viure fa uns 4.000 milions d\'anys.'],
    l25:['Immunitat adquirida','Els teus limfòcits B poden fabricar milers de milions d\'anticossos diferents gràcies a la recombinació V(D)J.'],
    atlas:['Atles complet','Antonie van Leeuwenhoek va ser el primer a veure bacteris i protozous, cap al 1676, amb microscopis d\'una sola lent que ell mateix polia.'],
    daily:['Constància','El teu cos renova uns 330.000 milions de cèl·lules al dia, al voltant de l\'1 % del total.'],
    boss:['Contra la sèpsia','La sèpsia és una resposta descontrolada del cos davant d\'una infecció: reconèixer-la aviat salva vides.']},
  DA:{noab:'Venç 6 bacteris sense fer servir antibiòtics',great:'Aconsegueix 8 cops «Molt eficaç»',combo:'Fes 3 combinacions',boss:'Venç 2 caps',fago:'Venç 4 organismes fent servir només la fagocitosi',quick:'Guanya 5 combats en 3 torns o menys',kills:'Guanya 25 combats'},
  LB:{gp:['Tinció de Gram','Ø ≈ 1 µm'],gn:['Tinció de Gram','2 × 0,5 µm'],vir:['Tinció negativa · microscopi electrònic','≈ 100 nm'],lev:['Blanc de calcoflúor (s\'uneix a la quitina)','4–6 µm'],
    ame:['Contrast de fases','≈ 500 µm'],veg:['Camp clar, sense tenyir: la clorofil·la ja és verda','≈ 50 µm'],par:['Camp fosc','≈ 200 µm'],myc:['Microscopi electrònic d\'escombratge','0,2–0,3 µm'],
    can:['Hematoxilina i eosina','15–30 µm'],bac:['Verd de malaquita (tinció d\'espores)','3–5 × 1 µm'],pri:['Vermell Congo (birefringència verd poma)','fibril·les de ≈ 10 nm']},
  LI:['Un macròfag no fabrica antibiòtics ni encén autoclaus: les eines representen el que el sistema immunitari i la medicina poden fer contra cada organisme.',
    'Els paramecis i les cèl·lules vegetals no infecten les persones: apareixen com a pràctica de laboratori (la zona Bassa).',
    'Els números de dany, vida i ATP són abstraccions de joc. Els multiplicadors d\'eficàcia són orientatius i comparen uns organismes amb altres.',
    'Les proporcions dels models 3D estan exagerades perquè es vegin els orgànuls.'],
},
en:{
  T:{
    gp:['Staphylococcus','Staphylococcal biofilm','A spherical bacterium (coccus) that grows in clusters. It stains purple in the Gram stain because its thick peptidoglycan wall holds on to the crystal violet. Every few turns it divides by binary fission and recovers health.',['Gram-positive bacterium','Thick peptidoglycan wall','Binary fission']],
    gn:['Gram-negative bacillus','E. coli colony','A rod-shaped bacterium (bacillus) that stains pink in the Gram stain: its peptidoglycan layer is thin and hidden under an outer membrane of lipopolysaccharide (LPS). That membrane holds back lysozyme and many antibiotics. Its flagellum lets it dodge.',['Gram-negative bacterium','Outer membrane with LPS','Thin peptidoglycan','Flagellum'],'Its flagellum spins like a propeller and moves it out of the way.'],
    vir:['Influenza virus','Viraemia','It is not a cell: it is genetic material (RNA) inside a capsid and an envelope studded with haemagglutinin and neuraminidase spikes. It has no metabolism of its own, so antibiotics do nothing to it. Every other turn it hides inside a host cell to replicate, and every few turns its spikes mutate (antigenic drift).',['Acellular','Spiked envelope','Obligate intracellular parasite']],
    lev:['Yeast','Candidiasis','A single-celled eukaryotic fungus. Its wall is made of chitin and glucans (not cellulose or peptidoglycan) and its membrane uses ergosterol instead of cholesterol. It reproduces by budding: a bud sprouts from it and grows.',['Single-celled fungus','Chitin wall','Ergosterol in the membrane','Budding']],
    ame:['Amoeba','Giant amoeba','A protozoan that moves by pushing out pseudopods, extensions of its cytoplasm. It has no cell wall: only its plasma membrane separates it from the outside. That is why it changes shape and dodges easily.',['Protozoan','No cell wall','Pseudopods','Small contractile vacuole'],'It changes shape with its pseudopods and slips away.'],
    veg:['Plant cell','Parenchyma tissue','A eukaryotic cell with a cellulose wall, a large central vacuole and chloroplasts. While there is light it photosynthesises and repairs itself every turn. Look at the cyclosis: the chloroplasts are carried round by the cytoplasm.',['Cellulose wall','Chloroplasts','Central vacuole','Photosynthesis'],null,'Elodea canadensis (parenchyma)'],
    par:['Paramecium','Paramecium swarm','A protozoan covered in cilia that beat in waves: it attacks twice per turn. It lives in fresh water, a hypotonic medium, and has star-shaped contractile vacuoles that keep pumping out the water that enters by osmosis.',['Ciliated protozoan','Contractile vacuole','Thousands of cilia','No cell wall']],
    myc:['Mycoplasma','Atypical pneumonia','One of the smallest bacteria there are, and an exception: it has no cell wall. It takes cholesterol from the host to strengthen its membrane. Without a wall, antibiotics that attack peptidoglycan do nothing to it.',['Wall-less bacterium','Cholesterol in the membrane','Pleomorphic','Tiny'],'It is so small and flexible that it slips between your pseudopods.'],
    can:['Tumour cell','Tumour','A cell from your own body with mutations in genes that control the cell cycle (such as TP53). It divides without stopping: every turn it recovers health by mitosis. Because it is your own, the immune system recognises it poorly.',['Mutated self cell','No cell wall','Uncontrolled mitosis','Evades apoptosis'],null,'Carcinoma (mutated self cell)'],
    bac:['Spore-forming bacillus','Sporulating colony','A Gram-positive bacillus. When conditions get worse it forms an endospore: a dehydrated structure with layers of protein and dipicolinic acid that withstands dry heat, radiation and disinfectants. Only the pressurised steam of an autoclave destroys it.',['Gram-positive bacterium','Peptidoglycan wall','Forms endospores']],
    pri:['Prion','Amyloid plaque','It is not even alive: it is one of your own proteins (PrP) folded the wrong way, rich in β-sheets. When it touches a normal PrP, it forces it to fold the same way: its attack grows every turn. It has no DNA or RNA and the immune system does not see it as foreign.',['Misfolded protein','No nucleic acids','Protease-resistant','Spreads its folding'],null,'PrPSc (misfolded prion protein)'],
  },
  TL:{
    fago:['Phagocytosis','You surround the invader with pseudopods, enclose it in a phagosome and digest it with the enzymes in your lysosomes.'],
    lis:['Lysozyme','An enzyme in tears and saliva. It breaks the β(1→4) bonds between NAM and NAG, the sugars of peptidoglycan.'],
    pen:['Penicillin','A β-lactam antibiotic. It blocks the transpeptidases that cross-link peptidoglycan: the bacterium grows without being able to repair its wall and bursts. Overuse it and you select resistant strains.'],
    uv:['Ultraviolet light','UV-C joins neighbouring thymines in DNA (thymine dimers) and blocks replication and transcription.'],
    ac:['Antibodies','Y-shaped immunoglobulins that bind specific antigens. They neutralise viruses and tag (opsonise) the target: +60 % damage for 3 turns.'],
    anf:['Amphotericin B','An antifungal that binds ergosterol in fungal membranes and opens pores through which ions leak out.'],
    osm:['Osmotic shock','Distilled water: a hypotonic medium. Water enters the cell by osmosis; if no wall holds it in, it swells until it bursts (lysis).'],
    luz:['Lights out','Without light there is no light-dependent stage of photosynthesis: chloroplasts stop making ATP and NADPH, and the cell cannot repair itself.'],
    cel:['Cellulase','An enzyme that hydrolyses cellulose, the polysaccharide that makes up plant cell walls.'],
    tc:['Cytotoxic T cell','A CD8 lymphocyte that recognises foreign peptides displayed on a cell\'s MHC-I and orders it into apoptosis. It attacks infected or tumour cells, even with the virus hidden inside.'],
    tax:['Taxol','An antimitotic drug (paclitaxel). It stabilises microtubules and stops the mitotic spindle forming and coming apart. Blocks division for 3 turns.'],
    aut:['Autoclave','Steam at 121–134 °C and high pressure. It denatures proteins and destroys even endospores and prions.'],
  },
  E:{
    fago:{def:'Phagocytosis works against almost any particle: you engulf it and digest it.',vir:'Virus particles are about 100 nm across: many slip away.',veg:'The plant cell is large and its rigid wall cannot be engulfed.',can:'Tumour cells display a «don\'t eat me» signal (CD47) that holds macrophages back.',pri:'Prion aggregates cannot be digested in lysosomes: they pile up.',ame:'The amoeba phagocytoses too: it is hard to engulf something that does what you do.',par:'A paramecium is about 200 µm long, ten times your size: you can only bite pieces off it.'},
    lis:{def:'It has no peptidoglycan: that molecule only exists in bacterial cell walls.',gp:'Its peptidoglycan is thick and exposed: lysozyme cuts it and the wall falls apart.',gn:'The outer membrane of Gram-negative bacteria covers their thin peptidoglycan layer.',bac:'Bacillus is Gram-positive: a thick, exposed peptidoglycan wall.',myc:'Mycoplasma has no cell wall: there is no peptidoglycan to break.',vir:'A virus has no wall and no peptidoglycan.',lev:'Fungal walls are made of chitin and glucans, not peptidoglycan.',veg:'The plant wall is made of cellulose: lysozyme does not recognise it.',pri:'A prion is a protein: it has no wall to break.'},
    pen:{def:'Penicillin only stops bacteria from building their peptidoglycan wall.',gp:'Without transpeptidases, the bacterium cannot strengthen its wall as it grows: it bursts.',bac:'Gram-positive: penicillin reaches its wall unhindered.',gn:'The outer membrane keeps penicillin out; many Gram-negative bacteria resist it.',myc:'With no cell wall, penicillin has no target. That is why mycoplasma pneumonia is treated with other antibiotics, such as macrolides.',vir:'Antibiotics do not affect viruses: they have no wall and no metabolism of their own.',lev:'Fungi are eukaryotes with a chitin wall: penicillin does not affect them. In fact, penicillin is made by a fungus, Penicillium.'},
    uv:{def:'UV damages the DNA of any cell.',gp:'Bacteria have a single naked chromosome: UV damages it easily.',gn:'Bacteria have a single naked chromosome: UV damages it easily.',myc:'A tiny genome with no wall to protect it.',vir:'The dimers UV forms in its genome stop the virus replicating.',veg:'Pigments and the wall filter out part of the radiation.',bac:'Until it forms the endospore, its DNA is vulnerable.',pri:'A prion is only protein: it has no DNA or RNA to damage.'},
    ac:{def:'Antibodies recognise its surface antigens and tag it.',vir:'Antibodies neutralise the virus: they cover the haemagglutinin it uses to bind your cells.',gp:'Antibodies opsonise the bacterium: they tag it for you to destroy.',gn:'Antibodies opsonise the bacterium and activate complement against its outer membrane.',veg:'The wall stops them reaching the membrane, but they tag it.',can:'It is a self cell: it has few antigens your immune system sees as foreign.',pri:'The prion is one of your own proteins, misfolded: your immune system does not recognise it as foreign.'},
    anf:{def:'Animal cells use cholesterol, not ergosterol: it barely affects them.',lev:'Amphotericin B binds the ergosterol in its membrane and opens pores: the yeast loses ions and dies.',gp:'Bacteria have no sterols in their membrane.',gn:'Bacteria have no sterols in their membrane.',bac:'Bacteria have no sterols in their membrane.',myc:'Mycoplasma takes cholesterol from the host for its membrane: it has some effect.',vir:'Its envelope comes from the host cell membrane and has no ergosterol.',veg:'Plants use phytosterols, similar to ergosterol but not the same.',ame:'Many free-living amoebae have sterols similar to ergosterol. Amphotericin B is used against Naegleria fowleri, the «brain-eating amoeba».',par:'Paramecium uses other sterols (such as tetrahymanol): it barely affects it.',pri:'A prion has no membrane.'},
    osm:{def:'Its cell wall withstands the pressure of the incoming water: it becomes turgid but does not burst.',ame:'With no cell wall, water flows in by osmosis until the membrane bursts.',myc:'Mycoplasma has no wall: osmotic lysis is immediate.',can:'An animal cell has no wall: it swells and bursts.',par:'Its contractile vacuoles pump the incoming water back out: it is adapted to fresh water.',veg:'The cellulose wall withstands turgor pressure: the cell becomes turgid, it does not burst.',vir:'A virus is not a cell: there is no osmosis to make it burst.',pri:'A prion is a protein: it has no membrane or cytoplasm.'},
    luz:{def:'It does not photosynthesise: darkness does not affect it.',veg:'Without light, chloroplasts cannot carry out the light-dependent stage: no more repairs by photosynthesis.'},
    cel:{def:'It has no cellulose wall.',veg:'Cellulase digests its cellulose wall and leaves it defenceless.',lev:'Fungal walls are made of chitin, not cellulose.'},
    tc:{def:'Cytotoxic T cells attack infected or altered self cells, not free microbes.',vir:'It recognises the viral peptides the infected cell displays on its MHC-I and destroys it, virus and all.',can:'It recognises tumour antigens and orders the cell into apoptosis.',lev:'Against fungi, neutrophils and Th17 cells are more useful than cytotoxic T cells.',pri:'The prion is a self protein: there is no foreign antigen to recognise.'},
    tax:{def:'Eukaryotes use microtubules to divide: taxol affects them.',can:'It divides out of control: block its mitotic spindle and it stops and dies.',gp:'Bacteria have no microtubules and no mitosis: they divide by binary fission.',gn:'Bacteria have no microtubules and no mitosis: they divide by binary fission.',bac:'Bacteria have no microtubules and no mitosis: they divide by binary fission.',myc:'Bacteria have no microtubules and no mitosis: they divide by binary fission.',vir:'A virus does not divide: it is copied by the machinery of the cell it infects.',pri:'A prion does not divide: it converts healthy proteins.',ame:'The amoeba divides by mitosis: it cannot do without the spindle.',par:'Paramecium uses microtubules to divide and for its cilia.'},
    aut:{def:'Pressurised steam denatures its proteins.',bac:'The autoclave is the only thing that destroys endospores.',pri:'Inactivating prions takes 134 °C for 18 minutes: an extended autoclave cycle.'},
  },
  C:{proto:['Protoplast','Lysozyme opened the peptidoglycan wall: without it, water flows in by osmosis and the bacterium bursts. This is how protoplasts are made in the lab.'],
    opso:['Opsonization','Your Fc receptors recognise the tails of antibodies: you phagocytose tagged targets far better.'],
    turg:['Digested wall','With no cellulose wall to withstand turgor pressure, the plant cell bursts in distilled water.'],
    poro:['Membrane pores','Amphotericin pores let ions and water through: the yeast loses osmotic control.'],
    apop:['Arrested mitosis','A cell stuck in mitosis switches on its stress signals, and the T cell pushes it into apoptosis sooner.']},
  U:{fue:['Lysosomal enzymes','More acid hydrolases in your lysosomes to digest what you catch.','Attack ×1.15'],
    mem:['Reinforced membrane','More phospholipids and cholesterol: a more stable bilayer.','Health ×1.15'],
    cit:['Cytoskeleton','Actin and intermediate filaments that hold the cell together under blows.','−4 % damage taken'],
    rib:['Ribosomes','More protein synthesis: you get more out of what you digest.','ATP per win ×1.2'],
    mit:['Mitochondria','Cellular respiration: C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + ATP. They make ATP even when you are not fighting.','+ATP per second'],
    ref:['Fast signalling','Second messengers (cAMP, Ca²⁺) that speed up your response.','Faster auto battle']},
  CE:{mac:['Macrophage','A large, long-lived phagocyte that lives in tissues. It presents antigens to lymphocytes and is well balanced.'],
    neu:['Neutrophil','The most abundant white blood cell: first to arrive at infections, it casts DNA traps (NETs) against bacteria and fungi. ×1.4 against bacteria and yeasts; a little less health.'],
    nk:['NK cell','Natural killer: it spots cells that have lost MHC-I, like infected or tumour cells, and destroys them with perforin and granzymes. ×1.5 against viruses and tumours, and it reaches the hidden virus.'],
    eos:['Eosinophil','Its major basic protein granules attack parasites too large to phagocytose. ×1.5 against protozoa and a little more health.']},
  SK:{cfp:['CFP (cyan)','A cyan variant of GFP.'],gfp:['GFP (green)','Green fluorescent protein from the jellyfish Aequorea victoria. Shimomura, Chalfie and Tsien won the 2008 Nobel Prize in Chemistry for it.'],
    yfp:['YFP (yellow)','A yellow variant of GFP, made by changing a few amino acids.'],bfp:['BFP (blue)','A blue variant of GFP.'],
    mch:['mCherry (red)','A red protein derived from DsRed, from the coral Discosoma.'],mor:['mOrange','Another DsRed variant, orange in colour.']},
  Z:{san:['Blood','The whole bloodstream: any organism can appear.'],pul:['Lungs','Lung alveoli: flu, bacterial and atypical pneumonia.'],
    int:['Gut','The intestine: E. coli, amoebae, spore-forming bacilli and colon tumours.'],pie:['Skin','Wounds and skin: staphylococci, Candida and soil bacilli.'],

  for (let x=8;x<s;x+=16){ g.beginPath(); g.moveTo(x,0); for (let y=0;y<=s;y+=16) g.lineTo(x + (y/16 % 2 ? 6 : -6), y); g.stroke(); } }, {color:true});
const SHAFT = ctex(64, (g, s) => { const gr = g.createLinearGradient(0,0,s,0);
  gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(.5,'rgba(255,255,255,1)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,s,s); }, {wrap:false});

// ---- Material de membrana: estándar + borde de Fresnel (las membranas brillan en el contorno, como en fluorescencia) ----
function mem(color, o={}){
  const transp = o.op != null;
  const m = new THREE.MeshStandardMaterial({
    color, roughness:o.rough ?? .5, metalness:0, map:o.map || null,
    transparent:transp, opacity:o.op ?? 1, depthWrite:!transp, side:o.side ?? THREE.FrontSide,
    emissive:new THREE.Color(o.emi ?? color).multiplyScalar(o.emiK ?? .12),
    bumpMap:o.bump === false ? null : BUMP, bumpScale:o.bumpScale ?? .012, flatShading:!!o.flat });
  const U = {rimC:{value:new THREE.Color(o.rim ?? color)}, rimK:{value:o.rimK ?? 1}, rimP:{value:o.rimP ?? 2.6}, rimA:{value:o.rimA ?? (transp ? .75 : 0)}};
  m.userData.U = U;
  m.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, U);
    sh.fragmentShader = 'uniform vec3 rimC;\nuniform float rimK;\nuniform float rimP;\nuniform float rimA;\n' +
      sh.fragmentShader.replace('#include <emissivemap_fragment>',
        '#include <emissivemap_fragment>\n' +
        'float fr = pow(1.0 - clamp(abs(dot(normalize(vViewPosition), normal)), 0.0, 1.0), rimP);\n' +
        'totalEmissiveRadiance += rimC * fr * rimK;\n' +
        'diffuseColor.a = mix(diffuseColor.a, 1.0, fr * rimA);');
  };
  return m;
}

// ---- Geometría ----
const mesh = (geo, mat, ro) => { const m = new THREE.Mesh(geo, mat); if (ro != null) m.renderOrder = ro; return m; };
const sphG = (r, w=24, h=16) => new THREE.SphereGeometry(r, w, h);
// cápsula (bacilo) por revolución
function capG(len, r, seg=20, n=8){
  const pts = [];
  for (let i=0;i<=n;i++){ const a = -Math.PI/2 + i/n*Math.PI/2; pts.push(new THREE.Vector2(Math.max(1e-4, Math.cos(a)*r), -len/2 + Math.sin(a)*r)); }
  for (let i=0;i<=n;i++){ const a = i/n*Math.PI/2; pts.push(new THREE.Vector2(Math.max(1e-4, Math.cos(a)*r), len/2 + Math.sin(a)*r)); }
  return new THREE.LatheGeometry(pts, seg);
}
// caja redondeada (pared vegetal) con normales suaves
function rboxG(w, h, d, r, s=8){
  const g = new THREE.BoxGeometry(w, h, d, s, s, s), p = g.attributes.position, nrm = g.attributes.normal, v = V(), inn = V(), n = V();
  const hx = w/2 - r, hy = h/2 - r, hz = d/2 - r;
  for (let i=0;i<p.count;i++){
    v.fromBufferAttribute(p, i); inn.set(clamp(v.x,-hx,hx), clamp(v.y,-hy,hy), clamp(v.z,-hz,hz));
    n.copy(v).sub(inn).normalize(); v.copy(inn).addScaledVector(n, r);
    p.setXYZ(i, v.x, v.y, v.z); nrm.setXYZ(i, n.x, n.y, n.z);
  }
  return g;
}
// hélice (flagelos, ARN, hélices α)
function helixG(len, amp, turns, r, ramp=true, seg=90){
  const pts = [];
  for (let i=0;i<=60;i++){ const s = i/60, th = s*turns*Math.PI*2, A = amp*(ramp ? Math.min(1, s*3) : 1); pts.push(V(Math.cos(th)*A, s*len, Math.sin(th)*A)); }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg, r, 6);
}
function randIn(a, b, c){ let d; do { d = V(srn(-1,1), srn(-1,1), srn(-1,1)); } while (d.lengthSq() > 1); return V(d.x*a, d.y*b, d.z*c); }
// ADN enmarañado (nucleoide)
function tangleG(n, a, b, c, r){ const pts = []; for (let i=0;i<n;i++) pts.push(randIn(a, b, c)); return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), n*6, r, 5); }
function fibDirs(n){ const out = [], ga = Math.PI*(3 - Math.sqrt(5)); for (let i=0;i<n;i++){ const y = 1 - 2*(i+.5)/n, r = Math.sqrt(1 - y*y); out.push(V(Math.cos(ga*i)*r, y, Math.sin(ga*i)*r)); } return out; }
// puntos sobre la superficie de una cápsula
function capPts(n, L, R){ const out = [];
  for (let i=0;i<n;i++){
    if (sr() < .72){ const a = srn(0, Math.PI*2), y = srn(-L/2, L/2); out.push({p:V(Math.cos(a)*R, y, Math.sin(a)*R), n:V(Math.cos(a), 0, Math.sin(a))}); }
    else { const d = V(srn(-1,1), srn(-1,1), srn(-1,1)).normalize(); out.push({p:V(d.x*R, d.y*R + Math.sign(d.y)*L/2, d.z*R), n:d}); }
  } return out; }
const _M = new THREE.Matrix4(), _Q = new THREE.Quaternion(), _S = V();
// objetos repetidos (espículas, cilios, ribosomas...) con InstancedMesh
function inst(geo, mat, list, ro){
  const im = new THREE.InstancedMesh(geo, mat, list.length);
  list.forEach((it, i) => { _Q.setFromUnitVectors(UP, it.n || UP); const s = it.s ?? 1; _S.set(s, s, s); _M.compose(it.p, _Q, _S); im.setMatrixAt(i, _M); });
  im.instanceMatrix.needsUpdate = true; if (ro != null) im.renderOrder = ro; return im;
}
// esfera deformable: ondulación de membrana + lóbulos (pseudópodos)
function blob(r, mat, o={}){
  const geo = new THREE.SphereGeometry(r, o.w || 48, o.h || 32);
  if (o.shape){ const p = geo.attributes.position, v = V(); for (let i=0;i<p.count;i++){ v.fromBufferAttribute(p, i); o.shape(v, r); p.setXYZ(i, v.x, v.y, v.z); } geo.computeVertexNormals(); }
  const base = Float32Array.from(geo.attributes.position.array);
  const m = mesh(geo, mat, o.ro);
  const lobes = o.lobes || [];
  m.userData.wob = (t, amp=.08, f=2.2, sp=1, ruff=0) => {
    const a = geo.attributes.position.array;
    for (let i=0;i<a.length;i+=3){
      const x = base[i]/r, y = base[i+1]/r, z = base[i+2]/r;
      let s = 1 + amp*(Math.sin(x*f + t*sp)*Math.sin(y*f*1.3 + t*1.1*sp)*Math.sin(z*f*.9 + t*.7*sp) + .5*Math.sin((x+z)*f*1.7 - t*1.3*sp));
      if (ruff) s += ruff*Math.sin(x*12 + t*2.1)*Math.sin(y*14 - t*1.7)*Math.sin(z*13 + t*1.3);
      if (lobes.length){ const len = Math.max(.001, Math.sqrt(x*x + y*y + z*z));
        for (let k=0;k<lobes.length;k++){ const L = lobes[k]; if (!L.a) continue; const d = (x*L.d.x + y*L.d.y + z*L.d.z)/len; if (d > 0) s += L.a*Math.pow(d, L.k || 6); } }
      a[i] = base[i]*s; a[i+1] = base[i+1]*s; a[i+2] = base[i+2]*s;
    }
    geo.attributes.position.needsUpdate = true; geo.computeVertexNormals();
  };
  return m;
}
// núcleo arriñonado (macrófagos, paramecio)
const bean = (v, r) => { v.x *= 1.35; const k = Math.exp(-(v.x*v.x)/(r*r)*2.5); if (v.y > 0) v.y -= .55*k*v.y; };
// anticuerpo en forma de Y
function antibody(mat, s=1){
  const g = new THREE.Group();
  const stem = mesh(capG(.22*s, .03*s, 6, 3), mat); stem.position.y = -.13*s; g.add(stem);
  [-1, 1].forEach(k => { const arm = mesh(capG(.22*s, .03*s, 6, 3), mat); arm.position.set(k*.1*s, .1*s, 0); arm.rotation.z = -k*.75; g.add(arm); });
  return g;
}

/* ---------- Tu célula: macrófago ---------- */
// U = niveles de los orgánulos: cada mejora cambia la célula de forma visible
function buildMacrophage(cellId='mac', col=0x58c8ff, evos=0, U={}){
  SEED = 101;
  const lv = k => U[k] || 0;
  const CD = CELLS[cellId] || CELLS.mac, rimCol = new THREE.Color(col).lerp(new THREE.Color(0xffffff), .45).getHex();
  const g = new THREE.Group();
  const lobes = [{d:V(1,0,0), a:0, k:5},
    {d:V(-.3,.9,.3).normalize(), a:.16, k:7, b:.16, ph:0}, {d:V(-.7,-.6,.4).normalize(), a:.2, k:7, b:.2, ph:2},
    {d:V(.3,-.5,-.8).normalize(), a:.14, k:7, b:.14, ph:4}, {d:V(-.4,.2,-.9).normalize(), a:.12, k:7, b:.12, ph:1}];
  const sc = cellId === 'mac' ? 1 : cellId === 'neu' ? .82 : cellId === 'nk' ? .74 : .88; // tamaño relativo
  // membrana reforzada: contorno más grueso y brillante; desde el nivel 8, una segunda capa
  const memM = mem(col, {op:Math.min(.42, .34 + .008*lv('mem')), rim:rimCol, rimK:1.7 + .05*Math.min(lv('mem'), 15), rimP:2.2 - .04*Math.min(lv('mem'), 15), rimA:.85, rough:.25, bumpScale:.03 + .002*lv('mem')});
  const memb = blob(1.2*sc, memM, {lobes, ro:10});
  if (lv('mem') >= 8) g.add(blob(1.27*sc, mem(rimCol, {op:.06, rim:rimCol, rimK:1.2, rimA:.4, bump:false}), {w:32, h:20, ro:11}));
  const cyto = blob(1.0*sc, mem(new THREE.Color(col).multiplyScalar(.35).getHex(), {op:.16, rimK:.3, rimA:.2, bump:false}), {w:32, h:20, ro:4});
  g.add(memb, cyto);
  const inner = new THREE.Group(); g.add(inner);
  inner.scale.setScalar(sc);
  // núcleo: arriñonado (macrófago), multilobulado (neutrófilo), redondo y grande (NK) o bilobulado (eosinófilo)
  const nm = mem(0x7b8cff, {map:CHROM, rim:0xc4ceff, rimK:.7 + .08*lv('nuc'), emiK:.18 + .04*lv('nuc')});
  let nuc;
  if (CD.nuc === 'bean'){ nuc = blob(.42, nm, {w:36, h:24, shape:bean}); nuc.position.set(.12,.05,0); nuc.rotation.z = .3; inner.add(nuc); }
  else if (CD.nuc === 'round'){ nuc = blob(.55, nm, {w:36, h:24}); nuc.position.set(.08,.04,0); inner.add(nuc); }
  else {
    nuc = new THREE.Group(); nuc.userData.wob = () => {};
    const lobesN = CD.nuc === 'lobes' ? [V(-.42,.12,0), V(-.12,.28,.08), V(.2,.22,-.05), V(.42,-.02,.06)] : [V(-.25,.1,0), V(.25,.06,.05)];
    lobesN.forEach((p, i) => { const l = mesh(sphG(CD.nuc === 'lobes' ? .2 : .3, 24, 16), nm); l.position.copy(p); nuc.add(l);
      if (i){ const a = lobesN[i-1], len = a.distanceTo(p); const br = mesh(new THREE.CylinderGeometry(.05, .05, len, 8), nm); br.position.copy(a).lerp(p, .5); br.quaternion.setFromUnitVectors(UP, p.clone().sub(a).normalize()); nuc.add(br); } });
    inner.add(nuc);
  }
  if (lv('nuc')) nuc.scale.setScalar(1 + Math.min(.3, .03*lv('nuc')));
  // gránulos característicos (rojos en el NK, naranjas en el eosinófilo)
  if (cellId !== 'mac') inner.add(inst(sphG(.055, 10, 8), mem(CD.gran, {emiK:.7, rim:0xffffff, rimK:.5, bump:false}), Array.from({length:cellId === 'eos' ? 40 : 24}, () => ({p:randIn(.8,.65,.65)}))));
  // aparato de Golgi: cisternas curvas apiladas y vesículas
  const gm = mem(0xffc65c, {emiK:.3, rim:0xfff0b8, rimK:.8, side:THREE.DoubleSide, bump:false});
  const gol = new THREE.Group();
  for (let i=0;i<5 + Math.min(lv('gol'), 6);i++) gol.add(mesh(new THREE.SphereGeometry(.22 + i*.04, 20, 6, 0, Math.PI*.9, Math.PI*.36, Math.PI*.22), gm));
  for (let i=0;i<7 + 3*lv('gol');i++){ const v = mesh(sphG(.035, 10, 8), gm); const a = srn(0, Math.PI*.9); v.position.set(Math.cos(a)*.5, srn(-.12,.12), Math.sin(a)*.5); gol.add(v); }
  gol.position.set(-.55,.35,.25); gol.rotation.set(.4, 2.4, .3); inner.add(gol);
  // mitocondrias con crestas
  const mm = mem(0xff7a4a, {map:CRISTAE, rim:0xffb08a, rimK:.6, emiK:.15, bump:false});
  for (let i=0;i<Math.min(20, 6 + lv('mit'));i++){ const c = mesh(capG(.2, .07, 12, 5), mm); c.position.copy(randIn(.75,.6,.6)); c.rotation.set(srn(0,3), srn(0,3), srn(0,3)); inner.add(c); }
  // lisosomas
  const lyM = mem(0xd8ff6b, {emiK:.5 + .02*Math.min(lv('fue'), 25), rim:0xffffff, rimK:.4, bump:false});
  inner.add(inst(sphG(.055, 10, 8), lyM, Array.from({length:Math.min(44, 12 + 1.5*lv('fue') | 0)}, () => ({p:randIn(.85,.7,.7)}))));
  // citoesqueleto: filamentos de actina visibles
  if (lv('cit')){ const n = Math.min(90, 8*lv('cit')), pos = new Float32Array(n*6);
    for (let i=0;i<n;i++){ const a = randIn(.9,.75,.75), b = randIn(.9,.75,.75); pos.set([a.x,a.y,a.z,b.x,b.y,b.z], i*6); }
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    inner.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({color:0x8fdfff, transparent:true, opacity:.28, blending:THREE.AdditiveBlending, depthWrite:false}))); }
  // peroxisomas (verdes)
  if (lv('per')) inner.add(inst(sphG(.05, 10, 8), mem(0x8fff9a, {emiK:.7, rim:0xffffff, rimK:.4, bump:false}), Array.from({length:4*lv('per')}, () => ({p:randIn(.8,.65,.65)}))));
  // centrosoma: dos centríolos perpendiculares con su áster de microtúbulos
  if (lv('cen')){ const cg = new THREE.Group(), cM = mem(0xff9fd8, {emiK:.5, bump:false});
    [0, 1].forEach(k => { const c = new THREE.Group(); for (let i=0;i<9;i++){ const a = i/9*Math.PI*2, r = mesh(new THREE.CylinderGeometry(.008, .008, .12, 4), cM); r.position.set(Math.cos(a)*.035, 0, Math.sin(a)*.035); c.add(r); }
      if (k) c.rotation.z = Math.PI/2; cg.add(c); });
    const n = 10 + 4*lv('cen'), pos = new Float32Array(n*6);
    for (let i=0;i<n;i++){ const d = V(srn(-1,1), srn(-1,1), srn(-1,1)).normalize().multiplyScalar(.5); pos.set([0,0,0,d.x,d.y,d.z], i*6); }
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    cg.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({color:0xff9fd8, transparent:true, opacity:.3, blending:THREE.AdditiveBlending, depthWrite:false})));
    cg.position.set(-.35,-.3,.3); inner.add(cg); }
  // retículo endoplasmático rugoso alrededor del núcleo
  const erM = mem(0x4dd6c8, {op:.55, rimK:.6, bump:false});
  for (let k=0;k<2;k++){
    const pts = []; for (let i=0;i<=30;i++){ const a = i/30*Math.PI*1.6 + k*2.2; pts.push(V(Math.cos(a)*(.62 + .05*Math.sin(i*1.7)), Math.sin(i*.9 + k)*.25, Math.sin(a)*(.56 + .05*Math.cos(i*1.3)))); }
    const curve = new THREE.CatmullRomCurve3(pts);
    inner.add(mesh(new THREE.TubeGeometry(curve, 90, .028, 6), erM, 5));
    const nr = Math.min(200, 40 + 15*lv('rib')); // ribosomas: más con cada mejora
    inner.add(inst(sphG(.014, 5, 4), mem(0x9ff5e8, {emiK:.5 + .03*Math.min(lv('rib'), 15), bump:false}), Array.from({length:nr}, (_, i) => ({p:curve.getPoint(i/nr).add(randIn(.035,.035,.035))}))));
  }
  // retículo endoplasmático liso: tubos sin ribosomas
  for (let k=0;k<Math.min(4, lv('rel') ? 1 + Math.floor(lv('rel')/3) : 0);k++){
    const pts = []; for (let i=0;i<=20;i++) pts.push(randIn(.8,.6,.6));
    inner.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, .02, 5), mem(0x9ff0ff, {op:.5, rimK:.6, bump:false}), 5)); }
  // filopodios: tu linaje gana más con cada evolución
  const fil = inst(new THREE.ConeGeometry(.025, .35, 5).translate(0, .175, 0), mem(rimCol, {op:.6, rimK:.8, bump:false}), fibDirs(Math.min(44, 16 + evos*4)).map(d => ({p:d.clone().multiplyScalar(1.12*sc), n:d})), 9);
  g.add(fil);
  // orgánulos de élite: receptores tipo Toll, glucocáliz y gránulos secretores
  if (lv('tlr')) g.add(inst(new THREE.ConeGeometry(.03, .16, 5).translate(0, .08, 0), mem(0xffb547, {emiK:.6, bump:false}), fibDirs(Math.min(60, 6*lv('tlr'))).map(d => ({p:d.clone().multiplyScalar(1.06*sc), n:d})), 9));
  if (lv('glc')) g.add(mesh(new THREE.IcosahedronGeometry(1.2*sc, 3), mem(0x9be7ff, {op:.05 + .012*Math.min(lv('glc'), 12), rimA:.6, rimK:.9, side:THREE.DoubleSide, bump:false}), 9));
  if (lv('sec')) inner.add(inst(sphG(.045, 8, 6), mem(0xff7ad9, {emiK:.7, bump:false}), Array.from({length:Math.min(60, 6*lv('sec'))}, () => ({p:randIn(.85,.7,.7)}))));
  let reachA = 0;
  const mitK = Math.min(1, lv('mit')/12);
  return {g,
    reach(p, dirWorld){ lobes[0].d.copy(dirWorld).applyAxisAngle(UP, -g.rotation.y).normalize(); reachA = Math.sin(p*Math.PI)*.85; },
    up(t){
      lobes[0].a = reachA;
      for (let i=1;i<lobes.length;i++) lobes[i].a = lobes[i].b*(.6 + .6*Math.sin(t*.7 + lobes[i].ph));
      memb.userData.wob(t, .05, 2, 1, .02); cyto.userData.wob(t+3, .06, 2.4, .8); nuc.userData.wob(t+5, .03, 3, .5);
      inner.rotation.y = Math.sin(t*.2)*.25; inner.rotation.x = Math.sin(t*.17)*.1; fil.rotation.y = Math.sin(t*.5)*.1;
      mm.emissiveIntensity = 1 + mitK*1.2*(.5 + .5*Math.sin(t*2.2)); // las mitocondrias laten al producir ATP
      lyM.emissiveIntensity = .9 + .2*Math.sin(t*1.7);
    }};
}

/* ---------- Organismos ---------- */
const BUILD = {

  gp(){ SEED = 201; const g = new THREE.Group();

    const dots = []; cs.forEach(c => { for (let j=0;j<4;j++){ const d = V(srn(-1,1), srn(-1,1), srn(-1,1)).normalize(); dots.push({p:c.position.clone().addScaledVector(d, .36), n:d}); } });
    g.add(inst(new THREE.CylinderGeometry(.012, .012, .08, 4).translate(0, .04, 0), mem(0xffffff, {emiK:.6, bump:false}), dots));
    const slime = blob(1.35, mem(0xb48cff, {op:.06, rim:0xb48cff, rimK:.5, rimA:.25, bump:false}), {w:28, h:18, ro:10}); g.add(slime);

  // E. coli: dos membranas, nucleoide, ribosomas, fimbrias y flagelos perítricos
  gn(){ SEED = 301; const g = new THREE.Group(), body = new THREE.Group(); g.add(body); body.rotation.z = Math.PI/2;
    const L = 1.5, R = .48;
    body.add(mesh(capG(L, R, 40, 10), mem(0xff6fae, {op:.36, rim:0xffc0dc, rimK:1.5, rimA:.8, bumpScale:.02}), 10));
    body.add(mesh(capG(L*.96, R*.86, 32, 8), mem(0xb03a72, {op:.3, rimK:.4, rimA:.4, bump:false}), 6));

  o.g.traverse(n => { const ms = n.material ? [].concat(n.material) : []; ms.forEach(m => {
    if (m.color) m.color.lerp(c, k);

function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h;

  const a = w/h, portrait = a < .9;
  PORTRAIT = portrait;
  if (portrait){ P_POS.set(-1.3,-1.6,.9); E_BASE.set(1.3,1.1,-.5); } else { P_POS.set(-2.3,-.1,.9); E_BASE.set(2.3,.25,-.5); }

  document.documentElement.style.setProperty('--toolsH', $('#tools').offsetHeight + 'px');

  const r = el => $(el).getBoundingClientRect();

  const halfW = portrait ? 2.7 : 4.2, halfH = portrait ? 2.9 : 2.1;

  const snap = !CAMC.ok || CAMT.w !== w || CAMT.h !== h;

function zonePool(){
  const unlocked = TYPE_ORDER.filter(id => TYPES[id].min <= S.level);
  const Z = ZONES[S.zone] || ZONES.san;
  if (!Z.types) return {pool:unlocked, fallback:false};

}

}
function bossType(){ // el jefe rota entre los tres organismos más recientes de la zona

const special = e => e.special >= 0 ? SPECIAL[e.special] : null;

function eff(toolId, e, opt={}){
  const t = EFF[toolId];
