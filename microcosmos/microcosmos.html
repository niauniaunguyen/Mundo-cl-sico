<meta charset="utf-8">
<title>Microcosmos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Figtree:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: la escena 3D ocupa toda la pantalla, como el campo oscuro de un microscopio de fluorescencia.
   El HUD flota encima: nivel y recursos arriba, ficha del enemigo arriba a la derecha, herramientas abajo.
   Diseño deliberadamente de un solo tema (oscuro): los fluoróforos solo se ven sobre fondo negro. */
:root{
  --slide:#04080d;          /* campo oscuro */
  --glass:rgba(8,18,27,.84);/* paneles: cubreobjetos */
  --line:#1b3446;
  --fg:#dcecf3;
  --muted:#86a2b3;
  --dapi:#6c95ff;           /* azul DAPI: núcleos */
  --gfp:#4dffa0;            /* verde GFP: eficaz */
  --mcherry:#ff4f7b;        /* rojo mCherry: daño, enemigo */
  --fitc:#ffc65c;           /* ámbar: ATP */
  --gram:#a67bff;           /* violeta cristal: ADN, evolución */
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--slide);color:var(--fg);font-family:var(--f-body);font-size:15px}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
#c{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible{outline:2px solid var(--gfp);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* ---------- HUD superior ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--slide),rgba(4,8,13,0));pointer-events:none}
#hud > *{pointer-events:auto}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--fg)}
.brand b{color:var(--gfp);font-weight:700}
.lvl{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--glass)}
.lvl .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lvl .v{font-family:var(--f-display);font-size:16px}
.pips{display:flex;gap:4px;align-items:center}
.pip{width:8px;height:8px;border-radius:50%;border:1px solid var(--muted)}
.pip.on{background:var(--gfp);border-color:var(--gfp);box-shadow:0 0 6px var(--gfp)}
.pip.boss{width:12px;height:12px;border-color:var(--mcherry)}
.pip.boss.on{background:var(--mcherry);box-shadow:0 0 8px var(--mcherry)}
.res{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{display:flex;align-items:baseline;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--glass)}
.chip .k{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.chip.atp .v{color:var(--fitc)} .chip.adn .v{color:var(--gram)}
.chip small{color:var(--muted);font-size:11px}
.ctrls{display:flex;gap:6px}
.tog{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--glass);font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.tog .led{width:8px;height:8px;border-radius:50%;background:#2a3a46}
.tog[aria-pressed="true"] .led{background:var(--gfp);box-shadow:0 0 6px var(--gfp)}
.tog:disabled{opacity:.45;cursor:not-allowed}
.tog.lab{border-color:var(--fitc);color:var(--fitc);position:relative}
.tog.lab .dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--fitc);box-shadow:0 0 6px var(--fitc)}

/* ---------- Fichas de combate ---------- */
.card{position:absolute;background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:10px 12px;backdrop-filter:blur(6px)}
#foe{top:calc(66px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(340px,calc(100% - 32px))}
#foe .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mcherry)}
#foe h2{margin:2px 0 0;font-family:var(--f-display);font-weight:500;font-size:17px;text-wrap:balance}
#foe .sci{font-style:italic;color:var(--muted);font-size:13px}
.bar{position:relative;height:10px;border-radius:5px;background:#0d1b26;overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--mcherry);transition:width .25s}
.bar.me i{background:var(--gfp)}
.barlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}
.traits{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.trait{font-size:12px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--fg);background:#0b1720}
.trait.st{border-color:var(--fitc);color:var(--fitc)}
.trait.good{border-color:var(--gfp);color:var(--gfp)}

#me{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--toolsH,120px) + 12px);width:min(260px,calc(50% - 24px))}
#me .who{font-family:var(--f-display);font-size:14px}
#me .who small{font-family:var(--f-body);color:var(--muted);font-size:12px;margin-left:4px}

#msg{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--toolsH,120px) + 12px);width:min(440px,calc(50% - 24px));
  background:var(--glass);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:8px;padding:9px 12px;font-size:14px;line-height:1.4}
#msg .verdict{font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
#msg.v-great{border-left-color:var(--gfp)} #msg.v-great .verdict{color:var(--gfp)}
#msg.v-ok{border-left-color:var(--dapi)} #msg.v-ok .verdict{color:var(--dapi)}
#msg.v-bad{border-left-color:var(--fitc)} #msg.v-bad .verdict{color:var(--fitc)}
#msg.v-none{border-left-color:var(--mcherry)} #msg.v-none .verdict{color:var(--mcherry)}
#msg .extra{color:var(--muted);font-size:13px;margin-top:3px}

/* ---------- Herramientas ---------- */
#tools{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(rgba(4,8,13,0),var(--slide) 30%)}
.tool{position:relative;text-align:left;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--glass);min-height:52px;display:flex;flex-direction:column;justify-content:space-between;gap:3px;overflow:hidden}
.tool:hover:not(:disabled){border-color:var(--dapi)}
.tool:disabled{cursor:not-allowed}
.tool .tn{font-weight:700;font-size:13px;line-height:1.15}
.tool .tm{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.tool .sw{width:10px;height:10px;border-radius:50%;flex:none}
.badge{font-family:var(--f-data);font-size:11px;font-weight:700;padding:1px 5px;border-radius:4px;border:1px solid currentColor}
.badge.great{color:var(--gfp)} .badge.ok{color:var(--dapi)} .badge.bad{color:var(--fitc)} .badge.none{color:var(--mcherry)} .badge.unk{color:var(--muted);border-style:dashed}
.tool .cd{position:absolute;inset:0;background:rgba(4,8,13,.78);display:flex;align-items:center;justify-content:center;font-family:var(--f-data);font-size:13px;color:var(--muted)}
.tool.best{box-shadow:inset 0 0 0 1px var(--gfp)}

/* ---------- Números flotantes ---------- */
#floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-data);font-weight:700;font-size:20px;text-shadow:0 0 8px rgba(0,0,0,.9);animation:rise 1.1s ease-out forwards;white-space:nowrap}
.ft.dmg{color:#fff} .ft.great{color:var(--gfp);font-size:26px} .ft.bad{color:var(--fitc)} .ft.none{color:var(--mcherry)}
.ft.hurt{color:var(--mcherry)} .ft.heal{color:var(--gfp);font-size:16px} .ft.atp{color:var(--fitc);font-size:17px} .ft.info{color:var(--muted);font-size:15px;font-family:var(--f-body)}
@keyframes rise{0%{opacity:0;margin-top:8px}15%{opacity:1}100%{opacity:0;margin-top:-56px}}
@media (prefers-reduced-motion:reduce){.ft{animation-duration:1.6s}}

/* ---------- Laboratorio (panel) ---------- */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:#06111a;border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-20px 0 40px rgba(0,0,0,.5)}
#panel header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
#panel header h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:17px;flex:1}
#panel header .atp{color:var(--fitc)}
.x{width:34px;height:34px;border:1px solid var(--line);border-radius:6px;font-size:18px;line-height:1}
.tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
.tab{padding:9px 10px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gfp)}
.pbody{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:10px}
.pbody p.lead{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#081620}
.item h4{margin:0;font-size:14px;display:flex;gap:6px;align-items:center}
.item .lv{font-family:var(--f-data);font-size:12px;color:var(--muted);font-weight:500}
.item p{margin:0;grid-column:1;font-size:13px;color:var(--muted);line-height:1.4}
.item .eff{grid-column:1;font-size:12px;color:var(--gfp);font-family:var(--f-data)}
.buy{grid-column:2;grid-row:1 / span 3;align-self:center;min-width:92px;padding:8px 10px;border-radius:6px;border:1px solid var(--fitc);color:var(--fitc);font-family:var(--f-data);font-weight:700;font-size:13px}
.buy:disabled{border-color:var(--line);color:#4c6272;cursor:not-allowed}
.buy.done{border-color:var(--gfp);color:var(--gfp)}
.buy.evo{border-color:var(--gram);color:var(--gram)}
.atlas{display:grid;gap:10px}
.sp{padding:12px;border:1px solid var(--line);border-radius:8px;background:#081620}
.sp h4{margin:0;font-family:var(--f-display);font-weight:500;font-size:15px;display:flex;align-items:center;gap:8px}
.sp .sw{width:12px;height:12px;border-radius:50%}
.sp .sci{font-style:italic;color:var(--muted);font-size:12px}
.sp p{margin:6px 0 0;font-size:13px;line-height:1.45;color:#b9cfdb}
.sp .known{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sp.locked{opacity:.5}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.stat span:nth-child(odd){color:var(--muted)}
.stat span:nth-child(even){font-family:var(--f-data);text-align:right}

/* ---------- Ventanas modales ---------- */
#modal{position:absolute;inset:0;z-index:8;background:rgba(2,5,8,.72);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.mbox{width:min(560px,100%);max-height:calc(100% - 32px);overflow-y:auto;background:#06111a;border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.mbox .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gfp)}
.mbox h2{margin:4px 0 2px;font-family:var(--f-display);font-weight:700;font-size:24px;text-wrap:balance}
.mbox h2.big{font-size:34px}
.mbox .sci{font-style:italic;color:var(--muted)}
.mbox p{line-height:1.5;color:#c4d8e3;margin:10px 0 0}
.mbox ul{margin:10px 0 0;padding-left:18px;line-height:1.5;color:#c4d8e3}
.mbox li+li{margin-top:4px}
.mbox .go{margin-top:16px;padding:10px 18px;border-radius:7px;background:var(--gfp);color:#03150b;font-weight:700}
.mbox b{color:var(--fg)}

#toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;background:#06111a;border:1px solid var(--fitc);color:var(--fg);padding:9px 14px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}

/* ---------- Móvil ---------- */
@media (max-width:720px){
  html,body{font-size:14px}
  .brand{display:none}
  #hud{gap:6px}
  .res{margin-left:0}
  .chip{padding:5px 8px}
  .tog{padding:6px 8px;font-size:12px}
  #foe{top:auto;bottom:auto;top:calc(var(--hudH,96px) + 4px);padding:8px 10px}
  #foe h2{font-size:15px}
  .traits{margin-top:6px}
  .trait{font-size:11px;padding:1px 6px}
  #foe .sci{display:none}
  #tools{grid-template-columns:repeat(4,1fr);gap:4px;padding-top:6px}
  .tool{min-height:42px;padding:5px 6px;gap:2px}
  .tool .tn{font-size:11.5px}
  .tool .rc{display:none}
  .badge{font-size:10px;padding:0 4px}
  #me{width:auto;right:max(16px,env(safe-area-inset-right,0px));padding:6px 10px;bottom:calc(var(--toolsH,120px) + 6px);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:0 10px}
  #me .who small{display:none}
  #me .bar{margin-top:0}
  #me .barlbl{margin-top:0}
  #me .barlbl span:last-child{display:none}
  #msg{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;bottom:calc(var(--toolsH,120px) + 50px);font-size:13px;padding:6px 10px;line-height:1.35}
  #msg .extra{font-size:12px}
}
</style>

<div id="app">
  <canvas id="c" aria-label="Escena del combate"></canvas>
  <div id="floats"></div>

  <header id="hud">
    <div class="brand">Micro<b>cosmos</b></div>
    <div class="lvl"><span class="k">Nivel</span><span class="v num" id="hLvl">1</span><div class="pips" id="hPips"></div></div>
    <div class="res">
      <div class="chip atp"><span class="k">ATP</span><span class="v num" id="hAtp">0</span><small class="num" id="hAtps"></small></div>
      <div class="chip adn" id="hAdnBox" hidden><span class="k">ADN</span><span class="v num" id="hAdn">0</span></div>
    </div>
    <div class="ctrls">
      <button class="tog" id="bAuto" aria-pressed="false" title="Combate automático: usa la mejor herramienta que ya conozcas contra cada organismo"><span class="led"></span>Auto</button>
      <button class="tog" id="bAdv" aria-pressed="true" title="Avanzar: al acabar los 5 combates, enfréntate al jefe y pasa de nivel. Desactívalo para quedarte reuniendo ATP"><span class="led"></span>Avanzar</button>
      <button class="tog" id="bSnd" aria-pressed="true" title="Sonido"><span class="led"></span>Sonido</button>
      <button class="tog lab" id="bLab">Laboratorio<span class="dot" id="labDot" hidden></span></button>
    </div>
  </header>

  <section id="foe" class="card" aria-live="polite">
    <div class="eyebrow" id="fEye">Organismo</div>
    <h2 id="fName">—</h2>
    <div class="sci" id="fSci"></div>
    <div class="bar"><i id="fBar" style="width:100%"></i></div>
    <div class="barlbl"><span class="num" id="fHp"></span><span id="fAtk" class="num"></span></div>
    <div class="traits" id="fTraits"></div>
  </section>

  <section id="me" class="card">
    <div class="who">Macrófago<small>tu célula</small></div>
    <div class="bar me"><i id="mBar" style="width:100%"></i></div>
    <div class="barlbl"><span class="num" id="mHp"></span><span class="num" id="mAtk"></span></div>
  </section>

  <div id="msg" class="v-ok" aria-live="polite"><div class="verdict" id="msgV">Listo</div><div id="msgT">Elige una herramienta.</div><div class="extra" id="msgX"></div></div>

  <nav id="tools" aria-label="Herramientas de combate"></nav>

  <aside id="panel" hidden aria-label="Laboratorio">
    <header><h3>Laboratorio</h3><span class="num atp" id="pAtp"></span><button class="x" id="pClose" aria-label="Cerrar">×</button></header>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="mej" aria-selected="true">Orgánulos</button>
      <button class="tab" role="tab" data-tab="her" aria-selected="false">Herramientas</button>
      <button class="tab" role="tab" data-tab="atl" aria-selected="false">Atlas</button>
      <button class="tab" role="tab" data-tab="evo" aria-selected="false">Evolución</button>
    </div>
    <div class="pbody" id="pBody"></div>
  </aside>

  <div id="modal" hidden><div class="mbox" id="mBox"></div></div>
  <div id="toast" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

/* =====================================================================
   DATOS DE BIOLOGÍA
   ===================================================================== */
const KPL = 5; // combates normales por nivel antes del jefe

// Organismos. min = nivel en el que aparecen por primera vez.
const TYPES = {
  gp:{n:'Estafilococo',sci:'Staphylococcus aureus',min:1,col:0xa67bff,boss:'Biofilm de estafilococos',
    traits:['Bacteria Gram+','Pared de peptidoglucano gruesa','Fisión binaria'],
    desc:'Bacteria esférica (coco) que forma racimos. En la tinción de Gram queda violeta porque su gruesa pared de peptidoglucano retiene el cristal violeta. Cada pocos turnos se divide por fisión binaria y recupera vida.'},
  gn:{n:'Bacilo Gram−',sci:'Escherichia coli',min:3,col:0xff6fae,boss:'Colonia de E. coli',dodge:.15,dodgeWhy:'Su flagelo gira como una hélice y la aparta del golpe.',
    traits:['Bacteria Gram−','Membrana externa con LPS','Peptidoglucano fino','Flagelo'],
    desc:'Bacilo (bastón) que se tiñe de rosa en la tinción de Gram: su capa de peptidoglucano es fina y está escondida bajo una membrana externa de lipopolisacárido (LPS). Esa membrana frena a la lisozima y a muchos antibióticos. Su flagelo le permite esquivar.'},
  vir:{n:'Virus de la gripe',sci:'Influenzavirus A',min:6,col:0xffb547,boss:'Viremia',
    traits:['Acelular','Envoltura con espículas','Parásito intracelular obligado'],
    desc:'No es una célula: es material genético (ARN) dentro de una cápside y una envoltura con espículas de hemaglutinina y neuraminidasa. No tiene metabolismo propio, así que los antibióticos no le hacen nada. Turno sí, turno no, se esconde dentro de una célula del huésped para replicarse.'},
  lev:{n:'Levadura',sci:'Candida albicans',min:9,col:0xe0b35e,boss:'Candidiasis',
    traits:['Hongo unicelular','Pared de quitina','Ergosterol en la membrana','Gemación'],
    desc:'Hongo unicelular eucariota. Su pared es de quitina y glucanos (no de celulosa ni de peptidoglucano) y su membrana usa ergosterol en lugar de colesterol. Se reproduce por gemación: le brota una yema que crece.'},
  ame:{n:'Ameba',sci:'Amoeba proteus',min:12,col:0xb8f06a,boss:'Ameba gigante',dodge:.2,dodgeWhy:'Cambia de forma con sus pseudópodos y se escurre.',
    traits:['Protozoo','Sin pared celular','Pseudópodos','Vacuola contráctil pequeña'],
    desc:'Protozoo que se mueve emitiendo pseudópodos, prolongaciones de su citoplasma. No tiene pared celular: solo su membrana plasmática la separa del medio. Por eso cambia de forma y esquiva con facilidad.'},
  veg:{n:'Célula vegetal',sci:'Elodea canadensis (parénquima)',min:15,col:0x5dff8a,boss:'Tejido de parénquima',
    traits:['Pared de celulosa','Cloroplastos','Vacuola central','Fotosíntesis'],

function eff(toolId, e){
  const t = EFF[toolId];
  let [m, why] = t[e.type] || t.def;
  if (e.hidden && toolId !== 'tc' && toolId !== 'luz'){ m *= .15; why = 'El virus está escondido dentro de una célula: casi nada lo alcanza. Solo un linfocito T reconoce la célula infectada.'; }
  if (e.spore && toolId !== 'aut' && toolId !== 'luz'){ m *= .1; why = 'La endospora está deshidratada y blindada con proteínas y ácido dipicolínico. Solo el autoclave la destruye.'; }
  return {m, why};
}
function verdict(m){
  if (m >= 2) return ['great','Muy eficaz'];
  if (m >= 1) return ['ok','Eficaz'];
  if (m > 0) return ['bad','Poco eficaz'];
  return ['none','No le afecta'];
}

const SI = ['','k','M','G','T','P','E'];
function fmt(n){
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1).replace('.',',') : Math.floor(n).toString();
  const i = Math.min(SI.length-1, Math.floor(Math.log10(n)/3));
  if (i === SI.length-1 && n >= 1e21) return n.toExponential(2).replace('.',',');
  const v = n/Math.pow(1000,i);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : v.toFixed(0)).replace('.',',') + ' ' + SI[i];
}

function load(data){
  let d = data && data.S;
  if (!d){ try{ d = JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(_){ d = null; } }
  if (d && d.v === 1){ const f = fresh(), up = f.upg; S = Object.assign(f, d); S.upg = Object.assign(up, d.upg||{}); for (const k in S.upg) if (!isFinite(S.upg[k])) S.upg[k] = 0; if (!isFinite(S.atp)) S.atp = 0; S.best = Math.max(S.best||1, S.runMax||1, S.level||1); S.runMax = Math.max(S.runMax||1, S.level||1); return true; }
  return false;
}

let AC = null;
function tone(f, dur=.12, type='sine', vol=.08, slide=0){
  if (!S.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f,t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide), t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  }catch(_){}
}

  const pal = [0x6c95ff,0x4dffa0,0xff4f7b,0xa67bff,0x8fd3ff].map(h=>new THREE.Color(h));
  for (let i=0;i<N;i++){

    const c = pal[i%pal.length]; col[i*3]=c.r*.6; col[i*3+1]=c.g*.6; col[i*3+2]=c.b*.6;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));

  const m = new THREE.PointsMaterial({size:.22,map:GLOW,vertexColors:true,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});

// Eritrocitos al fondo: disco bicóncavo hecho por revolución (LatheGeometry)
const RBC = [];
(function(){
  // perfil: más fino en el centro que en el borde (bicóncavo)
  const pts = [];
  for (let i=0;i<=20;i++){ const r = i/20; const h = .12 + .28*r*r - .2*Math.pow(r,8); pts.push(new THREE.Vector2(r, h)); }
  for (let i=20;i>=0;i--){ const r = i/20; const h = .12 + .28*r*r - .2*Math.pow(r,8); pts.push(new THREE.Vector2(r, -h)); }
  const geo = new THREE.LatheGeometry(pts, 40);
  const mat = new THREE.MeshStandardMaterial({color:0x7a1022,roughness:.6,emissive:0x2a0308});
  for (let i=0;i<9;i++){
    const m = new THREE.Mesh(geo, mat);
    m.position.set(rnd(-26,26), rnd(-8,10), rnd(-34,-20));
    m.scale.setScalar(rnd(1.8,2.6));
    m.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));
    m.userData.spin = new THREE.Vector3(rnd(-.2,.2),rnd(-.2,.2),rnd(-.2,.2));
    m.userData.drift = rnd(.15,.4);
    scene.add(m); RBC.push(m);
  }
})();

  const base = geo.attributes.position.array.slice();
  const mat = new THREE.MeshStandardMaterial({color, roughness:opts.rough??.35, metalness:0, transparent:opts.op!=null, opacity:opts.op??1,
    emissive:opts.emi??new THREE.Color(color).multiplyScalar(.18), depthWrite:opts.op==null});
  const mesh = new THREE.Mesh(geo, mat);
  mesh.userData.wob = (t, amp=.08, f=2.2, sp=1) => {
    const a = geo.attributes.position.array;
    for (let i=0;i<a.length;i+=3){
      const x=base[i], y=base[i+1], z=base[i+2];
      const n = Math.sin(x*f + t*sp)*Math.sin(y*f*1.3 + t*1.1*sp)*Math.sin(z*f*.9 + t*.7*sp) + .5*Math.sin((x+z)*f*1.7 - t*1.3*sp);
      const s = 1 + amp*n;
      a[i]=x*s; a[i+1]=y*s; a[i+2]=z*s;
    }
    geo.attributes.position.needsUpdate = true; geo.computeVertexNormals();
  };
  return mesh;
}

}

const tweens = [];
const easeOut = p => 1 - Math.pow(1-p,3);
function tween(ms, fn, done){ tweens.push({t0:performance.now(), ms:ms/Math.max(1,(B&&S.auto?speed():1)), fn, done}); }
const parts = [];
function spark(pos, vel, color, life=.8, size=.35){
  const m = new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
  m.position.copy(pos); m.scale.setScalar(size); scene.add(m);
  parts.push({m, vel, life, max:life});
}
function burst(pos, color, n=24, sp=3){
  for (let i=0;i<n;i++) spark(pos, new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(.5,sp)), color, rnd(.4,.9), rnd(.2,.45));
}
function projectile(from, to, color, n, ms, cb){
  const shots = [];
  for (let i=0;i<n;i++){
    const m = new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
    m.scale.setScalar(rnd(.25,.5)); scene.add(m);
    shots.push({m, off:new THREE.Vector3(rnd(-.4,.4),rnd(-.4,.4),rnd(-.4,.4)), d:i/n*.35, arc:rnd(.5,1.4)});
  }
  tween(ms, p => {
    shots.forEach(s => { const q = clamp((p - s.d)/(1 - .35),0,1);
      s.m.position.lerpVectors(from, to, q).add(s.off.clone().multiplyScalar(Math.sin(q*Math.PI)));
      s.m.position.y += Math.sin(q*Math.PI)*s.arc; s.m.visible = q>0 && q<1; });
  }, () => { shots.forEach(s=>scene.remove(s.m)); cb && cb(); });
}
function lunge(obj, dir, ms, cb){
  const o = obj.position.clone();
  tween(ms, p => obj.position.copy(o).addScaledVector(dir, Math.sin(p*Math.PI)), () => { obj.position.copy(o); cb && cb(); });
}

const LOOK = new THREE.Vector3(0,.2,0);
function resize(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  // en vertical, las dos células se colocan en diagonal y la cámara se aleja lo justo para que quepan a lo ancho
  const a = w/h, portrait = a < .9;
  if (portrait){ P_POS.set(-1.3,-1.6,.9); E_POS.set(1.3,1.1,-.5); } else { P_POS.set(-2.3,-.1,.9); E_POS.set(2.3,.25,-.5); }
  // franja libre entre las fichas: la escena se encuadra en ella
  document.documentElement.style.setProperty('--toolsH', $('#tools').offsetHeight + 'px');
  document.documentElement.style.setProperty('--hudH', $('#hud').offsetHeight + 'px');
  const r = el => $(el).getBoundingClientRect();
  const top = portrait ? r('#foe').bottom : r('#hud').bottom;
  const bot = Math.min(r('#msg').top, r('#me').top);
  const band = Math.max(140, bot - top);
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const halfW = portrait ? 2.7 : 4.2, halfH = portrait ? 2.9 : 2.1;
  const dist = Math.max(8, halfW/(tanV*a), halfH*(h/band)/tanV);
  camera.position.set(-.5, 1.7, dist);
  LOOK.set(0, (P_POS.y + E_POS.y)/2, 0);
  camera.setViewOffset(w, h, 0, Math.round(h/2 - (top + bot)/2), w, h);
  camera.updateProjectionMatrix();
  if (!tweens.length){ player.position.copy(P_POS); if (foeObj) foeObj.g.position.copy(E_POS); }
  pLight.position.copy(P_POS).add(new THREE.Vector3(0,2,2));
  eLight.position.copy(E_POS).add(new THREE.Vector3(0,2,2));
}

let B = null; // combate actual
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function pickType(){
  const pool = TYPE_ORDER.filter(id => TYPES[id].min <= S.level);
  const newest = pool[pool.length-1];
  if (Math.random() < .4) return newest;
  return pool[Math.floor(Math.random()*pool.length)];
}
function bossType(){
  const pool = TYPE_ORDER.filter(id => TYPES[id].min <= S.level);
  // el jefe rota entre los tres organismos más recientes
  return pool[Math.max(0, pool.length-1 - ((S.level-1) % Math.min(3,pool.length)))];
}

function newBattle(keepHp){
  const boss = S.kills >= KPL && S.advance;
  const type = boss ? bossType() : pickType();
  const L = S.level;
  const max = 30*Math.pow(1.25,L-1)*(boss?4:1);
  const e = {type, boss, L, hp:max, max, atk:4*Math.pow(1.2,L-1)*(boss?1.4:1), turn:0, hidden:false, spore:false, dark:false, block:0, marked:0, grow:1};
  const php = keepHp != null ? keepHp : maxHp();
  B = {e, php: Math.min(php, maxHp()), cds:{}, busy:false, over:false, timer:null};
  setFoe(e);
  scene.background.setHex(0x03070c);
  renderFoe(); renderMe(); renderTools(); renderHud(); resize();
  setMsg('ok', boss ? '¡Jefe!' : 'Nuevo organismo', boss ? `${TYPES[type].boss}: más vida y más ataque. Vencerlo te lleva al nivel ${L+1}.` : `Observa sus características y elige la herramienta que las aproveche.`);
  if (!S.seen[type]){ S.seen[type] = true; save(); showSpecies(type, true); }
  else scheduleAuto();
}

function useTool(id){
  if (!B || B.busy || B.over || !S.tools[id] || (B.cds[id]||0) > 0 || !$('#modal').hidden) return;
  const T = TOOL[id], e = B.e;
  B.busy = true; clearTimeout(B.timer);
  const r = eff(id, e);
  (S.known[e.type] = S.known[e.type] || {})[id] = true;
  if (T.cd) B.cds[id] = T.cd + 1;
  renderTools();
  sfx.shoot();
  const from = P_POS.clone().add(new THREE.Vector3(.6,.3,0)), to = E_POS.clone();
  const go = () => {
    const Ty = TYPES[e.type];
    const dodge = (Ty.dodge||0) && id !== 'luz' && !e.spore && Math.random() < Ty.dodge;
    if (dodge){
      floatText('Esquiva', E_POS.clone().add(new THREE.Vector3(0,1.2,0)), 'info');
      setMsg('bad','Esquiva', Ty.dodgeWhy, '');
      tone(200,.1,'sine',.04);
    } else if (id === 'luz'){
      if (e.type === 'veg' && !e.dark){ e.dark = true; floatText('Sin fotosíntesis', E_POS.clone().add(new THREE.Vector3(0,1.4,0)), 'great'); }
      else floatText('Sin efecto', E_POS.clone().add(new THREE.Vector3(0,1.4,0)), 'none');
      const [v,l] = r.m > 0 ? ['great','Muy eficaz'] : ['none','No le afecta'];
      setMsg(v, `${T.n} · ${l}`, r.why);
      sfx.hit(r.m*2);
    } else {
      const mark = e.marked > 0 ? 1.6 : 1;
      const dmg = atk()*T.pow*r.m*mark*rnd(.9,1.1);
      e.hp = Math.max(0, e.hp - dmg);
      const [v,l] = verdict(r.m);
      floatText(r.m > 0 ? fmt(dmg) : 'Inmune', E_POS.clone().add(new THREE.Vector3(0,1.2,0)), r.m >= 2 ? 'great' : r.m >= 1 ? 'dmg' : r.m > 0 ? 'bad' : 'none');
      let extra = '';
      if (id === 'ac' && r.m > 0 && !e.hidden){ e.marked = 4; extra = 'Opsonizado: +60 % de daño durante 3 turnos.'; }
      if (id === 'tax' && r.m > 0){ e.block = 3; extra = 'Huso mitótico bloqueado durante 3 turnos.'; }
      if (mark > 1 && r.m > 0) extra = (extra ? extra + ' ' : '') + 'Daño aumentado por la opsonización.';
      setMsg(v, `${T.n} · ${l} (×${String(r.m).replace('.',',')})`, r.why, extra);
      if (r.m > 0){ burst(to, T.col, r.m >= 2 ? 40 : 18, r.m >= 2 ? 4 : 2.5); shake = r.m >= 2 ? .25 : .1; }
      sfx.hit(r.m);
    }
    renderFoe(); renderTools();
    if (e.hp <= 0) return setTimeout(win, 250);
    B.timer = setTimeout(enemyTurn, 420/(S.auto?speed():1));
  };
  if (id === 'fago') lunge(player, new THREE.Vector3(1.6,.15,-.5), 420, go);
  else projectile(from, to, T.col, id === 'luz' ? 1 : 12, 480, go);
  if (id === 'luz') { scene.background.setHex(0x010203); }
}

function enemyTurn(){
  if (!B || B.over) return;
  const e = B.e, Ty = TYPES[e.type];
  e.turn++;
  const notes = [];
  const heal = (f, why) => { const h = e.max*f; e.hp = Math.min(e.max, e.hp + h); floatText('+'+fmt(h), E_POS.clone().add(new THREE.Vector3(.6,1.5,0)), 'heal'); notes.push(why); };
  switch (e.type){
    case 'gp': if (e.turn % 3 === 0) heal(.15,'Fisión binaria: la colonia se divide y recupera un 15 % de vida.'); break;
    case 'lev': if (e.turn % 3 === 0) heal(.15,'Gemación: le brota una yema nueva (+15 % de vida).'); break;
    case 'vir': e.hidden = !e.hidden; notes.push(e.hidden ? 'El virus entra en una célula y se replica a escondidas.' : 'Nuevos viriones salen de la célula huésped: vuelve a estar expuesto.'); break;
    case 'veg': if (!e.dark) heal(.08,'Fotosíntesis: con la luz fabrica glucosa y se repara (+8 %).'); break;
    case 'can': if (e.block > 0) notes.push('El taxol frena su división.'); else heal(.12,'Mitosis descontrolada: +12 % de vida.'); break;
    case 'bac': if (!e.spore && e.hp < e.max*.35){ e.spore = true; notes.push('Esporulación: forma una endospora resistente y deja de atacar.'); burst(E_POS, 0x8fffe8, 30, 2); } break;
    case 'pri': e.grow *= 1.12; notes.push('Convierte proteínas sanas en priones: su ataque crece un 12 %.'); break;
  }
  const finish = () => {
    for (const k in B.cds) if (B.cds[k] > 0) B.cds[k]--;
    if (e.marked > 0) e.marked--;
    if (e.block > 0) e.block--;
    if (notes.length) $('#msgX').textContent = notes.join(' ');
    if (B.php > 0) B.busy = false;
    renderFoe(); renderMe(); renderTools();
    if (B.php <= 0) return setTimeout(lose, 300);
    scheduleAuto();
  };
  if (e.spore){ notes.push('La endospora está en reposo: no ataca.'); return setTimeout(finish, 200); }
  const hits = Ty.hits || 1;
  let i = 0;
  const hit = () => {
    const dir = P_POS.clone().sub(E_POS).normalize().multiplyScalar(1.4);
    lunge(foeObj.g, dir, 360, () => {
      const dmg = e.atk*e.grow*taken()*rnd(.85,1.15)/(hits>1?1.6:1);
      B.php = Math.max(0, B.php - dmg);
      floatText('−'+fmt(dmg), P_POS.clone().add(new THREE.Vector3(0,1.3,0)), 'hurt');
      burst(P_POS, 0xff4f7b, 12, 2); shake = .12; sfx.hurt();
      renderMe();
      if (++i < hits && B.php > 0) hit(); else finish();
    });
  };
  if (hits > 1) notes.push('Sus cilios baten en ondas: ataca dos veces.');
  hit();
}

function win(){
  const e = B.e; B.over = true;
  const g = reward(e.L, e.boss);
  S.atp += g; S.totalKills++; S.defeated[e.type] = (S.defeated[e.type]||0) + 1;
  floatText('+'+fmt(g)+' ATP', E_POS.clone().add(new THREE.Vector3(0,.6,0)), 'atp');
  burst(E_POS, TYPES[e.type].col, 60, 4.5); sfx.win();
  const obj = foeObj;
  tween(450, p => obj.g.scale.setScalar(obj.base*(1-easeOut(p))), () => { scene.remove(obj.g); });
  let hp;
  if (e.boss){
    S.level++; S.kills = 0; S.runMax = Math.max(S.runMax, S.level); S.best = Math.max(S.best, S.level);
    hp = maxHp();
    toast(`Nivel ${S.level}. ${newTypeAt(S.level) ? 'Aparece un organismo nuevo.' : ''}`);
  } else {
    S.kills = Math.min(KPL, S.kills + 1);
    hp = Math.min(maxHp(), B.php + maxHp()*.35);
  }
  setMsg('great','Victoria', `+${fmt(g)} ATP. ${e.boss ? 'Jefe derrotado.' : 'Recuperas un 35 % de vida.'}`);
  save(); renderHud();
  setTimeout(() => newBattle(hp), 900/(S.auto?speed():1));
}
const newTypeAt = L => TYPE_ORDER.some(id => TYPES[id].min === L);

function lose(){
  B.over = true; sfx.lose();
  const e = B.e;
  let txt;
  if (e.boss){ S.advance = false; txt = 'El jefe te ha vencido. Se ha desactivado «Avanzar»: reúne ATP, mejora tus orgánulos y vuelve a intentarlo.'; }
  else { S.level = Math.max(1, S.level-1); S.kills = 0; txt = `Te retiras al nivel ${S.level} para recuperarte.`; }
  burst(P_POS, 0xff4f7b, 40, 3);
  setMsg('none','Derrota', txt);
  toast(txt);
  save(); renderHud();
  setTimeout(() => newBattle(), 1500);
}

function autoPick(){
  const e = B.e; let best = null, bs = -1;
  for (const T of TOOLS){
    if (!S.tools[T.id] || (B.cds[T.id]||0) > 0) continue;
    const known = T.id === 'fago' || (S.known[e.type] && S.known[e.type][T.id]);
    if (!known) continue;
    const r = eff(T.id, e);
    let s;
    if (T.id === 'luz') s = e.type === 'veg' && !e.dark ? 99 : -1;
    else {
      s = T.pow*r.m;
      if (T.id === 'ac' && r.m > 0 && e.marked === 0 && !e.hidden) s *= 1.9;
      if (T.id === 'tax' && e.type === 'can' && e.block === 0) s *= 1.6;
    }
    if (s > bs){ bs = s; best = T.id; }
  }
  return best || 'fago';
}
function scheduleAuto(){
  if (!B || B.over || B.busy) return;
  clearTimeout(B.timer);
  if (S.auto && S.memoria && $('#modal').hidden) B.timer = setTimeout(() => useTool(autoPick()), 650/speed());
}

/* =====================================================================
   BUCLE PRINCIPAL
   ===================================================================== */
let last = performance.now(), hudAcc = 0, saveAcc = 0;
const clock = new THREE.Clock();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (now - last)/1000); last = now;
  const t = clock.getElapsedTime();
  // producción pasiva
  S.atp += atps()*dt;
  hudAcc += dt; saveAcc += dt;
  if (hudAcc > .25){ hudAcc = 0; $('#hAtp').textContent = fmt(S.atp); $('#pAtp').textContent = fmt(S.atp) + ' ATP'; $('#labDot').hidden = !anyAffordable(); if (!$('#panel').hidden) refreshAfford(); }
  if (saveAcc > 5){ saveAcc = 0; save(); }
  // tweens
  for (let i = tweens.length-1; i >= 0; i--){
    const w = tweens[i], p = clamp((now - w.t0)/w.ms, 0, 1);
    w.fn(p); if (p >= 1){ tweens.splice(i,1); w.done && w.done(); }
  }
  // partículas
  for (let i = parts.length-1; i >= 0; i--){
    const p = parts[i]; p.life -= dt;
    p.m.position.addScaledVector(p.vel, dt); p.vel.multiplyScalar(.94);
    p.m.material.opacity = Math.max(0, p.life/p.max);
    if (p.life <= 0){ scene.remove(p.m); p.m.material.dispose(); parts.splice(i,1); }
  }
  // seres vivos
  const mot = reduceMotion ? .3 : 1;
  pBody.userData.wob(t*mot, .09, 2.2, 1);
  pNuc.userData.wob(t*mot+5, .05, 3, .6);
  pLys.forEach((l,i) => { l.position.x += Math.sin(t*1.3+i)*.002*mot; l.position.y += Math.cos(t*1.1+i*2)*.002*mot; });
  player.rotation.y = Math.sin(t*.4)*.3;
  if (foeObj) foeObj.up(t*mot, B && B.e);
  dust.rotation.y = t*.01*mot; dust.position.y = Math.sin(t*.2)*.3;
  RBC.forEach(m => { m.rotation.x += m.userData.spin.x*dt*mot; m.rotation.y += m.userData.spin.y*dt*mot; m.position.x += m.userData.drift*dt*mot; if (m.position.x > 24) m.position.x = -24; });
  // cámara
  const sx = shake > 0 ? rnd(-shake,shake) : 0, sy = shake > 0 ? rnd(-shake,shake) : 0; shake = Math.max(0, shake - dt*.8);
  const bx = camera.position.x, by = camera.position.y;
  camera.position.x += Math.sin(t*.25)*.25*mot + sx; camera.position.y += Math.sin(t*.31)*.12*mot + sy;
  camera.lookAt(LOOK);
  renderer.render(scene, camera);
  camera.position.x = bx; camera.position.y = by;
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
function start(data){
  const had = load(data);
  // progreso sin conexión (máximo 8 horas)
  if (had){
    const away = clamp((Date.now() - (S.t||Date.now()))/1000, 0, 8*3600);
    const g = atps()*away;
    if (g > 1 && away > 30) setTimeout(() => toast(`Mientras no estabas, tus mitocondrias produjeron ${fmt(g)} ATP.`), 600);
    S.atp += g;
  }
  window.claude?.hot?.snapshot?.(() => ({S}));
  resize(); renderHud();
  if (!S.intro) showIntro(newBattle); else newBattle();
  requestAnimationFrame(t => { last = t; loop(t); });
  setTimeout(resize, 300);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
