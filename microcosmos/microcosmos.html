    const ks = Object.keys(EVENTS); e.ev = ks[Math.floor(Math.random()*ks.length)];
    if (e.ev === 'antib' && !BACT.has(type)) e.ev = 'fiebre';
    if (e.ev === 'vacuna'){ const k = S.known[type] = S.known[type] || {}; TOOLS.forEach(t => k[t.id] = true); }
  }
  B = {e, php:Math.min(keepHp != null ? keepHp : maxHp(), maxHp()), cds:{}, busy:false, over:false, timer:null,
    last:null, lastOk:false, usedAb:false, onlyFago:true, turns:0, firstDone:false, why:null};
  setFoe(e); setDark(false); setZoneTint(S.zone);
  renderFoe(); renderMe(); renderTools(); renderHud();
  const name = foeName(e);
  if (sp >= 0) setMsg('none', tr('Jefe especial'), tr('{n}: tiene dos fases. Al bajar a la mitad de vida cambiará de comportamiento.', {n:name}));
  else if (boss) setMsg('ok', tr('¡Jefe!'), tr('{n}: más vida y más ataque. Vencerlo te lleva al nivel {l}.', {n:name, l:L+1}));
  else setMsg('ok', tr('Nuevo organismo'), tr('Observa sus características y elige la herramienta que las aproveche.'),
    e.ev ? EVENTS[e.ev].n + ': ' + EVENTS[e.ev].d : e.res ? tr('¡Cepa resistente! El uso repetido de penicilina ha seleccionado estafilococos SARM.') : '');
  resize(); // después del mensaje: su altura cambia el encuadre
  if (e.ev) toast(EVENTS[e.ev].n);
  if (boss) startMusic(sp >= 0);
  const go = () => { if (!S.seen[type]){ S.seen[type] = true; save(); checkAch(); showSpecies(type, true); } else scheduleAuto(); };
  if (sp >= 0) cinematic(tr('Jefe · nivel {l}', {l:L}), name, go); else go();
}
const foeName = e => e.special >= 0 ? SPECIAL[e.special].n : e.boss ? TYPES[e.type].boss : e.res ? tr('Estafilococo resistente (SARM)') : TYPES[e.type].n;

function useTool(id){
  if (!B || B.busy || B.over || !owns(id) || (B.cds[id] || 0) > 0 || !$('#modal').hidden) return;
  const T = TOOL[id], e = B.e;
  B.busy = true; clearTimeout(B.timer); B.turns++;
  const r = eff(id, e);
  (S.known[e.type] = S.known[e.type] || {})[id] = true;
  if (T.cd) B.cds[id] = T.cd + 1;
  if (T.ab){ B.usedAb = true; S.press = Math.min(100, S.press + 4); }
  if (id !== 'fago') B.onlyFago = false;
  B.why = {tool:id, m:r.m};
  renderTools();
  sfx.shoot();
  const from = P_POS.clone().add(V(.6,.3,0)), to = E_POS.clone();
  const go = () => {
    const Ty = TYPES[e.type];
    const dodge = (Ty.dodge || 0) && id !== 'luz' && !e.spore && Math.random() < Ty.dodge;
    let ok = false;
    if (dodge){
      floatText(tr('Esquiva'), E_POS.clone().add(V(0,1.2,0)), 'info');
      setMsg('bad', tr('Esquiva'), Ty.dodgeWhy, '');
      tone(200, .1, 'sine', .04);
    } else if (id === 'luz'){
      ok = r.m > 0;
      if (e.type === 'veg' && !e.dark){ e.dark = true; floatText(tr('Sin fotosíntesis'), E_POS.clone().add(V(0,1.4,0)), 'great'); }
      else floatText(tr('Sin efecto'), E_POS.clone().add(V(0,1.4,0)), 'none');
      setMsg(r.m > 0 ? 'great' : 'none', `${T.n} · ${r.m > 0 ? tr('Muy eficaz') : tr('No le afecta')}`, r.why);
      sfx.hit(r.m*2);
    } else {
      ok = r.m > 0;
      const cb = cellD().bonus[e.type] || 1, mark = e.marked > 0 ? 1.6 : 1, vac = e.ev === 'vacuna' && id === 'ac' ? 2 : 1;
      const dmg = atk()*T.pow*r.m*mark*cb*vac*dmgMods(e, true)*rnd(.9, 1.1);
      e.hp = Math.max(0, e.hp - dmg);
      const [v, l] = verdict(r.m);
      floatText(r.m > 0 ? fmt(dmg) : tr('Inmune'), E_POS.clone().add(V(0,1.2,0)), r.m >= 2 ? 'great' : r.m >= 1 ? 'dmg' : r.m > 0 ? 'bad' : 'none');
      const extra = [];
      if (r.combo){ extra.push(tr('Combinación: {n}.', {n:r.combo.n}));
        if (!S.combos[r.combo.id]){ S.combos[r.combo.id] = true; toast(tr('¡Combinación descubierta: {n}!', {n:r.combo.n})); }
        S.comboCount++; dailyProg('combo'); }
      if (id === 'ac' && r.m > 0 && !e.hidden){ e.marked = 4; extra.push(tr('Opsonizado: +60 % de daño durante 3 turnos.')); }
      if (id === 'tax' && r.m > 0){ e.block = 3; extra.push(tr('Huso mitótico bloqueado durante 3 turnos.')); }
      if (mark > 1 && r.m > 0) extra.push(tr('Daño aumentado por la opsonización.'));
      if (cb > 1 && r.m > 0) extra.push(tr('{c}: ×{k} contra este organismo.', {c:cellD().n, k:dec(cb)}));
      setMsg(v, `${T.n} · ${l} (×${dec(Math.round(r.m*100)/100)})`, r.why, extra.join(' '));
      if (r.m > 0){ burst(to, T.col, r.m >= 2 ? 40 : 18, r.m >= 2 ? 4 : 2.5); shake = S.calm ? 0 : r.m >= 2 ? .25 : .1; if (r.m >= 2) impact(to, T.col); }
      if (r.m >= 2) dailyProg('great');
      sfx.hit(r.m);
    }
    if (!B.firstDone){ B.firstDone = true; S.first.n++; if (r.m >= 2) S.first.ok++; }
    B.last = id; B.lastOk = ok;
    // fase 2 de los jefes especiales
    if (e.special >= 0 && e.phase === 1 && e.hp > 0 && e.hp < e.max*.5){
      e.phase = 2; toast(special(e).n + ' · ' + tr('fase 2')); $('#msgX').textContent = special(e).p2; shake = S.calm ? 0 : .35; impact(E_POS, 0xff4f7b);
    }
    renderFoe(); renderTools();
    if (e.hp <= 0) return setTimeout(win, 250);
    B.timer = setTimeout(enemyTurn, 420/(S.auto ? speed() : 1));
  };
  if (id === 'fago'){ const dir = E_POS.clone().sub(P_POS); tween(560, p => PL.reach(p, dir)); lunge(player, dir.clone().normalize().multiplyScalar(1.3), 560, go); }
  else projectile(from, to, T.col, id === 'luz' ? 1 : 10, 520, go, id);
  if (id === 'luz') setDark(true);
}

function enemyTurn(){
  if (!B || B.over) return;
  const e = B.e, Ty = TYPES[e.type];
  e.turn++;
  const notes = [];
  const heal = (f, why) => { const h = e.max*f; e.hp = Math.min(e.max, e.hp + h); floatText('+' + fmt(h), E_POS.clone().add(V(.6,1.5,0)), 'heal'); notes.push(why); };
  switch (e.type){
    case 'gp': if (e.turn % 3 === 0) heal(.15, tr('Fisión binaria: la colonia se divide y recupera un 15 % de vida.')); break;
    case 'lev': if (e.turn % 3 === 0) heal(.15, tr('Gemación: le brota una yema nueva (+15 % de vida).')); break;
    case 'vir':
      e.hidden = !e.hidden; notes.push(e.hidden ? tr('El virus entra en una célula y se replica a escondidas.') : tr('Nuevos viriones salen de la célula huésped: vuelve a estar expuesto.'));
      if (e.turn % 4 === 0){ e.drift++; notes.push(tr('Deriva antigénica: sus espículas mutan y los anticuerpos pierden eficacia.')); } break;
    case 'veg': if (!e.dark) heal(.08, tr('Fotosíntesis: con la luz fabrica glucosa y se repara (+8 %).')); break;
    case 'can': if (e.block > 0) notes.push(tr('El taxol frena su división.')); else heal(.12, tr('Mitosis descontrolada: +12 % de vida.')); break;
    case 'bac': if (!e.spore && e.hp < e.max*.35){ e.spore = true; notes.push(tr('Esporulación: forma una endospora resistente y deja de atacar.')); burst(E_POS, 0x8fffe8, 30, 2); } break;
    case 'pri': e.grow *= 1.12; notes.push(tr('Convierte proteínas sanas en priones: su ataque crece un 12 %.')); break;
  }
  if ((e.type === 'gp' || e.type === 'gn') && e.turn === 6 && !e.biofilm){ e.biofilm = true; notes.push(tr('Biopelícula: se rodea de una matriz de polisacáridos que frena tus ataques (×0,6). El autoclave la atraviesa.')); }
  // eventos
  if (e.ev === 'antib' && BACT.has(e.type)){ const d = e.max*.08; e.hp = Math.max(0, e.hp - d); floatText('−' + fmt(d), E_POS.clone().add(V(-.5,1.5,0)), 'bad'); notes.push(tr('El antibiótico en sangre le resta un 8 %.')); }
  if (e.ev === 'inflam'){ const h = maxHp()*.06; B.php = Math.min(maxHp(), B.php + h); floatText('+' + fmt(h), P_POS.clone().add(V(0,1.5,0)), 'heal'); }
  // fase 2 de jefes especiales
  if (e.phase === 2){
    if (e.special === 0){ const d = maxHp()*.05; B.php = Math.max(0, B.php - d); notes.push(tr('Choque endotóxico: el LPS te resta un 5 % de vida.')); }
    if (e.special === 2 && !(e.block > 0)) heal(.1, tr('Angiogénesis: los vasos nuevos lo curan un 10 %.'));
    if (e.special === 3){ e.grow *= 1.2; notes.push(tr('Agregación: su ataque crece un 20 %.')); }
  }
  if (e.hp <= 0){ renderFoe(); return setTimeout(win, 250); }
  const finish = () => {
    for (const k in B.cds) if (B.cds[k] > 0) B.cds[k]--;
    if (e.marked > 0) e.marked--;
    if (e.block > 0) e.block--;
    if (notes.length) $('#msgX').textContent = notes.join(' ');
    if (B.php > 0) B.busy = false;
    B.why = null;
    renderFoe(); renderMe(); renderTools();
    if (B.php <= 0) return setTimeout(lose, 300);
    scheduleAuto();
  };
  if (e.spore){ notes.push(tr('La endospora está en reposo: no ataca.')); return setTimeout(finish, 200); }
  const hits = Ty.hits || 1;
  let i = 0;
  if (hits > 1) notes.push(tr('Sus cilios baten en ondas: ataca dos veces.'));
  const hit = () => {
    const dir = P_POS.clone().sub(E_POS).normalize().multiplyScalar(1.4);
    lunge(foeObj.g, dir, 360, () => {
      const dmg = e.atk*e.grow*taken()*dmgMods(e, false)*rnd(.85, 1.15)/(hits > 1 ? 1.6 : 1);
      B.php = Math.max(0, B.php - dmg);
      floatText('−' + fmt(dmg), P_POS.clone().add(V(0,1.3,0)), 'hurt');
      burst(P_POS, 0xff4f7b, 12, 2); shake = S.calm ? 0 : .12; sfx.hurt();
      renderMe();
      if (++i < hits && B.php > 0) hit(); else finish();
    });
  };
  hit();
}

function win(){
  const e = B.e; if (B.over) return; B.over = true; stopMusic();
  const g = reward(e.L, e.boss)*(e.ev === 'hipoxia' ? 1.5 : 1)*(e.special >= 0 ? 2 : 1);
  S.atp += g; S.totalKills++; S.defeated[e.type] = (S.defeated[e.type] || 0) + 1;
  if (e.special >= 0) S.specialWins++;
  if (BACT.has(e.type) && !B.usedAb){ S.press = Math.max(0, S.press - 2); dailyProg('noab'); }
  if (B.onlyFago) dailyProg('fago');
  if (B.turns <= 3) dailyProg('quick');
  if (e.boss) dailyProg('boss');
  dailyProg('kills');
  LOG.unshift({L:e.L, n:foeName(e), turns:B.turns, g, win:true}); LOG.length = Math.min(LOG.length, 8);
  floatText('+' + fmt(g) + ' ATP', E_POS.clone().add(V(0,.6,0)), 'atp');
  burst(E_POS, TYPES[e.type].col, S.calm ? 20 : 60, 4.5); sfx.win();
  const obj = foeObj;
  tween(450, p => obj.g.scale.setScalar(obj.base*(1 - easeOut(p))), () => { scene.remove(obj.g); });
  let hp;
  if (e.boss){
    S.stats.lvl[e.L] = Math.round((Date.now() - (S.stats.lvlStart || Date.now()))/1000); S.stats.lvlStart = Date.now();
    S.level++; S.kills = 0; S.runMax = Math.max(S.runMax, S.level); S.best = Math.max(S.best, S.level);
    hp = maxHp();
    const nt = TYPE_ORDER.some(id => TYPES[id].min === S.level);
    toast(tr('Nivel {l}.', {l:S.level}) + (nt ? ' ' + tr('Aparece un organismo nuevo.') : ''));
  } else {
    S.kills = Math.min(KPL, S.kills + 1);
    hp = Math.min(maxHp(), B.php + maxHp()*.35);
  }
  setMsg('great', tr('Victoria'), tr('+{g} ATP.', {g:fmt(g)}) + ' ' + (e.boss ? tr('Jefe derrotado.') : tr('Recuperas un 35 % de vida.')));
  checkAch(); save(); renderHud(); renderLog();
  setTimeout(() => newBattle(hp), 900/(S.auto ? speed() : 1));
}

function lose(){
  if (B.over) return; B.over = true; sfx.lose(); stopMusic();
  const e = B.e;
  S.stats.deaths[e.L] = (S.stats.deaths[e.L] || 0) + 1;
  LOG.unshift({L:e.L, n:foeName(e), turns:B.turns, g:0, win:false}); LOG.length = Math.min(LOG.length, 8);
  let txt;
  if (e.boss){ S.advance = false; txt = tr('El jefe te ha vencido. Se ha desactivado «Avanzar»: reúne ATP, mejora tus orgánulos y vuelve a intentarlo.'); }
  else { S.level = Math.max(1, S.level-1); S.kills = 0; txt = tr('Te retiras al nivel {l} para recuperarte.', {l:S.level}); }
  burst(P_POS, 0xff4f7b, 40, 3);
  setMsg('none', tr('Derrota'), txt);
  toast(txt);
  save(); renderHud(); renderLog();
  setTimeout(() => newBattle(), 1500);
}

function autoPick(){
  const e = B.e; let best = null, bs = -1;
  for (const T of TOOLS){
    if (!owns(T.id) || (B.cds[T.id] || 0) > 0) continue;
    const known = T.id === 'fago' || (S.known[e.type] && S.known[e.type][T.id]);
    if (!known) continue;
    const r = eff(T.id, e, {known:true});
    let s;
    if (T.id === 'luz') s = e.type === 'veg' && !e.dark ? 99 : -1;
    else {
      s = T.pow*r.m;
      if (T.id === 'ac' && r.m > 0 && e.marked === 0 && !e.hidden) s *= 1.9;
      if (T.id === 'tax' && e.type === 'can' && e.block === 0) s *= 1.6;
      // preparar una combinación conocida
      if (COMBOS.some(c => c.first === T.id && S.combos[c.id] && (!c.types || c.types.includes(e.type)) && owns(c.then) && !(B.cds[c.then] > 1)) && r.m > 0) s *= 1.3;
    }
    if (s > bs){ bs = s; best = T.id; }
  }
  return best || 'fago';
}
function scheduleAuto(){
  if (!B || B.over || B.busy) return;
  clearTimeout(B.timer);
  if (S.auto && canAuto() && $('#modal').hidden && !CINE) B.timer = setTimeout(() => useTool(autoPick()), 650/speed());
}

    b.dataset.sure = '1'; b.textContent = tr('Confirmar borrado'); return;
  } else return;
  save(); renderHud(); renderMe(); renderPanel();
});
function evolve(){
  const g = evoGain(); if (!g) return;
  if (B){ B.over = true; clearTimeout(B.timer); }
  S.adn += g; S.evos++;
  S.level = 1; S.kills = 0; S.runMax = 1; S.atp = 0; S.advance = true; S.press = 0; S.stats.lvlStart = Date.now();
  for (const k in S.upg) S.upg[k] = 0;
  checkAch(); rebuildPlayer(); save(); closeLab(); renderHud();
  const unlocked = Object.entries(CELLS).filter(([, c]) => c.need === S.evos).map(([, c]) => c.n);
  showModal(`<div class="intro"><div class="fov big">${thumb('me') ? `<img src="${thumb('me')}" alt="">` : ''}</div><div>
    <div class="eyebrow" style="color:var(--gram)">${tr('Evolución {n}', {n:S.evos})}</div><h2>${tr('Tu linaje hereda {g} de ADN', {g})}</h2>
    <p>${tr('Ahora tienes {a} de ADN: ×{m} de ataque, vida y ATP. Vuelves al nivel 1 con las herramientas y todo lo que has aprendido.', {a:S.adn, m:dec(adnM().toFixed(1))})}</p>
    ${unlocked.length ? `<p><b>${tr('Nueva célula disponible: {n}.', {n:unlocked.join(', ')})}</b> ${tr('Elígela en la pestaña Evolución.')}</p>` : ''}</div></div>
    ${phylo()}<button class="go" id="mGo">${tr('Seguir')}</button>`, () => newBattle());
}

// Ficha de organismo nuevo con pregunta: ¿qué herramienta funcionará mejor?
function showSpecies(id, isNew){
  const Ty = TYPES[id];
  let quiz = '';
  if (isNew){
    const fake = {type:id};
    const scored = TOOLS.filter(t => t.id !== 'luz' || id === 'veg').map(t => ({t, m:eff(t.id, fake).m*(t.pow || 1)}));
    const best = scored.reduce((a, b) => b.m > a.m ? b : a);
    const pool = scored.filter(s => s.t !== best.t && s.m < best.m*.7);
    SEED = hashStr(id) % 1000 + 7; const pick = [];
    while (pick.length < 3 && pool.length) pick.push(pool.splice(Math.floor(sr()*pool.length), 1)[0]);
    const opts = [best, ...pick].sort(() => sr() - .5);
    quiz = `<div class="quiz" id="quiz"><div class="eyebrow">${tr('Pregunta')}</div><b>${tr('¿Qué herramienta crees que funcionará mejor?')}</b>
      <div class="qopts">${opts.map(o => `<button data-q="${o.t.id}">${vesicle(o.t.id, o.t.col)}${o.t.n}</button>`).join('')}</div><p class="qres" id="qres" aria-live="polite"></p></div>`;
    showModal(`<div class="spec">${fov(id, 'big', LAB[id][1])}<div>
      <div class="eyebrow" style="color:${hex(Ty.col)}">${tr('Organismo nuevo · añadido al Atlas')} · ${tr('prep. nº')} ${prep(id)}</div>
      <h2>${Ty.n}</h2><div class="sci">${Ty.sci}</div><div class="stain">${ico('slide')}${LAB[id][0]}</div>
      <p>${Ty.desc}</p><div class="traits">${Ty.traits.map(([x]) => `<span class="trait">${esc(x)}</span>`).join('')}</div></div></div>
      ${quiz}<button class="go" id="mGo" hidden>${tr('Al combate')}</button>`);
    $('#quiz').querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
      const ok = b.dataset.q === best.t.id; S.quiz.n++;
      $('#quiz').querySelectorAll('[data-q]').forEach(x => { x.disabled = true; if (x.dataset.q === best.t.id) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
      (S.known[id] = S.known[id] || {})[best.t.id] = true;
      let msg = (ok ? tr('¡Correcto!') : tr('No exactamente: la mejor es {t}.', {t:best.t.n})) + ' ' + eff(best.t.id, fake).why;
      if (ok){ S.quiz.ok++; const g = reward(S.level, false)*8; if (!S.clase) S.atp += g; msg += S.clase ? '' : ' ' + tr('+{g} ATP.', {g:fmt(g)}); sfx.ach(); }
      if (!owns(best.t.id)) msg += ' ' + tr('Todavía no la tienes: búscala en el Laboratorio.');
      $('#qres').textContent = msg; $('#qres').className = 'qres ' + (ok ? 'ok' : 'no');
      const go = $('#mGo'); go.hidden = false; go.onclick = closeModal; go.focus();
      checkAch(); save(); renderHud(); renderTools();
    });
    return;
  }
  showModal(`<div class="spec">${fov(id, 'big', LAB[id][1])}<div><h2>${Ty.n}</h2><div class="sci">${Ty.sci}</div><p>${Ty.desc}</p><button class="go" id="mGo">${tr('Cerrar')}</button></div></div>`);
}

      <li>${vesicle('pen', 0x4dffa0)}<div><b>${tr('Aprovecha sus características.')}</b> ${tr('La penicilina destruye la pared de peptidoglucano, pero un virus no tiene pared. El agua destilada revienta a una célula sin pared, pero no a una vegetal.')}</div></li>
      <li>${vesicle('lis', 0x9be7ff)}<div><b>${tr('Combina herramientas')}</b> ${tr('y vigila la resistencia a los antibióticos: si abusas de la penicilina, aparecerán cepas resistentes.')}</div></li>
      <li>${vesicle('atp', 0xffc65c)}<div><b>${tr('Gana ATP')}</b> ${tr('en cada victoria y gástalo en el Laboratorio: orgánulos más potentes y herramientas nuevas.')}</div></li>
      <li>${vesicle('map', 0x8fd3ff)}<div><b>${tr('Elige la zona')}</b> ${tr('del cuerpo en el mapa. Cada nivel tiene 5 combates y un jefe, y cada 10 niveles llega un jefe especial.')}</div></li>
      <li>${vesicle('dna', 0xa67bff)}<div><b>${tr('Evoluciona')}</b> ${tr('cuando te atasques: empiezas de nuevo con ADN que te hace más fuerte, y desbloqueas otras células del sistema inmune.')}</div></li>
    </ul>
    <p class="hint">${tr('Teclas 1–9: usar herramientas. El progreso se guarda en este navegador. En Ajustes encontrarás el modo clase, otros idiomas y opciones de accesibilidad.')}</p>
    <button class="go" id="mGo">${tr('Empezar')}</button>`, () => { S.intro = true; save(); then && then(); });
  $('#mBox').querySelectorAll('[data-ilang]').forEach(b => b.onclick = () => { setLang(b.dataset.ilang); showIntro(then); });
}

/* =====================================================================
   BUCLE PRINCIPAL
   ===================================================================== */
let last = performance.now(), hudAcc = 0, saveAcc = 0, fpsN = 0, fpsT = 0, slow = 0;
const clock = new THREE.Clock();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.1, (now - last)/1000); last = now; FRAME++;
  const t = clock.getElapsedTime();
  S.atp += atps()*dt;
  hudAcc += dt; saveAcc += dt;
  if (hudAcc > .25){ hudAcc = 0; $('#hAtp').textContent = fmt(S.atp); if (!S.clase) $('#pAtp').innerHTML = ico('atp') + fmt(S.atp); $('#labDot').hidden = !anyAffordable(); if (!$('#panel').hidden) refreshAfford(); }
  if (saveAcc > 5){ saveAcc = 0; save(); }
  // calidad automática: si va lento, se reduce
  fpsN++; fpsT += dt;
  if (fpsT > 4){ const fps = fpsN/fpsT; fpsN = 0; fpsT = 0;
    slow = fps < 28 && t > 8 && !document.hidden ? slow + 1 : 0; // dos mediciones lentas seguidas, pasado el arranque
    if (S.q === 'auto' && slow >= 2 && QL > 0){ slow = 0; applyQuality(QL - 1); toast(tr('Calidad gráfica reducida para que el juego vaya más fluido.')); } }
  for (let i = tweens.length-1; i >= 0; i--){
    const w = tweens[i], p = clamp((now - w.t0)/w.ms, 0, 1);
    w.fn(p); if (p >= 1){ tweens.splice(i, 1); w.done && w.done(); }
  }
  for (let i = parts.length-1; i >= 0; i--){
    const p = parts[i]; p.life -= dt;
    p.m.position.addScaledVector(p.vel, dt); p.vel.multiplyScalar(.94);
    p.m.material.opacity = Math.max(0, p.life/p.max);
    if (p.life <= 0){ scene.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); }
  }
  const mot = reduceMotion || S.calm ? .3 : 1;
  player.rotation.y = Math.sin(t*.4)*.3;
  PL.up(t*mot);
  if (foeObj) foeObj.up(t*mot, B && B.e);
  ENV.dark.value += (darkTarget - ENV.dark.value)*Math.min(1, dt*3);
  ENV.tint.value.lerp(tintTarget, Math.min(1, dt*2));
  hemi.intensity = .55*(1 - .55*ENV.dark.value);
  ENV.up(t, dt, mot);
  const sx = shake > 0 ? rnd(-shake, shake) : 0, sy = shake > 0 ? rnd(-shake, shake) : 0; shake = Math.max(0, shake - dt*.8);
  const bp = camera.position.clone();
  camera.position.x += Math.sin(t*.25)*.25*mot + sx; camera.position.y += Math.sin(t*.31)*.12*mot + sy;
  // plano cinematográfico: la cámara se acerca al jefe
  if (CINE > 0){ camera.position.lerp(E_POS.clone().add(V(-1.2, .9, 4.2)), CINE*.75); }
  camera.lookAt(CINE > 0 ? LOOK.clone().lerp(E_POS, CINE*.8) : LOOK);
  renderer.render(scene, camera);
  camera.position.copy(bp);
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
function start(data){
  const had = load(data);
  const away = had ? clamp((Date.now() - (S.t || Date.now()))/1000, 0, 8*3600) : 0; // antes de que nada guarde la partida
  setLang(S.lang || detectLang());
  applyQuality(S.q === 'auto' ? 2 : S.q);
  rebuildPlayer(); setZoneTint(S.zone); ensureDaily();
  // progreso sin conexión (máximo 8 horas)
  const g = atps()*away;
  if (g > 1 && away > 30){ S.atp += g; setTimeout(() => toast(tr('Mientras no estabas, tus mitocondrias produjeron {g} ATP.', {g:fmt(g)})), 600); }
  window.claude?.hot?.snapshot?.(() => ({S}));
  resize(); renderHud();
  if (!S.intro) showIntro(newBattle); else newBattle();
  requestAnimationFrame(t => { last = t; loop(t); });
  setTimeout(resize, 300);
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
