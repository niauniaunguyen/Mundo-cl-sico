<!doctype html><html><head><meta charset="utf-8"><title>Visor de columnas</title>
<style>html,body{margin:0;background:#a9c7e0;overflow:hidden}canvas{display:block}</style></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// Columnas de comparación: a la izquierda con las piezas de siempre (modelos/atenas_modelos.glb, C_*), a la derecha con las de
// detalle (modelos/arquitectura.glb, K_*), montadas como en finishColumns(). ?orden=dorico|jonico|corintio &cam=lejos|capitel|basa
const Q=new URLSearchParams(location.search),W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(1);r.setSize(W,H);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color('#a9c7e0');const cam=new THREE.PerspectiveCamera(30,W/H,0.05,200);
s.add(new THREE.HemisphereLight(0xd6e4f2,0x8a7552,0.62));const sun=new THREE.DirectionalLight(0xfff0d2,1.0);sun.position.set(-4,6,5);s.add(sun);
const mat=new THREE.MeshLambertMaterial({color:'#efe7d8'}),shade=new THREE.MeshLambertMaterial({color:'#ddd3c2'});
const L=new THREE.GLTFLoader(),get=(u)=>new Promise(ok=>L.load(u,g=>{const T={};g.scene.traverse(o=>{if(o.isMesh)T[o.name]=o.geometry;});ok(T);}));
window.READY=false;
Promise.all([get('../../modelos/atenas_modelos.glb'),get('../../modelos/arquitectura_juego.glb')]).then(([A,K])=>{
  const ord=Q.get('orden')||'dorico',rr=0.6,h=ord==='dorico'?5.5*rr*2:9*rr*2;
  const put=(geo,x,y,sx,sy,sz,m)=>{const me=new THREE.Mesh(geo,m||mat);me.position.set(x,y,0);me.scale.set(sx,sy,sz);s.add(me);};
  for(const[x,P,pre]of[[-1.15,A,'C_'],[1.15,K,'K_']]){
    if(ord==='dorico'){const eh=0.62*rr/0.95;put(P[pre+'doric_shaft'],x,0,rr,h-eh,rr);put(P[pre+'doric_echinus'],x,h-eh,rr,rr/0.95,rr);const ab=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),shade);ab.position.set(x,h-0.3*rr/0.95/2,0);ab.scale.set(rr*2.7,0.3*rr/0.95,rr*2.7);s.add(ab);}
    else{const ch=(ord==='corintio'?2.3:1.0)*rr,bh=0.56*rr;put(P[pre+'ionic_base'],x,0,rr,rr,rr);put(P[pre+'ionic_shaft'],x,bh,rr,h-bh-ch,rr);put(P[pre+(ord==='corintio'?'corinthian_capital':'ionic_capital')],x,h-ch,rr,rr,rr);}}
  const v=Q.get('cam')||'lejos';
  if(v==='lejos'){cam.position.set(0,h*0.55,h*1.55);cam.lookAt(0,h*0.5,0);}
  else if(v==='capitel'){cam.position.set(0,h+0.5,5.2);cam.lookAt(0,h-0.35,0);}
  else if(v==='bajo'){cam.position.set(0,h-1.3,4.2);cam.lookAt(0,h-0.4,0);}
  else if(v==='basa'){cam.position.set(0,1.0,5.0);cam.lookAt(0,0.45,0);}
  r.render(s,cam);window.READY=true;});
</script></body></html>
