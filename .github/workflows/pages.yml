# Publica Nóstos en GitHub Pages cada vez que se sube un cambio a la rama principal o a la de desarrollo.
# Antes hay que activar Pages una vez: Settings → Pages → Source: «GitHub Actions».
name: Publicar Nóstos
on:
  push:
    branches: [main, main-djww2r]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar la web
        run: |
          mkdir -p _site
          cp atenas.html _site/index.html
          cp version.json _site/version.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
